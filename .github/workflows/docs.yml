name: docs

on:
  pull_request:
  merge_group:  # the merge queue runs the checks on the merged result (ADR 012)
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate docs bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the stale list and the pin report read earlier commits
      - name: install validator dependency
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyyaml==6.0.2
      - name: validate bundle
        run: .venv/bin/python scripts/validate_docs.py
      - name: check document-status register
        run: .venv/bin/python scripts/validate_docs.py --check-status
      - name: test the validator
        run: .venv/bin/python scripts/test_validate_docs.py
      - name: check the onboarding guide is a fresh build, its coverage and its pins
        run: .venv/bin/python scripts/build_onboarding.py --check
      - name: list the stale items of the guide with the change of each source
        if: failure()
        run: .venv/bin/python scripts/build_onboarding.py --stale
      - name: test the onboarding guide's build checks
        run: .venv/bin/python scripts/test_build_onboarding.py
      - name: report the guide's pin changes for the reviewer
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/pin_report.py --base "origin/$BASE_REF" >> "$GITHUB_STEP_SUMMARY"
      - name: attach the guide to the run for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clutch-onboarding
          path: docs/onboarding/clutch-onboarding.html
          if-no-files-found: error
          retention-days: 14
      - name: check the log is a fresh build of its fragments
        run: .venv/bin/python scripts/build_log.py --check
      - name: refuse restricted terms and secrets
        run: .venv/bin/python scripts/check_redaction.py
      - name: check every source file's licence line
        run: .venv/bin/python scripts/check_licences.py
      - name: check that the invariants name tests that exist
        run: .venv/bin/python scripts/check_invariants.py
      - name: test the repository checks
        run: .venv/bin/python scripts/test_checks.py

  browser:
    name: onboarding guide in a browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the test dependencies and headless Chromium
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyyaml==6.0.2 playwright==1.63.0 axe-playwright-python==0.1.8
          .venv/bin/python -m playwright install --with-deps --only-shell chromium
      - name: test every control of the onboarding guide
        run: .venv/bin/python scripts/test_onboarding_page.py

  workflows:
    name: audit the workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install zizmor
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet zizmor==1.30.1
      - name: audit every workflow with zizmor
        env:
          GH_TOKEN: ${{ github.token }} # the online audits read the pinned actions; the token is read-only
        run: .venv/bin/zizmor --format plain .github/workflows
