name: policy

# ADR 004, decision 14: the committed policy artifact must equal a fresh
# compile of the constellation. Reviewers approve the artifact, and the
# enabling vote, the Easy Track templates and the drift detector consume it.

on:
  pull_request:
  merge_group:  # the merge queue runs the checks on the merged result (ADR 012)
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  artifact:
    name: policy artifact matches the constellation
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: policy/constellation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0
      - name: install the pinned dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: compare the committed artifact with a fresh compile
        run: bun compiler/compile.ts --manifest manifests/fork-25946643.json --check
      - name: test the compiler
        run: bun test compiler
      - name: type-check
        run: ./node_modules/.bin/tsc --noEmit -p .
