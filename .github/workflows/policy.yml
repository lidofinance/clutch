name: policy

# ADR 004, decision 14: the committed policy artifact must equal a fresh
# compile of the constellation. Reviewers approve the artifact, and the
# enabling vote, the motions' permission trees and the drift detector consume it.

on:
  pull_request:
  merge_group:  # the merge queue runs the checks on the merged result (ADR 012)
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  artifact:
    name: policy artifact matches the constellation
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: policy/constellation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install bun 1.3.0 from its release, checked against the release's hash
        env:
          BUN_VERSION: 1.3.0
          # SHASUMS256.txt of the release bun-v1.3.0, line bun-linux-x64.zip
          BUN_SHA256: 60c39d92b8bd090627524c98b3012f0c08dc89024cfdaa7c9c98cb5fd4359376
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: install the pinned dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: compare the committed artifacts with a fresh compile
        run: |
          bun compiler/compile.ts --manifest manifests/fork-25946643.json --check
          bun compiler/compile.ts --manifest manifests/rehearsal-26249900.json --check
      - name: test the compiler
        run: bun test compiler
      - name: type-check
        run: ./node_modules/.bin/tsc --noEmit -p .
