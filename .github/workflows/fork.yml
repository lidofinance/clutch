name: fork

# ADR 012, decision 8 (OD-52): the fork suite runs in the merge queue and on
# pushes to main, and never on a pull request, because it needs the archive RPC
# key. The key is the repository secret MAINNET_RPC_URL. After the suite, the
# round-trip check and the two detectors read the logs that the suite wrote
# (INV-016; ADR 013, decision 19).

on:
  merge_group:  # the merge queue runs the suite on the merged result (ADR 012)
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suite:
    name: fork suite, round-trip check and detectors
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # forge-std
      - name: install foundry 1.7.1 from its release, checked against the archive's hash
        env:
          FOUNDRY_VERSION: v1.7.1
          # sha256 of the release's foundry_v1.7.1_linux_amd64.tar.gz, computed on 2026-11-12
          FOUNDRY_SHA256: cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/foundry.tar.gz" \
            "https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          echo "${FOUNDRY_SHA256}  $RUNNER_TEMP/foundry.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/foundry"
          tar -xzf "$RUNNER_TEMP/foundry.tar.gz" -C "$RUNNER_TEMP/foundry"
          echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"
      - name: install bun 1.3.0 from its release, checked against the release's hash
        env:
          BUN_VERSION: 1.3.0
          # SHASUMS256.txt of the release bun-v1.3.0, line bun-linux-x64.zip
          BUN_SHA256: 60c39d92b8bd090627524c98b3012f0c08dc89024cfdaa7c9c98cb5fd4359376
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: install the policy's pinned dependencies
        working-directory: policy/constellation
        run: bun install --frozen-lockfile --ignore-scripts
      - name: restore the chain reads of earlier runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.foundry/cache/rpc
          key: fork-rpc-${{ github.run_id }}
          restore-keys: fork-rpc-
      - name: run the fork suite on the pinned mainnet forks
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          if [ -z "$MAINNET_RPC_URL" ]; then
            echo "::error::The repository secret MAINNET_RPC_URL is not set. The fork suite needs an archive RPC of mainnet."
            exit 1
          fi
          RPC="$MAINNET_RPC_URL" forge test
      - name: compare the modifiers' state, rebuilt from their events, with the policy
        run: bun policy/constellation/compiler/roundtrip.ts rehearsal --dir .roundtrip
      - name: run the drift detector and the motion detector on the suite's scenarios
        run: bun policy/constellation/compiler/watch.ts rehearsal --dir .roundtrip
