# Allowlist for OKF actor ids in generated.by and verified[].by (OKF 0.2 section 7).
#
# human:em is EM, the interim acceptor of decisions (docs/adr/002).
# human:tmc is the Treasury Management Committee, the permanent acceptor.
# human:yt is YT, a decision proposer and page verifier, not an ADR acceptor.
# The Emergency Brakes multisig verifies no ADR since 2026-10-13 (OD-63), so it is
#   not listed.
# Any agent id of the form <runner>/<model> may author a page in generated.by (ADR 012).
# Only the humans below verify a page. Only the agents below may record a human's own
# verification on that human's written instruction (ADR 003, decision 14).
# Add an agent or process only when it is actually used.
version: 1

humans:
  - human:em
  - human:yt
  - human:tmc

# A team verifies through a member, with `ref` to the pull request that the member
# approved. A team's verification raises a page's review status and never accepts an
# ADR (ADR 012, OD-50).
teams:
  - human:defi-tech

processes:
  - process:status-register

agents:
  - claude-code/opus-5.5
