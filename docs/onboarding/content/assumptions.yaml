# What must stay true, ranked by impact (highest first). Kind: trust, design or operational.
# `watched_by` lists the checks that exist; an empty list shows "Not checked yet".
- id: no-owner-path
  assumption: "No role can reach an owner-only function of the Asset Safe, the orders account or a modifier, beyond the narrow, pinned calls that the policy grants."
  kind: design
  why: "The Asset Safe owns both modifiers, and every role call runs as the Asset Safe. The emergency revoke, the governance writes and the restart work only because a narrow role may administer a modifier or the Safe. The LIP calls this composition the primary risk."
  breaks: "An operator, a motion or a factory bug gets administration of the vault. Fork probes found two such paths, and both are closed: a motion could grant the operator delegatecall, or give it the safety modifier as a target."
  watched_by: [INV-004, INV-009, INV-018, INV-027, "test:test_policyadmin_cannot_grant_operator_the_safety_modifier", "test:test_policyadmin_refuses_every_module_of_the_asset_safe", "test:test_policyadmin_cannot_grant_operator_delegatecall", "test:test_D6_adversarial"]
  watch_note: "The compiler also refuses a policy that leaves the Asset Safe or one of its modules unguarded. INV-025 and INV-035, for the exit-governance and restart roles, are tested on a fork. An external audit is due in phase 3."
  sources: ["ADR-005#proposed-direction", "ADR-006#d9", "ADR-006#d10", "ADR-006#d13", "ADR-013#d12",
    "OD-49", "OD-104", "INV-025", "INV-035", "lip:part-2"]

- id: agent-sole-owner
  assumption: "Aragon Voting is the only owner of the Asset Safe, which has no guard, no module guard and no fallback handler."
  kind: design
  why: "Custody stays with the DAO, and recovery never passes through vendor code. The vault also stays off the parts of Safe v1.5.0 that changed most."
  breaks: "A guard there would put recovery behind vendor code that only a DAO vote can remove. A fallback handler or a contract signature would open the least-proven paths of v1.5.0."
  watched_by: [INV-001, "test:test_asset_safe_shape"]
  watch_note: "No test checks that Aragon Voting never signs as a contract. The owner, guard, module and singleton alerts are not built."
  sources: ["ADR-005#d14", "ADR-005#d15", "ADR-005#context", "ADR-005#proposed-direction", "ADR-010#d18",
    "ADR-010#proposed-direction", "INV-001", "ADR-005#d28", "INV-023"]

- id: dao-sound
  assumption: "The DAO stays sound and able to act."
  kind: trust
  why: "The DAO is the final authority. Only its vote changes the top-up limits, replaces a role holder or breaks glass."
  breaks: "The top-up limits stay as they are, a captured committee keeps the operator role, a defect in the safety modifier or the factory stays, or Easy Track stays paused. Every DAO action takes about five days."
  watched_by: ["test:test_D2_direct_DAO_path"]
  watch_note: "The test runs on a mock owner. The DAO runbooks are listed but not written."
  sources: ["ADR-005#proposed-direction", "ADR-013#d3", "ADR-013#d4", "ADR-013#proposed-direction",
    "ADR-014#d13", "lip:part-6", "doc:docs/runbooks/index.md#runbooks", "ADR-005#d28",
    "runbook:Top up the vault", "runbook:Change a top-up registry", "runbook:Move the operator role to another Safe"]

- id: signers-good-faith
  assumption: "The committee's signers act in good faith."
  kind: trust
  why: "The committee's Safe holds the operator role and the first-loss role, and it creates every motion."
  breaks: "A captured quorum can propose any motion, and LDO holders see each one for 72 hours. A motion that nobody objects to can onboard a bad protocol, give the operator a transfer to any address, set any budget, or restart the operator after a stop. A burn motion moves the first-loss shares' value to the vault's other depositors. The quorum can also redeem the first-loss shares to the Asset Safe, and return vault tokens to the Aragon Agent, which stops the vault but loses nothing. Two compromised committee keys do not reach the emergency role."
  watched_by: ["test:test_D4_emergency_flow", "test:test_emergency_cannot_give_a_non_zero_approval"]
  watch_note: "Fork tests cover the operator's return, the burn motion, the first-loss role and the insurance funds. The pages on emergency actions, burn motions and first-loss actions, and the alerts on budget and restart motions and on transfers to the Agent, are not built."
  sources: ["ADR-005#d2", "ADR-005#d24", "ADR-008#d21", "ADR-008#d23", "ADR-008#consequences",
    "ADR-013#consequences", "ADR-014#consequences", "ADR-005#d31", "ADR-010#d24", "INV-002", "INV-014",
    "INV-021", "INV-038", "ADR-013#d11", "doc:docs/specs/threat-model.md#failure-modes"]

- id: motions-reviewed
  assumption: "Someone reads every motion of the universal factory within its 72 hours, compares its [[raw write|raw writes]] with the policy's source, and objects to a write that widens beyond it. The policy of each motion role never lets a write reach an administrative function, a membership, or a delegatecall other than the order signer's."
  kind: trust
  why: "Motions change the vault without a DAO vote. The factory checks no write's content, so the [[objection window]] is the bound on where funds go."
  breaks: "A motion that nobody objects to can give the operator a transfer to any address or set any budget, and the vault's funds can then leave. A motion can also point the operator at an unaudited contract."
  watched_by: ["test:test_uf_motion_can_widen_without_a_receiver_or_a_budget", "test:test_uf_motion_fails_as_a_whole_on_a_write_that_a_modifier_refuses", "test:test_replay_the_example_motion", "test:test_watch_events_with_a_widening_motion_open"]
  watch_note: "The factory passes INV-032 to INV-035 on a fork against the live Easy Track, and the first test shows the widening that it does not stop. The motion roles' limits are the layer that holds on chain (INV-004, INV-025, INV-040). The `motion` command builds a motion from a merged policy change, and its check fails a motion that writes anything else; a fork test enacts one such motion. The motion detector passes an open motion only if it is the repository's pending motion and the chain holds its base policy; fork tests run it on the live Easy Track's logs. Lido's monitoring does not run it yet, and the other alerts are not built. An external audit is due in phase 3."
  sources: ["ADR-013#d8", "ADR-013#d10", "ADR-013#d11", "ADR-013#consequences",
    "ADR-013#confirmation", "ADR-013#proposed-direction", "INV-004", "INV-032", "INV-033", "INV-034", "INV-035", "OD-49",
    "lip:part-4", "OD-134", "OD-135", "ADR-013#d19", "INV-025", "INV-040", "OD-118",
    "doc:docs/specs/threat-model.md#failure-modes", "test:test_replay_the_example_motion",
    "test:test_watch_events_with_a_widening_motion_open", "OD-137"]

- id: guard-single-use
  assumption: "[the screening vendor]'s guard approves each exact transaction once, fails closed, and holds no standing approval."
  kind: trust
  why: "Above the [[launch cap]], on-chain blocking before execution is a hard requirement. Once set, the [[guard]] screens every transaction of the committee's Safe."
  breaks: "One standing approval of the modifier's execution function would approve all vault activity. One approved stray delegatecall can replace the code of the committee's Safe and drop the guard, and a module on that Safe would skip it. An outage stops the operator and new motions for up to ten days."
  watched_by: []
  watch_note: "INV-010 is pending and has no test. Restricted fork tests of the vendor's guard passed on 2026-10-02. Lido's guard detector supports Safe v1.3.0 and must add this instance. The vendor's written acceptance of the no-standing-approval rule is owed. All three come before a funding above the launch cap (OD-54)."
  sources: ["ADR-010#d20", "ADR-010#d4", "ADR-010#d9", "ADR-010#d10", "ADR-010#d12", "ADR-010#d17",
    "ADR-010#d22", "ADR-010#proposed-direction", "INV-010", "OD-54",
    "doc:docs/research/safe-v150-guard-compatibility-2026-10-02.md#fork-test-of-the-vendors-guard", "ADR-010#context"]

- id: launch-cap
  assumption: "Until the guard is live, the vault holds no more than its first top-up of one million dollars, the launch cap."
  kind: operational
  why: "EM allowed a launch without the screening guard under the [[launch cap]]. The cap holds by a rule: the committee creates no top-up above it before the guard is set (OD-145)."
  breaks: "Until the guard is set, no operator transaction and no motion creation is screened, and a top-up motion above the cap enacts if nobody objects. A first-loss redemption can take the vault above the cap."
  watched_by: []
  watch_note: "The alerts on a redemption before the guard is set, on an excess that stays, and on a vault value above the cap, are not built."
  sources: ["ADR-010#d20", "ADR-010#d21", "ADR-010#d22", "OD-145", "ADR-010#proposed-direction", "ADR-014#d14",
    "ADR-014#proposed-direction", "doc:docs/specs/control-matrix.md#the-matrix"]

- id: artifact-is-policy
  assumption: "The committed artifact, compiled from the constellation, is the only statement of the policy."
  kind: design
  why: "Reviewers approve the artifact. The enabling vote, the motions of the universal factory and the drift detector consume it. Nothing is signed that the compiler did not produce from the same commit."
  breaks: "A transaction built in the hosted Zodiac app, or a change made in its UI, becomes unreviewed drift. The tests, the vote and the detector can then disagree."
  watched_by: ["doc:.github/workflows/policy.yml", "test:test_roundtrip_events_after_the_enabling_vote"]
  watch_note: "CI fails when the artifact differs from a fresh compile. The round-trip check rebuilds the modifiers' state from their events and compares it with the artifact (INV-016); it runs on the rehearsal's vault, and a fork test shows that it reports an emergency revoke. The drift detector runs it against the policy that the repository says the chain holds; Lido's monitoring does not run it yet."
  sources: ["ADR-004#d7", "ADR-004#d11", "ADR-004#d12", "ADR-004#d14", "ADR-013#proposed-direction", OD-33, INV-016,
    "test:test_roundtrip_events_after_the_enabling_vote", "test:test_roundtrip_events_after_an_emergency_revoke"]

- id: roles-and-sdk
  assumption: "The locked Roles mastercopy and the pinned roles SDK encode and check conditions the way the compiler and the tests expect."
  kind: trust
  why: "The deployed mastercopy is older than the upstream source, and Clutch's compiler is built on the SDK."
  breaks: "A compiler or SDK bug can reach the chain if nobody runs the round-trip check after a change. A change of SDK, plan or licence can block local compilation."
  watched_by: ["doc:.github/workflows/policy.yml", "test:test_roundtrip_events_after_the_enabling_vote"]
  watch_note: "CI runs the compiler tests and a type-check. The SDK's selectors and event topics match the mastercopy, with one exception: the mastercopy emits `Initialized` with a `uint64`. The mastercopy stores a budget's maximum refill of zero as the largest value, and a timestamp of zero as the block's time; a fork test reads both from it. The round-trip check decodes the deployed modifier's real events on a fork and rebuilds the committed policy from them."
  sources: ["ADR-004#d7", "ADR-004#d13", "doc:docs/research/zodiac-constellation-2026-10-06.md#answer", "INV-016",
    "test:test_roundtrip_events_after_the_enabling_vote"]

- id: safe-v150-sound
  assumption: "Safe v1.5.0 has no defect on the paths that the vault uses."
  kind: trust
  why: "The new Safes run it: execution, `approveHash`, module execution and owner management. The orders account also uses a fallback handler and contract signatures. Its record of holding value is short."
  breaks: "Custody or recovery could fail. A delegatecall can replace a Safe's code without any Safe event."
  watched_by: [INV-019, "test:test_asset_safe_shape"]
  watch_note: "Safe's releases, advisories and bug-bounty records are checked again before the enabling vote. The critical alert on a singleton change is not built."
  sources: ["ADR-005#d12", "ADR-005#d13", "ADR-007#d17", "ADR-007#d20", "ADR-005#context", "ADR-010#d16",
    "ADR-010#d18", "ADR-010#proposed-direction", "INV-019",
    "doc:docs/research/safe-v150-due-diligence-2026-10-05.md#summary", "doc:docs/specs/threat-model.md#failure-modes", "ADR-010#context"]

- id: easy-track-window
  assumption: "Easy Track gives every motion an objection window of at least 48 hours, and rebuilds and hash-checks each script through its factory at enactment."
  kind: trust
  why: "These properties bound motions, and they replace a bespoke controller contract. The rebuild also runs the factory's counter and policy-version checks again at enactment."
  breaks: "A motion could enact with changed content, too fast to object to, or over a newer change of the policy. The guard screens the creation of a motion, not its enactment."
  watched_by: [INV-005, INV-006, "test:test_D1_substituted_script_rejected_at_enactment"]
  watch_note: "The tests use a mock Easy Track. The motion-lifecycle detector is not built."
  sources: ["ADR-006#d1", "ADR-005#d31", "ADR-010#d24", "ADR-006#context", "ADR-013#context", "ADR-013#d10",
    "INV-005", "INV-006"]

- id: six-hour-start
  assumption: "The emergency Safe's signers can start any emergency action within six hours, and the Emergency Brakes multisig can pause Easy Track in that time."
  kind: operational
  why: "Six hours is the mandate's ceiling and a hard gate. The measure is the time to initiate, not the time to fill an order."
  breaks: "Recovery comes late in a depeg. A misread runbook during a depeg loses funds in minutes."
  watched_by: []
  watch_note: "The validator refuses a reviewed runbook whose drill exceeds six hours. No runbook is written or drilled yet; drills are a phase 3 gate. No response-time data exists for a group that mixes members of two bodies; the first drill measures it."
  sources: ["ADR-005#consequences", OD-58, "doc:docs/product/brief.md#hard-gates",
    "doc:docs/specs/specification-policy.md#runbooks", "doc:ROADMAP.md#standing-gates"]

- id: emergency-seats
  assumption: "The [[Emergency Safe]] keeps its seat rule: two committee members, two Emergency Brakes members and a fifth signer of neither body."
  kind: trust
  why: "No quorum of the emergency Safe is the committee alone, and the quorum without the committee is the mandate's independent exit. It holds the switch, and the cap-breach trigger pages it."
  breaks: "Seat capture: any three signers can change the owners, for example to add a third committee member. The committee could then act alone, or the independent exit would be lost. A worsening breach or a defect would go on."
  watched_by: [INV-026, "test:test_operator_holds_only_the_operator_key"]
  watch_note: "The emergency Safe is not deployed, and its fifth signer is not chosen. The owner-change alert and the paging alert on the trigger are not built."
  sources: ["ADR-005#d24", "ADR-005#d25", "ADR-005#proposed-direction", "ADR-005#consequences",
    "ADR-009#d34", "INV-026"]

- id: cap-breach-fixed
  assumption: "Monitoring detects a cap breach, and the committee fixes it within two working days."
  kind: design
  why: "The permission layer cannot see value, so no contract reverts on a cap."
  breaks: "A breach goes unseen or unfixed. Every detective control ends at a person, whom the mandate must name."
  watched_by: []
  watch_note: "The detector specification is phase 1 work. The fortnightly cap reading and its paging alert are decided, not built."
  sources: ["ADR-009#d1", "ADR-009#d6", "ADR-009#d24", "ADR-009#d25", "ADR-009#d33",
    "ADR-009#proposed-direction", "lip:part-9"]

- id: cow-on-v150
  assumption: "CoW's order signer, ComposableCoW and CoW's fallback handler work on Safe v1.5.0 behind a Roles modifier, and each role's orders pay only their pinned receiver."
  kind: design
  why: "Every swap runs through the orders account. The pinned receiver keeps the operator's proceeds in the vault and recovery proceeds at the Agent."
  breaks: "If the fallback handler or the order signer fails on Safe v1.5.0, the vault has no limit or TWAP orders. If a receiver pin fails, an order could pay another account."
  watched_by: [INV-022, INV-023, "test:test_orders_signer_order_settles_to_the_asset_safe", "test:test_orders_twap_part_settles_through_the_fallback_handler"]
  watch_note: "Tested on a fork on 2026-11-07. The order book's acceptance of zero app data is not tested."
  sources: ["ADR-007#d17", "ADR-007#d18", "ADR-007#d19", "ADR-007#confirmation",
    "ADR-007#reversal-conditions", "INV-022", "INV-023",
    "doc:docs/research/cow-orders-account-2026-10-06.md#limits",
    "doc:docs/research/orders-account-fork-tests-2026-11-07.md#the-fork-tests"]

- id: order-prices
  assumption: "CoW's solver competition and EBBO rule, screening, the orders budgets and monitoring of each fill keep order prices close to the market."
  kind: trust
  why: "Nothing on chain bounds a CoW order's price: its limit is a number that the caller chooses."
  breaks: "A careless or hostile limit sells below the market when solvers fail to compete or break the EBBO rule beyond what a bond repays, or when liquidity is thin. The budgets bound the operator's transfers; the emergency role's orders are neither budgeted nor screened."
  watched_by: []
  watch_note: "CoW DAO enforces the EBBO rule after the fact. [the screening vendor] has not confirmed a price check. The fill-price and recovery-limit alerts are not built."
  sources: ["ADR-007#d26", "ADR-007#proposed-direction", "ADR-010#proposed-direction", "OD-43",
    "doc:docs/specs/control-matrix.md#the-matrix",
    "doc:docs/research/cow-orders-account-2026-10-06.md#cows-rules-on-the-fill-price"]

- id: watch-tower
  assumption: "CoW's watch-tower posts conditional orders on time."
  kind: trust
  why: "TWAP orders reach the order book only through it."
  breaks: "The orders wait. No funds move."
  watched_by: []
  watch_note: "The alert on a late part is not built."
  sources: ["ADR-007#proposed-direction",
    "doc:docs/research/cow-orders-account-2026-10-06.md#conditional-orders-twap-and-stop-loss"]

- id: top-ups
  assumption: "Funding is regular, so top-up motions carry all of it, within each registry's limit."
  kind: operational
  why: "The committee expects a top-up about every three to four months. A top-up motion takes 72 hours and uses Lido's existing top-up factories in new instances."
  breaks: "A captured committee can pull a registry's limit in each period if nobody objects. Before the guard is set, nothing on chain keeps a top-up under the launch cap (OD-145)."
  watched_by: []
  watch_note: "Fork tests cover the two factories, their registries and the first top-up. The chain check of the registries' roles before the enabling vote, and the alerts on a top-up motion, are owed."
  sources: ["ADR-014#d13", "ADR-014#d14", "ADR-014#d16", "OD-145", "ADR-014#consequences", "INV-037", "ADR-005#d28"]

- id: returns-rare
  assumption: "Funds go back to the Aragon Agent only in an emergency or a recovery."
  kind: design
  why: "EM wants the vault to send funds back rarely. Redemption and fund-exit proceeds pay the Asset Safe, not the Agent."
  breaks: "A captured or careless committee can return any vault token to the Agent at any time. That stops the vault's work but loses nothing."
  watched_by: []
  watch_note: "Fork tests cover the operator's return on the Asset Safe and on the orders account, and the first-loss claim that pays only the Asset Safe. INV-038 stays pending for the exit of an insurance fund. The alert on every transfer to the Agent is not built."
  sources: ["ADR-014#d8", "ADR-014#d9", "ADR-014#d10", "ADR-014#consequences", "INV-038"]

- id: insurance-one-safe
  assumption: "One first-loss Safe, with one modifier, keeps the first-loss shares and the insurance funds of three products safe."
  kind: design
  why: "Insurance is built in at launch for earnETH, earnUSD and Lido Lend, and its money comes from the Asset Safe by motion."
  breaks: "A defect in the first-loss modifier reaches every fund at once. A payout from a fund with a fixed payout address leaves the vault, so it is safe only if the creating motion pinned the right address and cap."
  watched_by: []
  watch_note: "On a fork, insurance money moves by motion within its budget key, a motion deposits it into Lido Earn, and motions create a fund with a payout address and pay out of it within its cap. INV-039 is tested with a stand-in payout address; the Lend team has not named one."
  sources: ["ADR-014#d4", "ADR-014#d6", "ADR-014#d7", "ADR-014#consequences", "ADR-014#confirmation",
    "INV-039"]

- id: budgets-flow
  assumption: "Budgets in token units bound the monthly flow to each spender; the caps are measured, not enforced by budgets."
  kind: design
  why: "The modifier can count only token units per key, while caps are ratios of value."
  breaks: "Budgets drift with price, and no budget motion follows the price. A key can allow more than its cap's room after a price rise; the published cap reading, and the guard once it is live, catch a breach. Keys for Lido products bound only the monthly movement, a weak control."
  watched_by: [INV-011, "test:test_D5_budget_enforcement_and_refill", "test:test_budget_keys_of_different_assets_are_independent"]
  watch_note: "A budget motion can set any amount, with a refill period of at least 30 days (INV-012), so the objection window bounds a budget's size. The budget-burn alerts are not built."
  sources: ["ADR-009#d3", "ADR-009#d13", "ADR-009#d31", "ADR-009#d33", "ADR-009#proposed-direction",
    "INV-011", "INV-012"]

- id: attested-computation
  assumption: "The attested computation behind budgets and fixed approval ceilings ran correctly on inputs that match the approved mandate."
  kind: operational
  why: "No financial figure may enter the repository except from an [[attested computation]]."
  breaks: "Budgets and fixed approval ceilings would be too loose or too tight. A changed mandate needs a new run."
  watched_by: []
  watch_note: "It ran with an independent attester and pinned inputs on 2026-09-22 and 2026-10-02. The results enter only after the mandate is approved."
  sources: ["ADR-009#d3", "ADR-009#d11", "ADR-009#proposed-direction", "doc:docs/registers/parameters.md#parameters"]

- id: dai-usds-converter
  assumption: "Sky's DAI–USDS converter stays one to one, with no admin and no fee, and USDS stays sound."
  kind: trust
  why: "DAI earns only by conversion to USDS. DAI, USDS and sUSDS are on the launch list."
  breaks: "Converted value is exposed to a Sky upgrade of USDS. USDS and DAI carry USDC risk."
  watched_by: ["test:test_D3_dai_usds_conversion_pays_the_asset_safe"]
  watch_note: "The depeg rules in [the screening vendor]'s service are not set up yet."
  sources: ["ADR-011#d1", "ADR-011#d2", "ADR-011#d7", "ADR-007#d5", "ADR-007#d15",
    "doc:docs/research/dai-usds-conversion-2026-10-05.md#the-converter"]

- id: earn-curators
  assumption: "Lido Earn's curators act in the vault's interest, and Earn shares stay transferable until the first-loss shares move."
  kind: trust
  why: "earnETH and earnUSD are launch positions, and the first-loss shares move to the first-loss Safe after the enabling vote."
  breaks: "Curator misbehaviour becomes a financial emergency. A pause, whitelist, lockup or blacklist on the shares is a reversal condition."
  watched_by: ["test:test_D3b_earn_deposit_policy_layer"]
  watch_note: "Fork tests cover the share transfer, the burn motion and the first-loss role. The claim of a settled redemption is not tested. The first-loss balance alert is not built."
  sources: ["ADR-008#d13", "ADR-008#d19", "ADR-008#confirmation", "ADR-008#reversal-conditions",
    "ADR-011#d1", "doc:docs/research/legacy-investments-2026-10-05.md#can-the-shares-move"]

- id: monthly-report
  assumption: "The committee publishes each monthly report within seven days, from a generator that anyone can re-run."
  kind: operational
  why: "Reports are the evidence for caps, top-up motions."
  breaks: "Top-up motions wait. A report that cannot be reproduced is a reversal condition. Reports have no on-chain anchor."
  watched_by: []
  watch_note: "The report generator and the day-8 flag are phase 2 work."
  sources: ["ADR-009#d19", "ADR-009#d21", "ADR-009#d22", "ADR-009#reversal-conditions",
    "ADR-014#proposed-direction"]

- id: signer-rotation
  assumption: "Every rotation of a seat holder reaches the emergency Safe: a signer who leaves the committee or the Emergency Brakes multisig leaves the seat."
  kind: operational
  why: "Nothing on chain keeps the emergency Safe's seats in step with the committee's Safe and the Emergency Brakes multisig."
  breaks: "A departed signer keeps operator or emergency power, or a quorum becomes unreachable."
  watched_by: []
  watch_note: "The runbook to rotate a signer is listed, not written. Owner-change alerts are not built."
  sources: ["ADR-005#d24", "ADR-005#proposed-direction", "runbook:Rotate a signer"]

- id: prices-sound
  assumption: "The price waterfall gives every asset a fair price, and the committee's valuation policy sets a sound band and level-5 share."
  kind: trust
  why: "Caps, top-up motions rest on the reported value. A single price source can be wrong, not only missing."
  breaks: "A wrong price supports a funding that the vault does not need, or hides a breach. A committee estimate prices the committee's own positions."
  watched_by: []
  watch_note: "The report generator is phase 2 work. The band and the level-5 share are not set."
  sources: ["ADR-009#d35", "ADR-009#d36", "ADR-009#d37", "ADR-014#proposed-direction",
    "doc:docs/research/cfo-feedback-2026-10-13.md#prices-under-stress"]

- id: harness-faithful
  assumption: "The test harness behaves like the real system for what the tests claim."
  kind: design
  why: "The LIP's Implemented parts rest on fork tests. Nothing is deployed, and no audit is done."
  breaks: "Green tests can miss real behaviour: the real Aragon Voting path, the real Easy Track and the screening guard."
  watched_by: ["test:test_02_enabling_vote_end_to_end"]
  watch_note: "The kit's harness mocks Aragon Voting, the Aragon Agent, Easy Track and its executor, and uses stand-in addresses for the committee's Safe, the emergency Safe, the first-loss Safe and the orders account. The enabling-vote rehearsal, the universal factory's tests and the orders account's tests run the real Aragon Voting, Finance and Easy Track, and the orders account's tests settle through CoW's settlement contract."
