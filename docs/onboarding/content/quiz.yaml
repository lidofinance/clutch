# The optional self-check (OD-37, Q2). `answer` is the index of the right option.
- id: asset-safe-owner
  question: "Who owns the Asset Safe?"
  options:
    - "The Treasury Management Committee"
    - "Aragon Voting, for the DAO"
    - "The committee's Safe"
    - "[the screening vendor]"
  answer: 1
  why: "Aragon Voting is the only owner, at 1 of 1, and recovered assets go to the Aragon Agent, the DAO's treasury. The committee acts on the vault only through its roles: the operator role on the operator and orders modifiers, and the first-loss role on the first-loss modifier."
  sources: ["ADR-005#d6", "ADR-005#d28", "ADR-005#proposed-direction", OD-73, INV-001]

- id: outside-transfer
  question: "The committee's Safe tries to send USDC from the Asset Safe to an outside address. What stops it?"
  options:
    - "Nothing, if 4 of 7 signers sign"
    - "Only [the screening vendor]"
    - "The operator modifier: the policy has no such transfer, and every receiver is pinned to the Asset Safe"
    - "The objection window"
  answer: 2
  why: "The operator role holds no transfer to an outside address: its one planned transfer goes to the orders account, and every receiver, owner and beneficiary in its permissions is the Asset Safe. Once the launch cap lifts, the screening guard is a second, independent check."
  sources: [INV-003, "test:test_D3_operator_cannot_route_around_avatar"]

- id: depeg-first
  question: "A stablecoin depegs. Who acts first, and how fast must they start?"
  options:
    - "The DAO, by vote, within days"
    - "The emergency Safe, at 3 of 5, within six hours"
    - "Easy Track, by a motion"
    - "[the screening vendor], by freezing the vault"
  answer: 1
  why: "Financial emergencies go to the emergency Safe: two committee members, two Emergency Brakes members and one member of neither body, at 3 of 5. They revoke the operator, exit and send assets to the Agent. Six hours is the mandate's ceiling to start, and drills must prove it."
  sources: ["ADR-005#d2", "ADR-005#d11", "ADR-005#d24", "ADR-005#context", "ADR-005#proposed-direction", OD-58, "lip:part-6"]

- id: restart
  question: "The emergency Safe has switched the operator off. Who turns it on again?"
  options:
    - "The emergency Safe, once the incident is over"
    - "Easy Track, by a motion"
    - "The DAO, by vote"
    - "The committee's Safe"
  answer: 2
  why: "No emergency body restores what it stopped. A DAO vote, a direct Aragon Voting item, enables the operator modifier again, and the same vote first cancels the queued motions, because a motion does not expire. It also grants again the operator's permissions on the orders account."
  sources: ["ADR-005#d26", "ADR-005#proposed-direction", OD-59,
    "test:test_D4_the_switch_freezes_queued_motions_until_the_dao_restarts", "ADR-005#d30"]

- id: vendor-offline
  question: "[the screening vendor] goes offline. What still works?"
  options:
    - "Nothing, until the vendor returns"
    - "Only the operator"
    - "The emergency Safe and the DAO; the operator stops"
    - "Everything: the guard lets transactions through"
  answer: 2
  why: "The guard fails closed, so every transaction of the committee's Safe stops: the operator, new motions and the committee's other duties (OD-83). No guard sits on the emergency path or the DAO path, so recovery does not change."
  sources: ["ADR-010#d4", "ADR-010#proposed-direction", OD-83]

- id: new-code
  question: "Which of these is new code that Lido writes for Clutch?"
  options:
    - "The Safe v1.5.0 singleton"
    - "The Easy Track template factories"
    - "The Zodiac Roles mastercopy"
    - "The CoW order signer"
  answer: 1
  why: "Easy Track factories are the only new contracts allowed. Safe, the Roles mastercopy and the CoW order signer are deployed code that Clutch reuses."
  sources: ["ADR-006#d1", "ADR-007#proposed-direction"]

- id: limit-order-loss
  question: "The operator places a limit order far below the market price. What limits the loss?"
  options:
    - "The modifier refuses an order below the market price"
    - "Nothing at all"
    - "The orders budget on what enters the orders account, the screening of the order, and monitoring of the fill"
    - "CoW refuses the order"
  answer: 2
  why: "Nothing on chain bounds a CoW order's price: its limit is a number that the caller chooses. The orders budgets bound what the operator can move into the orders account, screening checks every operator order once the launch cap lifts, and monitoring alerts on a fill below the market. CoW's EBBO rule also holds the fill to the on-chain market."
  sources: ["ADR-007#d18", "ADR-007#d26", "ADR-007#proposed-direction", OD-43, "doc:docs/specs/control-matrix.md#the-matrix"]

- id: cap-breach-revert
  question: "A cap ratio is above its limit. Does the next operator transaction revert?"
  options:
    - "Yes, the modifier checks every cap"
    - "No: caps are detective. Monitoring publishes the breach and the committee fixes it within two working days"
    - "Yes, but only for stablecoins"
    - "Yes, Easy Track checks it"
  answer: 1
  why: "The permission layer cannot see value. Caps are kept by measurement, publication and remediation. A breach that gets worse leads the emergency Safe to switch the operator off. The Zodiac UI refuses to build an operator transaction that would breach a cap, but only in its own interface (OD-86). Screening may also refuse an operator transaction that breaches a cap, if the vendor confirms that it can check that."
  sources: ["ADR-009#d1", "ADR-009#d6", "ADR-009#d24", "ADR-009#d33", "ADR-009#d34", "ADR-009#d43", "ADR-009#proposed-direction", OD-29,
    OD-58, OD-86]

- id: operator-threshold
  question: "A colleague says that the committee's Safe signs at 3 of 5. Where do you check?"
  options:
    - "Ask the committee in a chat"
    - "The source link on the committee's card: ADR 005 and the parameters register"
    - "The Zodiac app"
    - "The forum"
  answer: 1
  why: "Every claim on this page links to its source. The committee's Safe is 4 of 7 (ADR 005). The emergency Safe is the one at 3 of 5."
  sources: ["ADR-005#d9", "ADR-005#d24", "ADR-005#context", "doc:docs/registers/parameters.md#parameters",
    "ADR-005#d31"]
