footer: |-
  **Hypothetical draft.** Nothing on this page is ratified, deployed or advice, and every number can change.

  **How this page is made.** A script builds it from the repository. CI fails when the page differs from a fresh build, when a link to a source does not resolve, or when a browser test fails. Each item is pinned to the text that it cites, so a change to that text fails CI until a person reviews the item.

  **What it leaves out.** No person's name, no unannounced counterparty, and no figure from the mandate or the attested computation. The only dollar figure is the [[launch cap]], which EM set. The page makes no network request.
