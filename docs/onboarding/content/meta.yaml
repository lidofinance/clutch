# The page frame: titles, the reader outcomes (OD-37, Q2), legends and notes.
title: "Clutch: how the DAO's active treasury vault works"
subtitle: "An onboarding guide for signers, engineers, reviewers and everyone who needs the picture."
banner: >-
  **Hypothetical draft.** This page shows a design under discussion for an active treasury vault of the Lido DAO.
  Nothing is deployed, and nothing is ratified: no Lido body has approved it, and it authorises no action. Every
  number, address and parameter is a draft that can change. It is not financial, legal or investment advice. Every
  element carries its status, and every claim links to its source in the public repository.
outcomes:
  - "Name who can move the vault's funds, and who can stop them."
  - "Walk any emergency to its first action, and say how long it takes."
  - "Tell what Clutch reuses from audited code and platforms, what it adds, and why."
  - "Find the source of any claim on this page."
map_caption: >-
  Arrows point from the account that acts to the account it acts on. Colour shows who it is,
  the border shows whether it is new, and the icon shows its kind. Aragon Voting also owns the boxes
  marked "Voting owns it"; only the Asset Safe's ownership has an arrow. Select a box to see its actors,
  or play a flow to watch it move.
lens_note: "Technical adds contract addresses, exact permissions, function signatures and implementation notes."
panel_default: >-
  **Start here.** The guided tour explains the system in ten short scenes, on this map.
  To explore on your own, select a box on the map, or open a tab below.
current_phase: "0."
phase_note: >-
  The roadmap is gated, not dated. A phase starts when the gates of the one before it close.
