  - "The enabling vote's Safe batches of the deployment, published as a file for the command that computes each hash again."
  - "The mandate's drafters owe the [[treasury share]]'s base, the time of its test, the remedy for a breach that no vault transaction causes, and a further funding's eligibility conditions."
