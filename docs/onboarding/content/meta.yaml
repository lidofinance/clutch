tab_intros:
  actors: "Every account, body and service, grouped as on the map. Each role shows its exact permissions, read from the compiled policy."
  flows: "What happens, step by step. Each flow can play on the map. The badge shows whether the flow is built and tested on a fork, specified, open or planned."
  mandate: "The committee's rulebook, block by block: what the draft says, how Clutch keeps each rule, and what Clutch changed and why. Highlighted notes mark each change."
  constellation: "The permission policy as code: the accounts, modifiers and roles that the committed artifact builds, what is specified but not built, and what Clutch changed from the policy provider's version."
  rfp: "The [[RFP|request for solution]] that Lido contributors sent to the policy provider, ask by ask: what it asked, how Clutch answers, and what Clutch changed or added, and why. Highlighted notes mark each difference."
  reuse: "What Clutch takes from audited code and existing platforms, and what it adds."
  assumptions: "What must stay true for the design to hold, ranked by impact. Each one says what breaks if it is false and what watches it."
  status: "Where the work stands. These tables are read from the repository when the page is built."
  glossary: "Plain definitions. A dotted underline anywhere on the page links to a term here."
  selfcheck: "Nine questions to check what you learned."
quiz_note: "Pick an answer to see whether it is right and why. Nothing is stored or sent."
owed:
  - "EM accepts ADR 005 to ADR 014."
  - "A Snapshot appoints the [[Emergency Safe]]'s fifth signer."
  - "The committee's valuation policy sets the [[price waterfall]]'s band, the share of the vault that its last level may price, and the band between the two readings."
  - "[the screening vendor] confirms in writing that it accepts no standing approvals, and agrees to be named."
  - "[the screening vendor] says which rules it can check before execution: the caps, an order's limit and a router swap's minimum output."
