  - "The round-trip check and the two detectors against a deployed vault; they run on the rehearsal's vault today. Lido's monitoring must run the detectors on a schedule and page on an alert."
  - "The [[attested computation]]'s figures, once the mandate is approved: the budgets, the orders budgets, the fixed approval ceilings, each top-up registry's limit, and the launch tranche's tokens and amounts."
