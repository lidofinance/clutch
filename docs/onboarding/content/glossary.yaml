# Plain definitions. `[[term]]` or `[[term|shown text]]` anywhere in the content links here;
# the build fails on a link to a term that this file does not define.
- term: ADR
  plain: "A numbered decision record in `docs/adr/`. An agent drafts it. It stays proposed until EM, and later the committee, accepts it. An acceptance authorises nothing on chain."
  sources: ["ADR-002#d1", "ADR-002#d6", "ADR-002#d7"]

- term: Allowance
  plain: "The Zodiac name for a [[budget key]]."
  sources: ["ADR-009#d13"]

- term: Approval
  plain: "Permission for a named contract, the spender, to pull tokens from the Safe. In Clutch, an approval to a protocol spends that spender's budget key, or stays under a [[ceiling]]. An approval of zero is always allowed."
  sources: ["ADR-009#d13", "ADR-009#d14", "ADR-013#d13", INV-008]

- term: Aragon Agent
  plain: "The DAO's treasury contract. Aragon Finance pays each tranche out of it. Funds come back to it only in an emergency or a recovery. Aragon Voting, not the Agent, owns the vault's Safes."
  sources: ["ADR-005#d19", "ADR-005#d20", "ADR-005#d28", "ADR-005#proposed-direction", "ADR-014#d1", "ADR-014#d8", OD-73,
    OD-108]

- term: Artifact
  plain: "The committed JSON file that reviewers approve. It holds the modifier calls in order, the expected condition tree for every role, target and function, and the budget keys."
  tech: "Format `clutch.policy-artifact/1`. The committed one is compiled against the fork-test manifest, not mainnet."
  sources: ["ADR-004#d9", "ADR-004#d14"]

- term: Attested computation
  plain: "A calculation that actually ran on pinned inputs, checked by an independent attester. It is the only allowed source of a financial figure."
  sources: ["ADR-009#d3", "ADR-009#proposed-direction"]

- term: Avatar
  plain: "The account that a modifier acts for: here, the Asset Safe. \"Pinned to the avatar\" means that a receiver, owner or beneficiary must be the Asset Safe."
  sources: [INV-003, "lip:part-1"]

- term: Budget key
  plain: "A refillable spending quota on the operator modifier, counted in token units. A permitted call draws it down, and it refills each period up to a maximum."
  tech: "A Zodiac allowance: `balance`, `maxRefill`, `refill`, `period` and `timestamp` under a 32-byte key. The key is the label in bytes, such as `bytes32(\"earn_usd_deposit\")`."
  sources: ["ADR-009#d13", "ADR-009#d15", "ADR-009#proposed-direction", INV-011]

- term: Cap
  plain: "A mandate limit on exposure, written as a share of a defined base. Measurement, publication and remediation keep it. No contract reverts on a cap."
  sources: ["ADR-009#d1", "ADR-009#d9", "ADR-009#d33", "ADR-009#proposed-direction"]

- term: Ceiling
  plain: "The upper bound of a budget key or an approval. The enabling vote, or the motion that introduces a token, sets a token's first ceilings, and that counts as their first raise. A motion lowers a ceiling at any time. It raises a ceiling to at most twice its value, at most once in 15 days. Why the limit: a ceiling that one motion could set to any value would bound nothing."
  sources: ["ADR-013#d13", "ADR-013#d15", "ADR-009#d14", "INV-036", "OD-105", "OD-113", "runbook:Change a ceiling", "OD-120"]

- term: Compiler
  plain: "Clutch's own TypeScript program on the Zodiac roles SDK. It turns the constellation into the artifact offline, and it refuses entries that only the hosted app can compile."
  sources: ["ADR-004#d13"]

- term: Constellation
  plain: "The Zodiac description of the Safes, the modifiers, the roles, the permissions and the budget keys, written in TypeScript under `policy/constellation/`. It is the source of Clutch's permission policy."
  sources: ["ADR-004#d12", OD-33]

- term: Conditional order
  plain: "A CoW order that ComposableCoW holds and checks, such as a TWAP order. CoW's watch-tower posts it to the order book when it is due."
  sources: ["ADR-007#d18", "ADR-007#proposed-direction",
    "doc:docs/research/cow-orders-account-2026-10-06.md#conditional-orders-twap-and-stop-loss"]

- term: Control matrix
  plain: "The specification that maps every mandate rule to its controls on each layer: the on-chain policy, screening before execution, monitoring with alerts, and display in the Zodiac UI."
  sources: [OD-39, "doc:docs/specs/control-matrix.md#the-matrix"]

- term: CoW
  plain: "CoW Protocol, an order-based exchange. Every vault swap is a CoW order from the orders account. Solvers compete to fill an order at its limit or better, and the [[EBBO]] rule holds a fill to the on-chain market; nothing on chain bounds the price."
  sources: ["ADR-007#d17", "ADR-007#d26", OD-43]

- term: Default-deny
  plain: "Everything is refused unless the policy lists it. A new protocol, function or argument value needs an explicit permission."
  sources: ["lip:part-3"]

- term: Delegatecall
  plain: "A call that runs another contract's code inside the caller's own storage. A delegatecall from a Safe can therefore rewrite the Safe itself. No motion can grant it to the operator on the Asset Safe. On the orders account, a motion grants only the delegatecall to CoW's order signer (OD-36, OD-103)."
  sources: ["ADR-006#d9", "ADR-007#d41", OD-36, OD-103]

- term: Drift
  plain: "Any difference between the permissions on chain and the committed artifact. A change made in the Zodiac UI is drift."
  sources: ["ADR-004#d11"]

- term: Drift detector
  plain: "A planned monitoring rule that compares the live policy with the committed artifact and alerts on any difference."
  sources: ["ADR-004#d9", "ADR-004#d14", "ADR-009#proposed-direction"]

- term: Drill
  plain: "A timed rehearsal of a runbook on a fork. A runbook counts as reviewed only with a passing drill that starts the action within six hours."
  sources: ["doc:docs/specs/specification-policy.md#runbooks"]

- term: Dual Governance
  plain: "The layer that a DAO vote passes through before the Aragon Agent executes it. It adds a delay. The vault does not use it: Aragon Voting owns the vault's Safes, so a vote on the vault runs directly."
  sources: ["ADR-005#context", "ADR-005#d28", OD-73]

- term: Easy Track
  plain: "Lido's optimistic governance. A proposal passes after a fixed window unless LDO holders object above a threshold of 0.5% of LDO."
  sources: ["ADR-006#context"]

- term: EBBO
  plain: "Ethereum best bid and offer: CoW's rule that solvers must fill an order at least as well as on-chain AMM routing would. A solver that breaks it must refund the user, or its bond is slashed."
  sources: [OD-48, "doc:docs/research/cow-orders-account-2026-10-06.md#cows-rules-on-the-fill-price"]

- term: Enabling vote
  plain: "The DAO vote that turns the system on. It registers the [[universal factory]], and it pays the first tranche, one million dollars, to the Asset Safe. For the vault's Safes, it approves the hash of each Safe batch, and anyone sends the batches after the vote: they apply the policy compiled for mainnet, grant the roles, and set up the orders account and the first-loss Safe."
  sources: ["ADR-004#d14", "ADR-010#d22", "ADR-010#proposed-direction", "ADR-008#d19", "ADR-013#d6", "ADR-014#d2",
    "doc:docs/specs/enabling-vote.md#the-vote", "ADR-005#d32", OD-92, OD-106]

- term: Fail closed
  plain: "When a check cannot run, the action stops. The screening guard fails closed: with no approval, the operator's transaction reverts."
  sources: ["ADR-010#d4"]

- term: Fallback handler
  plain: "A contract that a Safe forwards unknown calls to, for example to accept NFT safe transfers or to sign messages. The Asset Safe has none, on purpose. The orders account uses CoW's, because conditional orders need it."
  sources: ["ADR-005#d15", "ADR-005#d20", "ADR-007#d17"]

- term: First-loss shares
  plain: "The DAO's earnETH and earnUSD shares from the March 2026 Earn allocation. They take losses first, to protect other depositors. They move to the first-loss Safe. On the Earn team's written instruction, they burn by Easy Track motion, after the objection window, or the committee redeems them to the Asset Safe through one narrow role."
  sources: ["ADR-008#d13", "ADR-008#d14", "ADR-008#d19", "ADR-008#d21", "ADR-008#d22", "ADR-008#d23", "ADR-014#d10", OD-21,
    OD-42, OD-60, OD-67, OD-108]

- term: First-loss Safe
  plain: "A Safe that Aragon Voting owns, which holds the first-loss shares and the insurance funds. Its one modifier carries Easy Track's roles, which burn, fund and pay out only by enacted motion, and a role of the committee's Safe, which redeems to the Asset Safe."
  sources: ["ADR-008#d19", "ADR-008#d21", "ADR-008#d23", "ADR-014#d4", "ADR-014#d10", OD-42, OD-60, OD-67, OD-107, OD-108,
    INV-021]

- term: Fortnightly snapshot
  plain: "A reading of the vault's holdings at a pinned block every two weeks. It drives the published cap reading. Budgets no longer follow it (OD-56)."
  sources: ["ADR-009#d25", "ADR-009#d31", OD-32, OD-56]

- term: Guard
  plain: "A contract that a Safe asks before each transaction that its owners sign. Here, [the screening vendor]'s guard on the committee's Safe, set after the launch, before the vote that lifts the [[launch cap]] starts (OD-83). A module guard does the same for module transactions; Clutch uses none."
  sources: ["ADR-010#d3", "ADR-010#d20", "ADR-010#d22", "ADR-010#proposed-direction", OD-83]

- term: Invariant
  plain: "A property that must always hold, stated so that a test can check it. Each has an ID, `INV-NNN`, that is never reused."
  sources: ["doc:docs/specs/specification-policy.md#invariants"]

- term: Launch cap
  plain: "A cap of one million dollars on the Asset Safe and the orders account while the screening guard is not live. The first tranche, inside the enabling vote, is the cap, so the cap holds by the tranche's size. If a first-loss redemption takes the vault above it, the committee's Safe returns the excess to the Aragon Agent. The second tranche's vote lifts the cap, and that vote starts only once the guard is set with its bypass mode off."
  sources: ["ADR-010#d20", "ADR-010#d22", "ADR-014#d2", "ADR-014#proposed-direction", OD-54, OD-55, OD-106]

- term: Limit order
  plain: "A CoW order that sells only at a set price or better. It can stand for up to 90 days, like every operator order. A sale when a price rises to a target is a limit order."
  sources: ["ADR-007#d18", "ADR-007#d29", "OD-43", "OD-61"]


- term: LIP
  plain: "A Lido Improvement Proposal: the summary for DAO voters and delegates. It cites the internal specifications and must never contradict them."
  sources: ["ADR-004#d5"]

- term: Mandate
  plain: "The Treasury Management mandate: the rules that the committee runs the vault by. It is not yet approved. Its figures enter the repository only after its Snapshot vote."
  sources: ["ADR-009#d3", "ADR-009#proposed-direction", "doc:ROADMAP.md#roadmap"]

- term: Mandate size
  plain: "The upper bound of the vault's funding. The vault holds up to it in assets: each funding counts in US dollars at its value when it is funded, and the legacy positions count too. No tranche refills the vault to it by right, and a larger size needs a separate DAO approval. Its figure is not in the repository."
  sources: ["ADR-008#d32", "ADR-008#d34", "ADR-014#d1", OD-89, OD-106]

- term: Manifest
  plain: "The file of deployment addresses that the compiler compiles against. The committed one describes the fork-test deployment, not mainnet."
  sources: ["ADR-006#d10", "doc:test/README.md#the-policy-pipeline"]

- term: Module
  plain: "A contract that a Safe has switched on, so that it can make the Safe act without owner signatures. The two Roles modifiers are the Asset Safe's modules."
  sources: ["ADR-005#d6"]

- term: Motion
  plain: "One Easy Track proposal. Its factory's trusted caller creates it, and it enacts after the objection window. Easy Track rebuilds and hash-checks its script at enactment. Every Clutch motion comes from the [[universal factory]]."
  sources: ["ADR-006#d3", "ADR-006#context", "ADR-013#d5", INV-005]

- term: Motion counter
  plain: "A number that the universal factory keeps. Each motion names the counter that it saw at creation. When the emergency Safe or Aragon Voting raises the counter, every open motion fails at enactment, and its creator or Aragon Voting cancels it. The emergency Safe raises it at every stop."
  sources: ["ADR-013#d10", "ADR-013#proposed-direction", INV-033, "runbook:Raise the motion counter"]

- term: Objection window
  plain: "The time that a motion must wait before enactment: 72 hours today, the same for every motion, and never less than 48 hours."
  sources: ["ADR-006#context"]

- term: New Lido product
  plain: "A Lido product, such as Lido Lend, that counts against the protocol cap until it meets the mandate's maturity criteria and a motion unlocks it. earnETH and earnUSD are not new."
  sources: ["ADR-009#d28", OD-41]

- term: Open decision
  plain: "A numbered question, `OD-NN`, that a human must decide. The register lists the open ones with the agent's recommendation."
  sources: ["doc:docs/registers/open-decisions.md#open-decisions"]

- term: Orders account
  plain: "A Safe that Aragon Voting owns, with CoW's fallback handler and one modifier of its own. The roles place CoW orders from it. It holds only tokens in transit."
  sources: ["ADR-007#d17", "ADR-007#d28", OD-43, OD-57, INV-023]

- term: Permission
  plain: "The rule stored for one role, contract and function. It says which argument values are allowed. A new write replaces the old rule; it does not add to it."
  sources: ["ADR-006#context", "lip:part-3"]

- term: Price waterfall
  plain: "The written order of price sources for a report: Coingecko's close, a second aggregator, a Chainlink feed or a pool's time-weighted price, the on-chain rate into a priced underlying, and last the committee's estimate. No asset is unpriced, and every price shows its level."
  sources: ["ADR-009#d35", "ADR-009#d36", "ADR-009#d37", OD-62]

- term: Recovery order
  plain: "An order that the emergency role places from the orders account. It sells an asset for USDC, or USDT as the second destination, and pays the Aragon Agent. No guard screens it."
  tech: "A delegatecall to CoW's order signer, which lives at most 1 day."
  sources: ["ADR-007#d5", "ADR-007#d19", "ADR-007#proposed-direction", OD-26, INV-014, "ADR-007#d41", "ADR-007#d25"]

- term: RFP
  plain: "Request for solution: the requirements that Lido contributors sent to the policy provider. It asked what the provider supports today, what needs work and what it cannot do. The RFP tab maps each ask to Clutch's answer."
  sources: ["doc:docs/research/request-for-solution-2026-10-07.md#answer"]

- term: Role
  plain: "A named set of permissions on a modifier, such as operator, governance, emergency, exit governance, restart or first-loss. A Safe or contract that holds the role can make the calls that it allows."
  tech: "On chain, a 32-byte key names the role. In Clutch the key is the label in bytes, such as `bytes32(\"operator\")`."
  sources: ["ADR-005#proposed-direction", "ADR-013#proposed-direction", "lip:part-2"]

- term: Roles modifier
  plain: "A Zodiac module that checks each call against the caller's role, refuses anything not explicitly allowed, and runs the rest as the Safe. Clutch has four: an operator modifier and a safety modifier on the Asset Safe, one orders modifier on the orders account, and one first-loss modifier on the first-loss Safe."
  sources: ["ADR-005#d6", "ADR-005#d21", OD-57, OD-60, "ADR-005#proposed-direction"]

- term: Round-trip check
  plain: "A planned check that rebuilds the applied permissions from the modifier's on-chain events on a fork, and compares them with the artifact. The chain then checks the compiler."
  sources: ["ADR-004#d7", "ADR-004#d9", INV-016]

- term: Runbook
  plain: "Step-by-step instructions for one emergency or technical action, with the exact transaction for each step. Each runbook is tied to one permission."
  sources: ["ADR-004#d6", "doc:docs/runbooks/index.md#runbooks"]

- term: Safe
  plain: "A smart-contract wallet that runs a transaction only when enough of its owners approve it. The threshold says how many: for example, 4 of 7."
  sources: ["ADR-005#d31"]


- term: Shape
  plain: "A typed form of permission that the universal factory writes, such as a tokenized vault, a queue vault or an approval list. A motion gives it typed values only. Each shape pins receivers, owners and beneficiaries to the vault, draws a budget key and writes the emergency exit. A shape is the only way that a motion widens a permission."
  sources: ["ADR-013#d7", "ADR-013#d9", "ADR-013#proposed-direction", INV-034]

- term: Snapshot vote
  plain: "Lido's off-chain LDO vote. The mandate passes a Snapshot vote before the on-chain enabling vote. It is not the same as a holdings snapshot."
  sources: ["doc:ROADMAP.md#roadmap"]

- term: sUSDS
  plain: "Sky's savings token for USDS. The vault holds it as a savings position. It counts in the [[TMC-6 ratio]] for the whole treasury."
  sources: ["ADR-011#d1", "ADR-011#proposed-direction", "ADR-009#d47", OD-111]

- term: Switch
  plain: "The emergency role's call that disables the operator modifier on the Asset Safe. The operator stops, and so does every queued motion that writes through that modifier. Recovery keeps working. No emergency body turns the operator on again: a restart motion does, after the objection window."
  tech: "`disableModule(prevModule, operatorModifier)` on the Asset Safe, with the module argument pinned by `EqualTo`."
  sources: ["ADR-005#d25", "ADR-005#d26", "ADR-005#proposed-direction", "ADR-013#d12", OD-58, OD-59, OD-104, INV-009]



- term: TMC-6 ratio
  plain: "sUSDS and tokenized money market funds over the DAO's total treasury, the vault's sUSDS included. The treasury's TMC-6 rules cap this ratio at 15 percent for the whole treasury, checked each quarter. Each monthly report shows it."
  sources: ["ADR-009#d47", OD-111, "doc:docs/research/easy-track-first-2026-11-05.md#treasury-rules-that-the-committees-items-touch"]

- term: Tranche vote
  plain: "An Aragon vote that moves a tranche of funds from the DAO treasury to the Asset Safe, through Aragon Finance. Funding is rare. The first tranche, one million dollars, is part of the enabling vote, and later tranches are larger. Each vote names its tokens."
  sources: ["ADR-014#d1", "ADR-014#d2", "ADR-014#d3", OD-106, "runbook:Fund a tranche"]

- term: Treasury share
  plain: "The largest part of the DAO's non-LDO treasury that the vault may hold. The mandate sets it. The mandate still owes the share's base, the time of its test, and the remedy for a breach that no vault transaction causes."
  sources: ["ADR-008#d33", "ADR-008#proposed-direction", OD-89]

- term: Trusted caller
  plain: "The only address that may create motions on an Easy Track factory, fixed when the factory is deployed. For the universal factory it is the committee's Safe (OD-80). A new committee Safe therefore needs a new factory, which is a vote."
  sources: ["ADR-006#d3", "ADR-013#d4", "ADR-013#proposed-direction", OD-80, OD-101]

- term: TWAP
  plain: "Time-weighted average price: a CoW order in equal parts at a fixed spacing. It buys or sells a position over time, which is how the vault averages its cost."
  sources: ["ADR-007#d18", "ADR-007#d24",
    "doc:docs/research/cow-orders-account-2026-10-06.md#conditional-orders-twap-and-stop-loss"]

- term: Universal factory
  plain: "The one Easy Track factory that builds every Clutch motion and holds the roles that motions use. Its registration is its address book: one call, its own `applyMotion`, in which it checks a motion again and makes the motion's writes. It widens a permission only through typed [[shape|shapes]], narrows one with raw writes, keeps a [[version]] for each scope, and cannot be upgraded."
  sources: ["ADR-013#d5", "ADR-013#d6", "ADR-013#d7", "ADR-013#d8", "ADR-013#d10", "ADR-013#d18", INV-032, OD-102, OD-118]

- term: Version
  plain: "The universal factory's record of a scope's current content. A scope is one modifier's role, target and function, one budget key, or one ceiling. A motion names the versions that it expects. If another motion changed a scope first, the motion fails at enactment, so two motions cannot undo each other."
  sources: ["ADR-013#d2", "ADR-013#d10", "ADR-013#proposed-direction", INV-033, OD-100]

- term: Watch-tower
  plain: "CoW's off-chain service that posts conditional orders to the order book. If it stops, the orders wait and no funds move."
  sources: ["ADR-007#proposed-direction",
    "doc:docs/research/cow-orders-account-2026-10-06.md#conditional-orders-twap-and-stop-loss"]

