# --- Orders account -----------------------------------------------------------------------------
- id: orders-account
  node: orders
  name: Orders account
  status: instance
  label: specified
  what: "A new Safe that the Aragon Agent owns. Every vault swap is a [[CoW]] order placed from it. It holds only tokens in transit, between a transfer from the Asset Safe and a fill."
  controlled_by: "The Aragon Agent, at 1 of 1. The roles act on it only through its own modifier (OD-57)."
  can:
    - "Place CoW market and [[limit order|limit orders]] through CoW's order signer, and [[TWAP]] and [[stop-loss order|stop-loss orders]] through ComposableCoW."
    - "Pay the Asset Safe for the operator's orders, and the Aragon Agent for [[recovery order|recovery orders]]. Each role's permissions pin the receiver."
    - "Use CoW's [[fallback handler]], which [[conditional order|conditional orders]] need. The Asset Safe has none, so this account carries it."
    - "Settle any role's order with the approvals of CoW's vault relayer that the enabling vote sets. No role can raise an approval here."
  cannot:
    - "Bound an order's price on chain. An order's limit is a number that the caller chooses. CoW's rules, screening, the orders budgets and monitoring of each fill take the place of a bound, and screening covers only the operator (OD-48)."
    - "Limit what the emergency role sends in. The operator's transfers spend the orders budgets; the emergency role's have no budget."
    - "Swap through a router at launch. Uniswap and 1inch wait until [the screening vendor] can check a swap's minimum output (OD-43)."
  numbers: ["owner: the Aragon Agent, 1 of 1", "order life: 30 days; a recovery order: 1 day", "orders budgets: from the attested computation"]
  address: "To be deployed"
  sources: [ADR-007, ADR-005, OD-43, OD-47, OD-48, INV-013, INV-023, "doc:docs/research/cow-orders-account-2026-10-06.md#what-this-means-for-the-design"]

- id: orders-modifiers
  node: orders
  name: The orders account's modifier
  status: instance
  label: specified
  what: "One Roles modifier on the orders account, from the same mastercopy as the Asset Safe's. It carries the operator, emergency and technical roles, and no governance role, because no motion writes on the orders account (OD-57)."
  controlled_by: "Its owner, the orders account, so in the end the DAO."
  can:
    - "Let the operator sign orders through the order signer and create TWAP and stop-loss orders. The receiver is the Asset Safe, and a stop-loss order's oracles are pinned to Chainlink feeds."
    - "Let the emergency role cancel any order, set a relayer approval to zero, send any listed token to the Aragon Agent or the Asset Safe, and place recovery orders that buy USDC or USDT and pay the Agent."
    - "Let the technical role remove the operator Safe from the operator role, with every argument pinned. The emergency role keeps working on the same modifier (OD-57)."
  cannot:
    - "Let a motion add a token to the lists. That needs a DAO vote (OD-46)."
    - "Take a permission from a motion. It has no governance role; a DAO vote writes it (OD-57)."
  address: "To be deployed"
  sources: [ADR-007, ADR-005, OD-43, OD-46, OD-57, INV-014, INV-022]

