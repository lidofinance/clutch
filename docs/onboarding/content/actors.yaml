# Actor cards, grouped under the map node in `node`. Status: existing, instance, new or mixed.
# Label (optional): built, specified, open, existing or planned. `role` attaches the role's exact
# permissions from the compiled artifact. Addresses must already be recorded in the repository.

# --- Committee -------------------------------------------------------------------------------
- id: committee
  node: committee
  name: Treasury Management Committee and its Safe
  status: existing
  label: existing
  what: "The people who run the [[mandate]] day to day. The committee's own Safe stays as it is. Its seven signers also sign the two new Safes: the operator Safe and the emergency Safe."
  controlled_by: "Seven signers. The committee's Safe runs Safe v1.3.0 at 4 of 7."
  can:
    - "Operate the vault through the operator Safe, at 4 of 7."
    - "Act in an emergency through the emergency Safe, at 2 of 7."
    - "Configure the vault's rules in [the screening vendor]'s monitoring service."
    - "Review and publish the monthly report, and fix a [[cap]] breach within two working days."
    - "Restore the [[liquidity buffer]] within the mandate's window when it falls below its floor (OD-40)."
    - "Unlock a matured Lido product by a forum post and a budget motion (OD-41)."
    - "Accept decision records as the permanent acceptor, after EM's interim period."
  cannot:
    - "Hold the operator role on its own Safe. A dedicated operator Safe holds it."
    - "Relax a screening rule quietly. A relaxation is a reviewed change, with notice to the Emergency Brakes multisig and the forum (OD-45)."
    - "Accept a record that constrains the operator without a verification by the Emergency Brakes multisig."
    - "Give an exit that is independent of itself. The emergency Safe has the same people."
  numbers: ["Safe v1.3.0", "4 of 7", "rebalancing window: 2 working days"]
  address: "0xa02FC823cCE0D016bD7e17ac684c9abAb2d6D647"
  sources: [ADR-005, ADR-009, ADR-010, ADR-002, OD-40, OD-41, OD-45, "doc:docs/research/chain-reads-2026-09-30.md#committees"]

# --- Lido DAO ----------------------------------------------------------------------------------
- id: ldo-holders
  node: dao
  name: LDO holders
  status: existing
  what: "The owners of Lido DAO governance. They vote on every change that only the DAO may make, and they can stop any Easy Track [[motion]]."
  controlled_by: "Token holders."
  can:
    - "Vote in Aragon Voting: the [[enabling vote]], a policy replacement, a role membership change, a first-loss burn, a registry limit."
    - "Object to any Easy Track motion in its [[objection window]]. An objection of 0.5% of LDO stops it."
    - "Approve the mandate in a [[Snapshot vote]] before the on-chain vote."
  cannot:
    - "Act on the vault directly. Every DAO action goes through [[Dual Governance]] to the Aragon Agent."
    - "Shorten a motion's objection window."
  numbers: ["objection threshold: 0.5% of LDO", "objection window: 72 h"]
  sources: [ADR-006, ADR-005, "doc:docs/registers/parameters.md#parameters", "doc:ROADMAP.md#roadmap"]

- id: aragon-voting
  node: dao
  name: Aragon Voting
  status: existing
  label: existing
  what: "The DAO's on-chain voting contract. A passed vote goes through Dual Governance before the Aragon Agent executes it."
  controlled_by: "LDO holders."
  can:
    - "Manage the shared payment permission of the Easy Track executor, and rewrite it as one unit."
    - "Administer the shared stablecoin token list."
  cannot:
    - "Reach the vault's Safes except through Dual Governance and the Aragon Agent."
  address: "0x2e59A20f205bB85a89C53f1936454680651E618e"
  sources: [ADR-008, ADR-005, "doc:docs/research/chain-reads-2026-09-30.md#governance-authority"]

- id: dual-governance
  node: dao
  name: Dual Governance and its admin executor
  status: existing
  label: existing
  what: "The layer between a DAO vote and the Aragon Agent. It adds a delay, so every DAO action takes days."
  controlled_by: "The results of Aragon Voting, through the Dual Governance timelock."
  can:
    - "Run scripts as the Aragon Agent. Its admin executor is the only holder of the Agent's `RUN_SCRIPT_ROLE` and `EXECUTE_ROLE`."
  cannot:
    - "Skip its own delay."
  address: "0x23E0B465633FF5178808F4A75186E2F2F9537021"
  sources: [ADR-005, "doc:docs/research/chain-reads-2026-09-30.md#governance-authority"]

- id: aragon-agent
  node: dao
  name: Aragon Agent
  status: existing
  label: existing
  what: "The DAO treasury and its final authority. It is the only owner of the Asset Safe, the [[orders account]] and the [[first-loss Safe]], and every recovered asset comes back to it."
  controlled_by: "The Dual Governance admin executor."
  can:
    - "Do anything on the Asset Safe as its only owner: replace the policy, change a role's members, turn a [[module]] on or off, move any asset."
    - "Have the first-loss Safe burn or redeem the [[first-loss shares]], by vote."
    - "Add a token to the orders account's lists, for the operator or for [[recovery order|recovery orders]], by vote. No motion can write the order signer's permission (OD-36, OD-46)."
    - "Grant the operator [[delegatecall]]. Only a DAO vote can do this (OD-36)."
    - "Receive recovered assets: every emergency transfer out of the vault's accounts, and every recovery order, pays it."
    - "Pay funding through Aragon Finance, and administer both funding registries."
  cannot:
    - "Approve an Asset Safe transaction with a contract signature. It uses only `approveHash`, or it sends the transaction itself."
    - "Be reached by an Easy Track motion. Easy Track has no authority over it."
  numbers: ["owns the Asset Safe, the orders account and the first-loss Safe, each at 1 of 1"]
  address: "0x3e40D73EB977Dc6a537aF587D48316feE66E9C8c"
  sources: [ADR-005, ADR-006, ADR-007, ADR-008, OD-36, OD-46, INV-001, INV-021, INV-023]

# --- Funding path ------------------------------------------------------------------------------
- id: finance
