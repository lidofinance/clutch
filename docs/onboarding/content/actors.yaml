- id: emergency-safe
  node: emergency-safe
  name: Emergency Safe
  status: instance
  label: specified
  what: "A new Safe with five signers: two committee members, two Emergency Brakes members and one member of neither body. Three must sign, so the committee cannot use it alone. It holds no assets, and no guard screens it."
