  can:
    - "Give each new Safe the same audited code: the singleton, through Safe's proxy factory."
    - "Batch the operator Safe's calls through MultiSendCallOnly, the only delegatecall target that the vendor is asked to allow."
  cannot:
    - "Show a long record. v1.5.0 became the version of new Safes in Safe{Wallet} on 2026-09-22."
  numbers: ["audited by Certora, with formal verification, and by Ackee"]
  addresses:
