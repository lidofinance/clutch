    - {name: "ComposableCoW", address: "0xfdaFc9d1902f4e0b84f65F49f244b32b31013b74"}
    - {name: "TWAP handler", address: "0x6cF1e9cA41f7611dEf408122793c358a3d11E5a5"}
    - {name: "StopLoss handler", address: "0x412c36e5011cd2517016d243a2dfb37f73a242e7"}
    - {name: "ExtensibleFallbackHandler", address: "0x2f55e8b20D0B9FEFA187AA7d00B6Cbe563605bF5"}
  sources: [ADR-007, INV-022, INV-023, "doc:docs/research/cow-orders-account-2026-10-06.md#conditional-orders-twap-and-stop-loss"]

- id: cow
  node: orders
  name: CoW Protocol and its watch-tower
  status: existing
  label: existing
  what: "The order-based exchange that settles every vault order. Solvers compete to fill an order at its limit or better, and the settlement pays the order's receiver directly."
  controlled_by: "External."
  can:
    - "Settle an order from the orders account, and pay its pinned receiver."
    - "Hold each fill to at least the on-chain market. Bonded solvers compete on the surplus for users, and under the [[EBBO]] rule a solver that fills worse than on-chain AMM routing must refund the user."
    - "Post each part of a conditional order to its order book through its [[watch-tower]]. If the watch-tower stops, the orders wait and no funds move."
  cannot:
    - "Take an order from the Asset Safe. The Asset Safe never pre-signs an order and never approves CoW's relayer."
    - "Bound an order's price on chain. The order's own limit is the only bound."
  sources: [ADR-007, INV-013, "test:test_D6_out_of_scope_venues_are_refused", "doc:docs/research/cow-orders-account-2026-10-06.md#conditional-orders-twap-and-stop-loss", "doc:docs/research/cow-orders-account-2026-10-06.md#cows-rules-on-the-fill-price"]

- id: routers
  node: orders
  name: Uniswap and 1inch
  status: existing
  label: open
  what: "Router swaps that the committee asked for. They are not in the launch scope."
  controlled_by: "External."
  can:
    - "Take a swap whose recipient and tokens a permission pins."
  cannot:
    - "Have their minimum output bounded by the modifier. They wait until [the screening vendor] can check a swap's minimum output against a market price before execution (OD-43)."
  sources: [ADR-007, ADR-011, OD-43, "doc:docs/research/cow-orders-account-2026-10-06.md#uniswap-and-1inch"]

# --- Monitoring ---------------------------------------------------------------------------------
- id: lido-monitoring
  node: monitoring
  name: Lido on-chain monitoring
  status: mixed
  label: specified
  what: "Lido's existing monitoring platform, with new detectors for the vault. It watches and alerts. It blocks nothing."
  controlled_by: "`@lidofinance/defi-tech` writes the detector specification. `@lidofinance/lido-valset-vroom` reviews it and runs the platform (OD-13)."
  can:
    - "Alert on [[drift]] from the artifact on every modifier, the safety policy included, since motions can write exits there (OD-49); on approvals and budget burn; on owner, threshold, module, guard and singleton changes of the new Safes; and on the orders account's fallback handler, domain verifier and relayer approvals."
    - "Watch the [[liquidity buffer]] all the time, and warn before it reaches its floor (OD-40)."
    - "Check each fill against a market price, and alert on open orders older than 30 days, on a recovery order whose limit sits far below a market price, on tokens left in the orders account and on late parts of conditional orders (OD-43, OD-47, OD-48)."
    - "Alert on any change of the first-loss Safe's balance, owners or modules (OD-42)."
    - "Page at high severity on every emergency swap (OD-48)."
    - "Follow a new Lido product's exposure against the protocol cap until a motion unlocks it, and record the changes of the screening rules that the vendor reports (OD-41, OD-45)."
    - "Follow every motion, flag odd top-ups and repeated budget motions, and grade emergency actions."
    - "Publish the cap reading of each [[fortnightly snapshot]] to IPFS, and page the Emergency Brakes multisig on the cap-breach trigger."
    - "Flag a monthly report that is still missing on day 8."
  cannot:
    - "Block a transaction. If it stops, no permission widens."
  numbers: ["detector specification: phase 1", "vault detectors built: none yet"]
  sources: [ADR-009, ADR-010, ADR-007, OD-13, OD-32, OD-40, OD-41, OD-42, OD-43, OD-45, OD-47, OD-48, OD-49, "doc:ROADMAP.md#roadmap"]

- id: vendor-monitoring
  node: monitoring
  name: "[the screening vendor]'s monitoring"
  status: mixed
  label: specified
  what: "The vendor's own detectors, for risks that a permission cannot see."
  controlled_by: "[the screening vendor]. The committee configures the vault's rules, with support from `@lidofinance/defi-tech` (OD-13)."
  can:
    - "Watch for depegs, protocol compromise and counterparty anomalies."
  cannot:
    - "Replace Lido's own monitoring of the vault's permissions."
  sources: [ADR-009, OD-13]

- id: incident-process
  node: monitoring
  name: Lido incident process
  status: existing
  label: existing
  what: "The general Lido process for paging and escalation. Clutch's alerts go into it."
  controlled_by: "Lido's existing incident responders."
  can:
    - "Send every vault alert to the people who act on it."
    - "Page the Emergency Brakes multisig for the Easy Track pause and for the technical role."
  cannot:
    - "Act on the vault. It only reaches the people who can."
  sources: [ADR-009, ADR-005, "lip:part-6"]

# --- Reporting ----------------------------------------------------------------------------------
- id: report-generator
  node: reporting
  name: Report generator
  status: new
  label: specified
  what: "A program in the Clutch repository that builds each report from the chain at a pinned block. Anyone can run it again and get the same result."
  controlled_by: "`@lidofinance/defi-tech` builds it. The committee reviews and publishes each report. Monitoring runs it every fortnight."
  can:
    - "Show balances, positions, exposures, each ratio with its numerator and denominator, and each price with its source and time."
    - "Show the first-loss Safe as a sub-allocation of the vault."
    - "Show the liquidity buffer against its floor in every report (OD-40)."
    - "Count a new Lido product in the protocol cap until a motion unlocks it (OD-41)."
  cannot:
    - "Carry an old price over silently. A price older than 24 hours counts as missing."
    - "Anchor a report on chain."
  numbers: ["monthly report: within 7 days after month-end", "incident report: within 72 h", "build: phase 2"]
  sources: [ADR-009, OD-14, OD-32, OD-40, OD-41, "lip:part-9"]

- id: ipfs-forum
  node: reporting
  name: IPFS and the research forum
  status: existing
  label: existing
  what: "Where reports and readings live. IPFS stores each report by its content. The forum post is the only anchor of a report's identifier."
  controlled_by: "IPFS: content addressing. The forum: Lido's research forum."
  can:
    - "Hold the monthly reports and the fortnightly cap readings."
    - "Carry the disclosure before each motion, the post after each revoke, the post before each top-up, and the mandate."
  cannot:
    - "Give the guarantee of a chain. No report is anchored on chain."
  sources: [ADR-009, ADR-006, ADR-008]

- id: coingecko
  node: reporting
  name: Coingecko prices
  status: existing
  label: existing
  what: "The price source for reports: the closing price at the Snapshot Date."
  controlled_by: "External."
  can:
    - "Price each asset in a report. A missing or stale price falls back to the asset's on-chain rate into an underlying that has a price."
    - "Give the stETH price that is pinned when the enabling vote is prepared, for the stETH registry limit."
  cannot:
    - "Price an asset that has neither source. The report then lists it as unpriced, and no top-up rests on that snapshot."
  numbers: ["a price older than 24 h counts as missing"]
  sources: [ADR-009, ADR-008]
