  name: Treasury Management Committee and its Safe
  status: existing
  label: existing
  what: "The people who run the [[mandate]] day to day, and their existing Safe, which holds the operator role (OD-80). Two of the seven signers also sit on the emergency Safe. Once the launch cap lifts, every transaction of the Safe needs [the screening vendor]'s approval first, the committee's other duties included (OD-83). Until then the [[launch cap]] applies (OD-54, OD-55)."
  controlled_by: "Seven signers, at 4 of 7. Safe v1.3.0. A change of the committee's members needs no Snapshot each time: monitoring alerts on every change of the Safe's owners or threshold (OD-109)."
  can:
    - "Hold the operator role: change positions in approved protocols, within budgets."
    - "Create every Clutch motion as the trusted caller of the [[universal factory]], and cancel its own motions."
    - "Hold the operator role on the [[orders account]]: place CoW market, [[limit order|limit]] and [[TWAP]] orders that pay the Asset Safe."
    - "Return any vault token to the Aragon Agent by a transfer pinned to it, with no motion and no vote. This is a recovery, for example of the excess above the launch cap, or at the end of the mandate (OD-108)."
    - "Execute the first-loss terms on the Earn team's written instruction: propose a burn of the [[first-loss shares]] as an Easy Track motion, or redeem them to the Asset Safe through its first-loss role (OD-60, OD-67, OD-108)."
