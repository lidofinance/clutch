  what: "Two new instances of Easy Track's top-up factory, one for stablecoins and one for stETH. They create the [[top-up]] motions that fund the vault."
  controlled_by: "The operator Safe is the [[trusted caller]] of both. The DAO registers them by vote."
  can:
