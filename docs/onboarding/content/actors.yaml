# --- Safety modifier ----------------------------------------------------------------------------
- id: safety-modifier
  node: safety-modifier
  name: Safety modifier
  status: instance
  label: built
  what: "A second Roles modifier on the Asset Safe, for the emergency and technical roles. No guard screens it, so recovery never waits for the vendor."
  controlled_by: "Its owner, the Asset Safe, so in the end the DAO."
  can:
    - "Carry the emergency role and the technical role. It has no budget keys. The exit-governance role is specified, not built (OD-49)."
    - "Keep working after the technical role disables the operator modifier."
  cannot:
    - "Be disabled by the technical role. If it has a defect, the fix is a DAO vote."
  address: "To be deployed"
  sources: [ADR-005, INV-009, OD-49, "test:test_D4_module_disabling_is_technical_only_and_pinned"]

- id: role-emergency
  node: safety-modifier
  name: The emergency role
  status: new
  label: built
  role: emergency
  what: "The permissions of the emergency Safe on the safety modifier. They only reduce exposure. It moves assets only to the Aragon Agent or into the orders account, and a recovery order pays only the Agent. A recovery order, which is specified, has no on-chain price floor; CoW's rules hold its fill to the on-chain market (OD-48)."
  controlled_by: "Held by the emergency Safe, at 2 of 7."
  can:
    - "Revoke any operator target or function. One revoke reaches every operator permission on the modifier; the orders modifier needs its own, which is specified."
    - "Set any operator spender's approval to zero."
    - "Exit positions into the Asset Safe: cancel, claim and redeem on Earn, and redeem sUSDS. A protocol that a motion onboards gets its emergency exit from the same motion, which is specified (OD-49)."
    - "Unwrap wstETH and WETH, and stake ETH."
    - "Transfer the vault's tokens and Earn shares, but only to the Aragon Agent."
  cannot:
    - "Add a permission or give a non-zero approval."
    - "Send an asset anywhere except the Aragon Agent. The transfer to the orders account is specified but not built."
    - "Disable a module."
    - "Reach the first-loss shares. They sit in the first-loss Safe, which has no module (OD-42)."
  sources: [ADR-005, ADR-008, OD-42, OD-48, OD-49, INV-002, "test:test_D4_emergency_flow", "test:test_emergency_cannot_give_a_non_zero_approval", "test:test_emergency_can_durably_stop_operator_reapproval"]

- id: exit-governance
  node: safety-modifier
  name: The exit-governance role
  status: new
  label: specified
  what: "The permissions that an enacted Easy Track motion uses on the safety modifier. The motion that onboards a protocol also adds its emergency exit through this role."
  controlled_by: "Held by the Easy Track script executor, so only an enacted motion uses it. The DAO creates it at the enabling vote."
  can:
    - "Write an exit for the emergency role: redeem, withdraw, claim and cancel with the receiver and owner pinned to the Asset Safe, a transfer pinned to the Aragon Agent, or an approval set to zero."
  cannot:
    - "Write an entry, a deposit or a non-zero approval. The templates emit only exits; the modifier cannot check that, so tests and the audit do."
    - "Grant delegatecall, touch the technical role or membership, set an allowance, or target the Asset Safe or any module of it."
  sources: [ADR-006, ADR-005, OD-49, INV-025]

- id: role-technical
  node: safety-modifier
  name: The technical role
  status: new
  label: built
  role: technical
  what: "One permission for the Emergency Brakes multisig: switch off the operator modifier."
  controlled_by: "Held by the Emergency Brakes multisig, at 3 of 5."
  can:
    - "Call `disableModule` on the Asset Safe, with the module pinned to the operator modifier. The operator and governance roles stop at once."
    - "Do the same on the orders account, with the module pinned to its operator modifier. Specified, not built."
  cannot:
    - "Disable the safety modifier or any later module."
    - "Do anything else."
  sources: [ADR-005, ADR-009, INV-009, "test:test_D4_module_disabling_is_technical_only_and_pinned"]

# --- Policy pipeline and repository -------------------------------------------------------------
- id: constellation
  node: policy
  name: The constellation
  status: mixed
  label: built
  what: "The permission policy, written as a Zodiac [[constellation]] in TypeScript under `policy/constellation/`. It names the Safes, the modifiers, the roles, the permissions and the budget keys."
  controlled_by: "The repository. A change is a reviewed pull request. `@lidofinance/defi-tech` owns it."
  can:
    - "State every permission of the four built roles in one place. The exit-governance role joins when it is built (OD-49)."
    - "Go to the Lido Zodiac workspace, so that the UI can show it."
  cannot:
    - "Change the chain by itself. Only a vote or a motion applies a policy."
  numbers: ["copied from the policy provider's constellation at `02ea37d`", "copied files keep LGPL-3.0-only (OD-34)"]
  sources: [ADR-004, OD-33, OD-34, "doc:policy/constellation/PROVENANCE.md#changes-from-upstream"]

- id: compiler
  node: policy
  name: Clutch's policy compiler
  status: new
  label: built
  what: "Clutch's own TypeScript program on the Zodiac roles SDK. It turns the constellation into the [[artifact]], offline, with the same result every time."
  controlled_by: "`@lidofinance/defi-tech`."
  can:
    - "Compile the modifier calls in order, the expected condition trees and the budget keys."
    - "Run offline from a frozen lockfile with pinned versions."
  cannot:
    - "Compile an entry that only the hosted app can compile, such as an action or a DeFi Kit preset. It refuses one."
  sources: [ADR-004, "doc:policy/constellation/PROVENANCE.md#build"]

- id: artifact
  node: policy
  name: The policy artifact
  status: new
  label: built
  what: "The committed JSON file that reviewers approve. It holds every modifier call in order, the expected condition tree for each role, target and function, and the budget keys."
  controlled_by: "Reviewers approve it in each policy pull request. CI checks that it equals a fresh compile."
  can:
    - "Feed the fork tests now, and later the enabling vote, the Easy Track templates and the [[drift detector]]."
  cannot:
    - "Describe mainnet yet. The committed artifact is for the fork tests: stand-in holders and dry-run amounts."
  numbers: ["format `clutch.policy-artifact/1`"]
  sources: [ADR-004, INV-016, "doc:test/README.md#the-policy-pipeline", "doc:.github/workflows/policy.yml"]

- id: round-trip
  node: policy
  name: Round-trip check
  status: new
  label: specified
  what: "A planned check that reads the applied permissions back from the modifier's events on a fork, and compares them with the artifact. The chain then checks the compiler."
  controlled_by: "`@lidofinance/defi-tech`, in phase 2."
  can:
    - "Catch a compiler or SDK bug before it reaches the chain."
  cannot:
    - "Run yet. A decode of real modifier events must be checked first."
  sources: [ADR-004, INV-016, "doc:ROADMAP.md#roadmap"]

- id: zodiac-app
  node: policy
  name: Zodiac app and the Lido workspace
  status: mixed
  label: planned
  what: "The policy provider's hosted app. The team pushes the constellation to a Lido workspace there. The app shows the account graph, the policy, the difference from the chain and the transactions that a change needs. Lido gives the provider a written list of what the UI must also show, from Lido's readings, and Lido builds that display itself if the provider declines (OD-44)."
  controlled_by: "The app: the policy provider. The workspace and its key: `@lidofinance/defi-tech` (OD-35). The committee and the Emergency Brakes multisig can view it."
  can:
    - "Show the system and its drift in a UI."
    - "Take a push from a team member, from the merged `main`, with the key in a local file that git ignores."
  cannot:
    - "Change the policy. A change made in the UI is drift."
    - "Give signers, a vote or a motion a transaction, unless Clutch's compiler makes the same calls from the same commit."
    - "Set a Safe's version, guard or fallback handler."
    - "Be used by CI or by an agent. Neither holds the key."
    - "Show the vault's value today. The hosted app shows no balances, value or alerts. The list asks for the value per account, asset and protocol, the [[liquidity buffer]], each cap, the budget left, open orders, pending motions, and warnings before signing."
    - "Make a third party's live value count. Such a value is labelled as indicative and never feeds a cap, a top-up or a report (OD-44)."
  sources: [ADR-004, ADR-009, OD-33, OD-35, OD-44, "doc:docs/research/zodiac-constellation-2026-10-06.md#2-what-runs-locally-and-what-only-the-hosted-app-runs", "doc:docs/research/cow-orders-account-2026-10-06.md#the-hosted-zodiac-app"]

- id: repository
  node: policy
  name: The Clutch repository
  status: new
  label: built
  what: "`lidofinance/clutch`, the single record of the system. It holds the decisions, specifications, policy, tests, runbooks and this guide."
  controlled_by: "`@lidofinance/defi-tech` owns it. `@lidofinance/review-gh-workflows` owns `.github/`."
  can:
    - "Merge a change only through a pull request, with a code-owner review and an approval from someone other than its creator."
    - "Run CI on every pull request: the docs bundle, the policy artifact and this guide."
  cannot:
    - "Hold a key, a seed or an RPC credential."
    - "Go public before deployment. Nothing enters it that could not be published at that point."
  sources: [ADR-001, ADR-002, ADR-003, "doc:SECURITY.md#repository-rules"]

- id: em
  node: policy
  name: EM, the interim acceptor
  status: existing
  what: "The CTO role. EM decides the open items and accepts decision records until the committee takes over as the permanent acceptor."
  controlled_by: "A role, not an account."
  can:
    - "Accept a decision record. An acceptance is an engineering decision. It authorises nothing on chain."
    - "Close an [[open decision]]."
  cannot:
    - "Accept a record that constrains the operator without the Emergency Brakes multisig's verification."
  sources: [ADR-002, "doc:docs/registers/open-decisions.md#open-decisions"]

- id: ai-agents
  node: policy
  name: AI agents
  status: new
  what: "Coding agents draft most text, code and tests, and open pull requests. Humans decide, review and merge."
  controlled_by: "Humans: EM and the code-owner reviewers."
  can:
    - "Branch, draft, write code and tests, and open pull requests."
    - "Record a human's own acceptance, only on that human's explicit written instruction, marked as recorded (OD-31)."
  cannot:
    - "Merge, deploy, or touch `deployed/`."
    - "Mark a page reviewed, or record a body's verification."
    - "Set a parameter: budgets, ceilings, swap settings, funding limits, allowlists or role membership."
    - "Use the Zodiac key."
  sources: [ADR-003, OD-31, "doc:AGENTS.md#out-of-scope-for-agents"]

# --- Asset Safe ---------------------------------------------------------------------------------
- id: asset-safe
  node: asset-safe
  name: Asset Safe
  status: instance
  label: built
  what: "The vault. A new Safe that holds the assets. The Aragon Agent is its only owner. The roles act on it only through its two modifiers. The first-loss shares sit apart in the first-loss Safe, and a token for an order sits in the orders account until the fill."
  controlled_by: "The Aragon Agent, at 1 of 1. Safe v1.5.0."
  can:
    - "Own both modifiers, and run their permitted calls as itself: it is their [[avatar]]."
    - "Send a token to the orders account for an order, under the orders budgets. Specified, not built."
  cannot:
    - "Take an ERC-721 or ERC-1155 safe transfer, or sign by EIP-1271. It has no [[fallback handler]], on purpose."
    - "Have a guard or a module guard. Recovery never passes through vendor code."
    - "Change its Safe version without a DAO vote."
  numbers: ["Safe v1.5.0", "1 of 1", "no guard", "no fallback handler"]
  address: "To be deployed"
  sources: [ADR-005, INV-001, "test:test_asset_safe_shape"]

