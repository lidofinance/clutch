# --- Easy Track ---------------------------------------------------------------------------------
- id: easy-track
  node: easytrack
  name: Easy Track
  status: existing
  label: existing
  what: "Lido's optimistic governance. A motion enacts after its window unless LDO holders object. Clutch adds factories to it and changes none of its settings."
  controlled_by: "The DAO sets its settings and its factory list. The Emergency Brakes multisig can pause it. Only the DAO can unpause it."
  can:
    - "Run a motion from a registered factory, with the global objection window."
    - "Rebuild the motion's script at enactment and require the hash stored at creation."
    - "Let anyone enact a motion when its window ends without an objection."
  cannot:
    - "Shorten a motion's window. The global window can never go below 48 hours."
    - "Reach the Aragon Agent."
  numbers: ["window: 72 h", "objection: 0.5% of LDO", "window floor: 48 h"]
  address: "0xF0211b7660680B49De1A7E9f25C65660F0a13Fea"
  sources: [ADR-006, INV-005, "doc:docs/research/chain-reads-2026-09-30.md#easy-track"]

- id: evmscript-executor
  node: easytrack
  name: Easy Track script executor
  status: existing
  label: existing
  what: "The contract that runs an enacted motion's script. In Clutch it holds the governance role on the operator modifier."
  controlled_by: "Easy Track. Only an enacted motion makes it act."
  can:
    - "Act as the governance role: write the operator's permissions and budgets, inside the limits that the policy sets."
    - "Make payments through Aragon Finance, under the shared payment permission."
    - "Spend the funding registries' limits."
  cannot:
    - "Run scripts as the Aragon Agent. It holds neither `RUN_SCRIPT_ROLE` nor `EXECUTE_ROLE`."
    - "Add a recipient to the vault's registries, or change their limit or period."
  address: "0xFE5986E06210aC1eCC1aDCafc0cc7f8D63B3F977"
  sources: [ADR-005, ADR-006, ADR-008, "doc:docs/research/chain-reads-2026-09-30.md#easy-track"]

- id: template-factories
  node: easytrack
  name: Template factories (six)
  status: new
  label: specified
  what: "The only new contracts that Clutch may add. Each factory owns one fixed [[template]]. A motion gives it typed values, such as a target, an asset and a budget key, and the factory builds the permission."
  controlled_by: "The operator Safe is the trusted caller, fixed at deployment. The DAO registers each factory by vote."
  can:
    - "Onboard a protocol without a DAO vote: wrap and unwrap, a tokenized vault, a queue vault, a spender approval, a swap instance or a Morpho Blue market."
    - "Onboard Lido Lend in one motion through the Morpho Blue template, once its market exists."
  cannot:
    - "Accept a condition tree from a motion."
    - "Remove a permission. Every removal is the emergency Safe's revoke (OD-09)."
    - "Add a recovery swap pair. The swap-instance template is for rebalancing only."
  numbers: ["6 templates", "external audit in phase 3"]
  sources: [ADR-006, ADR-011, OD-09, "lip:part-4"]

- id: budget-factory
  node: easytrack
  name: Budget factory
  status: new
  label: specified
  what: "A new Easy Track factory that sets an operator [[budget key]]. Each key has its own ceilings."
  controlled_by: "The operator Safe is the trusted caller. The DAO registers it by vote."
  can:
    - "Set the balance, the maximum and the refill of one of the operator's keys, below that key's ceilings."
  cannot:
    - "Set a refill period below 30 days."
    - "Touch a key that is not the operator's."
    - "Use ceilings before the attested figures enter the repository."
  numbers: ["refill period: 30 days or more", "retune: every 2 weeks", "a second motion on one key within 14 days alerts"]
  sources: [ADR-009, INV-012, "lip:part-7"]

# --- Operator Safe ------------------------------------------------------------------------------
- id: operator-safe
  node: operator-safe
  name: Operator Safe
  status: instance
  label: specified
