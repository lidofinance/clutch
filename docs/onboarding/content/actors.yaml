    - "Relax a screening rule without a review and a notice on the forum."
    - "Act alone in an emergency: it holds two of the [[Emergency Safe]]'s five seats."
    - "Lose the operator role without a DAO vote. Easy Track fixes a factory's trusted caller, so a move to another Safe also needs a new universal factory."
