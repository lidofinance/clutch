  node: operator-modifier
  name: The governance role
  status: new
  label: built
  role: governance
  what: "The permissions that an enacted Easy Track motion uses on the operator modifier. A motion can widen what the operator may do, but only in bounded ways."
  controlled_by: "Held by the Easy Track script executor, so only an enacted motion uses it."
  can:
