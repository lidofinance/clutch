    - "Act as the restart role: enable the operator modifier on the Asset Safe after the switch, and nothing else (OD-104)."
    - "Act as the orders modifier's governance and approvals roles: add a token to the order lists, and raise an approval of CoW's vault relayer (OD-103)."
    - "Act as the first-loss burn role on the first-loss modifier: burn the DAO's [[first-loss shares]] in an enacted burn motion (OD-67)."
    - "Act as the insurance roles: move insurance money from the Asset Safe to the first-loss Safe, and create, burn and pay out insurance funds (OD-107)."
