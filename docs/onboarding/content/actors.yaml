    - "Raise the universal factory's [[motion counter]] at every stop, and whenever an open motion must not enact."
    - "Make every emergency removal of an operator permission, at once. A forum post follows. A routine removal is a motion."
    - "Overrule a silent or compromised committee: the two Emergency Brakes members and the fifth signer form a quorum."
  cannot:
