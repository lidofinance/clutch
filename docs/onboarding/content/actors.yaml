- id: coingecko
  node: reporting
  name: Coingecko and the price waterfall
  status: existing
  label: existing
  what: "The first price source for reports, the closing price at the Snapshot Date, and the written five-level waterfall behind it (OD-62)."
  controlled_by: "External sources. The committee's written valuation policy sets the waterfall's band and the share that its last level may price."
  can:
    - "Price each asset in a report. When Coingecko's price is missing, more than 24 hours old or outside a band around a second aggregator's price, the next level applies: a second aggregator, a Chainlink feed or a pool's time-weighted price, the on-chain rate into a priced underlying, and last the committee's estimate with its method."
  cannot:
    - "Leave an asset unpriced. Every price carries its level and its source, and a tranche vote waits while the committee's estimate prices more than the set share of the vault."
