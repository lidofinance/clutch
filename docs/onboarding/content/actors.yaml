    - "Alert on [[drift]] from the artifact on every modifier, the safety policy included, since motions can write exits there (OD-49); on approvals and budget burn; on owner, threshold, module, guard and singleton changes of the new Safes and the committee's Safe (OD-109); and on the orders account's fallback handler, domain verifier and relayer approvals."
    - "Alert on every transfer to the Aragon Agent (OD-108)."
    - "Check each fill against a market price, ask the committee at 30 days to confirm or cancel each open order, and alert on a recovery order whose limit sits far below a market price, on tokens left in the orders account and on late parts of conditional orders (OD-43, OD-48, OD-61)."
    - "Alert on any change of the first-loss Safe's balance, owners or modules, page on every burn motion and every action of the first-loss role, and alert on a redemption before the guard is set and on an excess above the launch cap that stays (OD-42, OD-60, OD-67)."
    - "Page at high severity on every emergency swap (OD-48)."
    - "Follow a new Lido product's exposure against the protocol cap until a motion unlocks it, and record the changes of the screening rules that the vendor reports (OD-41, OD-45)."
    - "Decode every motion of the universal factory, and alert on a failed enactment, a raise of the motion counter, a ceiling motion, a restart motion and few free motion slots (OD-94). Flag repeated budget motions, and grade emergency actions."
    - "Publish the cap reading of each [[fortnightly snapshot]] to IPFS, and page the emergency Safe on the cap-breach trigger, met in either reading (OD-58, OD-84)."
    - "Compare Lido's published readings with the policy provider's at each snapshot, and flag a tranche vote that starts while they differ by more than the band (OD-84)."
    - "Alert on a change of the mandate's rules made in the Zodiac UI (OD-87), and on a transaction of the committee's Safe that waits too long for [the screening vendor]'s approval (OD-88)."
    - "Flag a monthly report that is still missing on day 8."
  cannot:
    - "Block a transaction. If it stops, no permission widens."
