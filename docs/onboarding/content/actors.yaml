  controlled_by: "`@lidofinance/defi-tech`, in phase 2."
  can:
    - "Catch a compiler or SDK bug before it reaches the chain."
  cannot:
    - "Run yet. A decode of real modifier events must be checked first."
  sources: [ADR-004, INV-016, "doc:ROADMAP.md#roadmap"]

