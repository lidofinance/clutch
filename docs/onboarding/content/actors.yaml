    - "Deposit into and redeem from earnETH, earnUSD and sUSDS. Claims pay the Asset Safe."
    - "Convert DAI to USDS and back through Sky's converter, paid to the Asset Safe."
    - "Approve a protocol spender. The [[approval]] spends that spender's budget key, or stays under a fixed ceiling."
  cannot:
    - "Transfer a token. The transfer to a rebalancing instance is specified but not yet in the policy."
    - "Borrow, or use a venue outside the launch scope."
    - "Administer a modifier or the Safe, or change its own permissions."
    - "Use delegatecall."
    - "Redeem the first-loss shares. Only a written rule forbids it: `redeem` is open on both Earn redeem queues."
  numbers: ["one role key: `operator`"]
  sources: [ADR-005, ADR-009, INV-003, INV-008, INV-018, "test:test_D3_operator_cannot_route_around_avatar"]

- id: role-governance
  node: operator-modifier
  name: The governance role
  status: new
  label: built
  role: governance
  what: "The permissions that an enacted Easy Track motion uses on the operator modifier. A motion can widen what the operator may do, but only in bounded ways."
  controlled_by: "Held by the Easy Track script executor, so only an enacted motion uses it."
  can:
    - "Write operator permissions for a target that a motion names, under the `operator` key only."
    - "Set the operator's budgets, with a refill period of at least 30 days."
    - "Revoke an operator target or function. No factory plans to use this."
  cannot:
    - "Grant or remove a role, or touch the emergency or technical role."
    - "Make the operator modifier or the Asset Safe an operator target."
    - "Grant the operator delegatecall (OD-36)."
    - "Submit its own condition tree. The factory builds the tree from a fixed template."
  alert: "**OD-38 is open.** The policy does not stop a motion from making the **safety modifier** an operator target. A fork probe showed that the operator could then give itself a new role on the safety modifier and move USDC out of the Asset Safe. The recommended fix refuses the safety modifier too, with a regression test. Nothing is deployed, so no asset is at risk today."
  numbers: ["refill period: 30 days or more"]
  sources: [ADR-006, ADR-005, INV-004, OD-36, OD-38, "test:test_policyadmin_cannot_grant_operator_admin_targets"]

- id: budget-keys
  node: operator-modifier
  name: Budget keys
  status: new
  label: built
  what: "Refillable quotas on the operator modifier, counted in token units. An approval to a protocol spends the key of that spender. An approval of zero is always free."
  controlled_by: "The DAO sets them first. The budget factory retunes them by motion."
  can:
