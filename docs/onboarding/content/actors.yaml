    - "Review and publish the monthly report, and fix a [[cap]] breach within two working days."
    - "Explain on the forum a difference above the band between Lido's reading and the policy provider's; no [[tranche vote]] starts until they agree (OD-84)."
    - "Unlock a matured Lido product by a forum post and a budget motion (OD-41)."
    - "Restart the operator after the switch, by a motion that waits for the objection window (OD-104)."
