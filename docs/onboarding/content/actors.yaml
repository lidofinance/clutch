  can:
    - "Pay out of the Aragon Agent. The permission binds the token and the amount of each payment."
    - "Pay USDS after a DAO vote rewrites the permission. The vote keeps every other entry as it is."
  cannot:
    - "Bind the receiver. The funding registry and the factory do that."
    - "Cap a whole motion. A ceiling applies to one payment, so one motion can carry several payments."
  addresses:
    - {name: "Aragon Finance", address: "0xB9E5CBB9CA5b0d659238807E84D0176930753d86"}
    - {name: "Aragon ACL", address: "0x9895F0F17cc1d1891b6f18ee0b483B6f221b37Bb"}
  sources: [ADR-008, "lip:part-5", "doc:docs/research/chain-reads-2026-09-30.md#funding-path"]

