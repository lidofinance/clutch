- id: universal-factory
  node: easytrack
  name: The universal factory
  status: new
  label: specified
  what: "One new Easy Track factory that carries every Clutch [[motion]] and holds the roles that motions use. Its Easy Track registration is its address book: one call, its own `applyMotion`. A motion is a list of [[raw write|raw writes]], and the factory checks no write's content: the policy of each motion role decides what passes, and the [[objection window]] is the bound on where funds go."
  controlled_by: "Nobody can upgrade it. The committee's Safe is its [[trusted caller]], fixed at deployment. Aragon Voting registers it in Easy Track, and can raise its [[motion counter]] as its owner. A changed factory is a new registration, by vote."
  can:
    - "Check an enacted motion again in `applyMotion`, and then make its writes, in order, through its roles: governance and insurance funding on the operator modifier, exit governance and restart on the safety modifier, governance and approvals on the orders modifier, and the first-loss burn and insurance roles on the first-loss modifier."
    - "Fit a motion that adds a token under EIP-7825's gas cap, as one call: Easy Track's executor copies a script into memory three times for each call that the script makes."
    - "Show a motion's writes: they are the motion's calldata, which `decodeEVMScriptCallData` returns."
    - "Widen a permission: a motion's write can grant any plain call on an ordinary target, with the condition tree that the motion carries."
    - "Remove a permission by a revoke, or by a write of the permission without the removed entries. A routine removal is such a motion."
    - "Bring back a target that the emergency role revoked as a whole: a motion scopes it again, and the permissions stored under it work as before."
    - "Restore the orders account after an emergency stop, in one motion: the operator's targets, order trees, cancels and returns, and the relayer approvals that the motion names."
    - "Set a [[budget key]], also a new one for a new spender, under its derived key, so the policy holds no spare keys."
    - "Keep one [[policy version]]. A motion that writes on a modifier fails if another such motion enacted after its creation, and a motion that only acts is exempt."
    - "Carry the other motions: an onboarding, a token for the orders account, the restart, the first-loss burn and the insurance funds."
  cannot:
    - "Grant a delegatecall, except the order signer's on the orders account, or reach an administrative target or function. The guards of each motion role's policy refuse such a write, and the whole motion fails."
    - "Check that a widened permission pins its receivers, spends a budget or has an emergency exit. Reviewers check this in the 72 hours (INV-034)."
    - "Write through any contract but the vault's four modifiers, or carry more than 64 writes in one motion."
    - "Pay from the treasury. Its address book holds no payment call (INV-037)."
    - "Use its roles outside an enacted motion. Only Easy Track's executor calls `applyMotion` (INV-032)."
    - "Enact a motion if the [[motion counter]] changed since its creation, or a permission motion if the policy version changed (INV-033)."
    - "Remove a permission at once. An emergency removal is the emergency Safe's revoke."
  numbers: ["3,371 of EIP-170's 24,576 bytes", "at most 64 writes in one motion", "a motion that adds a token: 16 writes, 7,790,415 of EIP-7825's 16,777,216 gas", "a motion that restores the orders account: 9 writes, 3,622,403 gas", "a motion that onboards an ERC-4626 vault: 10 writes, 2,553,752 gas", "external audit in phase 3"]
  sources: ["ADR-013#d3", "ADR-013#d5", "ADR-013#d6", "ADR-013#d8", "ADR-013#d9",
    "ADR-013#d10", "ADR-013#d11", "ADR-013#d16", "ADR-013#proposed-direction", "ADR-013#consequences",
    "ADR-007#d41", "ADR-006#d9", "ADR-006#d10", "ADR-006#d14", "ADR-011#d13", "OD-09", "OD-70", "OD-134", "OD-135",
    "ADR-013#d18", "ADR-013#d12", "ADR-006#d13", "ADR-008#d23", "ADR-014#d7", "INV-035", "INV-040",
    "test:test_uf_the_factory_holds_the_motion_roles", "test:test_factory_orders_token_motion",
    "INV-032", "INV-033", "INV-034", "INV-037", "lip:part-4", "doc:ROADMAP.md#roadmap",
    "doc:docs/research/raw-factory-prototype-2026-11-12.md#the-switch-made-on-2026-11-12",
    "test:test_uf_motion_can_widen_without_a_receiver_or_a_budget",
    "test:test_uf_motion_onboards_an_erc4626_lending_vault",
    "test:test_uf_refuses_another_modifier_and_an_empty_or_oversized_motion",
