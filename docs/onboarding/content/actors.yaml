- id: universal-factory
  node: easytrack
  name: The universal factory
  status: new
  label: specified
  what: "One new Easy Track factory that builds every Clutch motion. Its Easy Track registration is its address book: the role call of the operator, safety, orders and first-loss modifiers, and its own `commit`. Nothing else is callable (OD-102). Why one factory: fewer moving parts, and one calldata format for monitoring to decode. If its shapes prove too complex, it falls back to raw writes that may also widen, with the objection window as the only bound."
  controlled_by: "Nobody can upgrade it. The committee's Safe is its [[trusted caller]], fixed at deployment. Aragon Voting registers it in Easy Track, and can raise its [[motion counter]] as its owner. A changed factory is a new registration, by vote."
  can:
    - "Widen a permission only through a typed [[shape]]. Each shape pins receivers, owners and beneficiaries to the vault, draws a [[budget key]] and writes the emergency exit."
    - "Narrow a permission with a raw write: a revoke, or a complete list that removes entries. A routine removal is such a write (OD-70)."
    - "Bring back a target that the emergency role revoked as a whole: a restore scopes it again, and the permissions stored under it come back as they were. It writes nothing new (OD-104)."
    - "Derive a new budget key for each new spender, so the policy holds no spare keys."
    - "Keep a [[version]] for each scope that a motion writes. It checks the versions at creation and again at enactment, and the script's last call commits the new versions. Two motions on one scope therefore cannot undo each other (OD-100)."
    - "Change a [[ceiling]]: lower it at any time, or raise it to at most twice its value, at most once in 15 days (OD-105). The motion that introduces a token sets the token's first ceilings (OD-113)."
    - "Onboard Lido Lend in one motion, once its own contract exists, through its shape for a market that is compatible with Morpho Blue. The same motion adds the emergency exit (OD-49)."
    - "Carry the other motions: budgets, a token for the orders account, the restart, the first-loss burn and the insurance funds (OD-103, OD-104, OD-107)."
  cannot:
    - "Grant a delegatecall, except the order signer's on the orders account, or reach an administrative target or function. The governance role's guards stay (OD-36, OD-38)."
    - "Take a condition tree that widens a permission. A raw write only narrows (INV-034)."
    - "Pay from the treasury. Its address book holds no payment call (INV-037)."
    - "Enact a motion if a version that it names, or the [[motion counter]], changed since its creation. The emergency Safe raises the counter at every stop, and every open motion then fails (INV-033)."
    - "Remove a permission at once. An emergency removal is the emergency Safe's revoke (OD-09)."
  numbers: ["one factory for every Clutch motion", "a ceiling's raise: at most twofold, once in 15 days", "the prototype: 12,845 of EIP-170's 24,576 bytes", "external audit in phase 3"]
  sources: ["ADR-013#d3", "ADR-013#d5", "ADR-013#d6", "ADR-013#d7", "ADR-013#d8", "ADR-013#d9", "ADR-013#d10",
    "ADR-013#d11", "ADR-013#d13", "ADR-013#proposed-direction", "ADR-013#consequences", "ADR-007#d41", "ADR-006#d9",
    "ADR-006#d10", "ADR-011#d13", OD-09, OD-36, OD-38, OD-49, OD-70, OD-100, OD-102, OD-103, OD-104, OD-105, OD-107,
    OD-113, "ADR-013#d15",
    INV-029, INV-032, INV-033, INV-034, INV-036, INV-037, "lip:part-4", "doc:ROADMAP.md#roadmap",
    "doc:docs/research/universal-factory-prototype-2026-11-05.md#measures-for-the-choice-between-options-a-and-b",
    "doc:docs/research/universal-factory-prototype-2026-11-05.md#decision-15-built-on-2026-11-06",
    "doc:docs/research/universal-factory-prototype-2026-11-05.md#the-restore-of-a-revoked-target-built-on-2026-11-06", "test:test_uf_restore_brings_back_a_revoked_target"]

