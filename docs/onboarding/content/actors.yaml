# --- Screening ----------------------------------------------------------------------------------
- id: vendor-guard
  node: screening
  name: "[the screening vendor]'s transaction guard"
  status: instance
  label: specified
  what: "A [[guard]] contract on the operator Safe. The Safe consults it before every transaction. It refuses a transaction that the vendor has not approved, once and exactly."
  controlled_by: "The vendor's key approves transactions. Only the operator Safe's owners can remove the guard, through a 10-day timelock."
  can:
    - "Check every operator Safe transaction: each operator action, each order on a rebalancing instance and each new motion."
    - "Fail closed: with no approval, the transaction reverts."
  cannot:
    - "Touch the Asset Safe, the emergency Safe, the Emergency Brakes multisig or the DAO path. Recovery never waits for the vendor."
    - "Act as a module guard. Safe v1.5.0 refuses it as one."
    - "Hold a standing approval under the agreement, except its two built-in timelock approvals. The code allows them, so monitoring alerts on one, and the vendor's written acceptance is still owed."
  numbers: ["removal timelock: 10 days", "bypass timelock: 10 days", "bypass off before the vote"]
  address: "To be deployed"
  sources: [ADR-010, INV-010, "doc:docs/research/safe-v150-guard-compatibility-2026-10-02.md#fork-test-of-the-vendors-guard"]

- id: vendor-service
  node: screening
  name: "[the screening vendor]'s approval service"
  status: existing
  label: existing
  what: "The vendor's off-chain service. It reviews each operator Safe transaction and approves it on chain, once."
  controlled_by: "[the screening vendor]. The committee configures the vault's rules in it, with support from `@lidofinance/defi-tech`."
  can:
    - "Approve or refuse each exact transaction on its own, with no Lido co-signature."
  cannot:
    - "Remove or relax the guard."
    - "Sit on the recovery path."
  sources: [ADR-010, ADR-009]

