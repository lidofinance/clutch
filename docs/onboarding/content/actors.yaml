- id: lido-monitoring
  node: monitoring
  name: Lido on-chain monitoring
  status: mixed
  label: specified
  what: "Lido's existing monitoring platform, with new detectors for the vault. It watches and alerts. It blocks nothing."
  controlled_by: "`@lidofinance/defi-tech` writes the detector specification. `@lidofinance/lido-valset-vroom` reviews it and runs the platform."
  can:
    - "Alert on [[drift]] from the artifact on every modifier, the safety policy included, since motions can write exits there; on approvals and budget burn; on owner, threshold, module, guard and singleton changes of the new Safes and the committee's Safe; and on the orders account's fallback handler, domain verifier and relayer approvals."
    - "Alert on every transfer to the Aragon Agent."
    - "Check each fill against a market price, ask the committee at 30 days to confirm or cancel each open order, and alert on a recovery order whose limit sits far below a market price, on tokens left in the orders account and on late parts of conditional orders."
    - "Alert on any change of the first-loss Safe's balance, owners or modules, page on every burn motion and every action of the first-loss role, and alert on a redemption before the guard is set and on an excess above the launch cap that stays."
    - "Page at high severity on every emergency swap."
    - "Follow a new Lido product's exposure against the protocol cap until a motion unlocks it, and record the changes of the screening rules that the vendor reports."
    - "Run the two detectors of the policy: the chain against the policy that the repository says it holds, and every open motion of the universal factory against the repository's pending motion. Page the emergency Safe on a failure. Alert on a failed enactment, a raise of the motion counter, a restart motion, a budget set to more than twice its last value and few free motion slots. Flag repeated budget motions, and grade emergency actions."
    - "Publish the cap reading of each [[fortnightly snapshot]] to IPFS, and page the emergency Safe on the cap-breach trigger, met in either reading."
    - "Compare Lido's published readings with the policy provider's at each snapshot, and flag a tranche vote that starts while they differ by more than the band."
    - "Alert on a change of the mandate's rules made in the Zodiac UI, and on a transaction of the committee's Safe that waits too long for [the screening vendor]'s approval."
    - "Flag a monthly report that is still missing on day 8."
  cannot:
    - "Block a transaction. If it stops, no permission widens."
  numbers: ["detector specification: phase 1", "vault detectors built: none yet"]
  sources: ["ADR-009#d1", "ADR-009#d7", "ADR-009#d17", "ADR-009#d21", "ADR-009#d24", "ADR-009#d25",
