- id: role-operator
  node: operator-modifier
  name: The operator role
  status: new
  label: built
  role: operator
  what: "The permissions of the operator Safe on the operator modifier. Every receiver, owner and beneficiary is pinned to the Asset Safe, so the operator can change positions but cannot move assets out."
  controlled_by: "Held by the operator Safe. The DAO writes it at the enabling vote. Only motions can widen it later."
  can:
