- id: report-generator
  node: reporting
  name: Report generator
  status: new
  label: specified
  what: "A program in the Clutch repository that builds each report from the chain at a pinned block. Anyone can run it again and get the same result."
  controlled_by: "`@lidofinance/defi-tech` builds it. The committee reviews and publishes each report. Monitoring runs it every fortnight."
  can:
    - "Show balances, positions, exposures, each ratio with its numerator and denominator, and each price with its level, its source and its time (OD-62)."
    - "List every open order with its limit, its age and the idle balance behind it, in each monthly report (OD-61)."
    - "Show the first-loss Safe as a sub-allocation of the vault."
    - "Show the [[TMC-6 ratio]] for the whole treasury in each monthly report, the vault's sUSDS included (OD-111)."
    - "Count a new Lido product in the protocol cap until a motion unlocks it (OD-41)."
    - "Read the mandate's rules from the rule data in this repository, the same rules that the policy provider's reading uses (OD-87)."
  cannot:
    - "Carry an old price over silently. A price older than 24 hours counts as missing."
    - "Anchor a report on chain."
  numbers: ["monthly report: within 7 days after month-end", "incident report: within 72 h", "build: phase 2"]
  sources: ["ADR-009#d19", "ADR-009#d22", "ADR-009#d25", "ADR-009#d28", "ADR-009#d35", "ADR-009#d36", "ADR-009#d47",
