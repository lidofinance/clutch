# --- Screening ----------------------------------------------------------------------------------
- id: vendor-guard
  node: screening
  name: "[the screening vendor]'s transaction guard"
  status: instance
  label: specified
  what: "A [[guard]] contract on the committee's Safe, which consults it before every transaction (OD-83). It refuses a transaction that the vendor has not approved, once and exactly. It is set after the launch. The second tranche's vote lifts the launch cap, and that vote starts only once the guard is set with its bypass mode off (OD-54)."
  controlled_by: "The vendor's key approves transactions. Only the owners of the committee's Safe can remove the guard, through a 10-day timelock."
  can:
    - "Check every transaction of the committee's Safe: each operator action, each order on the orders account, each new motion and the committee's other duties (OD-83)."
    - "Fail closed: with no approval, the transaction reverts."
  cannot:
    - "Touch the Asset Safe, the emergency Safe or the DAO path. Recovery and the switch never wait for the vendor."
    - "Act as a module guard. Safe v1.5.0 refuses it as one."
    - "Hold a standing approval under the agreement, except its two built-in timelock approvals. The code allows them, so monitoring alerts on one, and the vendor's written acceptance is still owed."
