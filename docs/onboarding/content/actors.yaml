  name: Treasury Management Committee and its Safe
  status: existing
  label: existing
  what: "The people who run the [[mandate]], and their existing Safe, which holds the operator role. Once the [[guard]] is set, [the screening vendor] approves every transaction of this Safe first. Until then the [[launch cap]] applies."
  controlled_by: "Seven signers, at 4 of 7. A change of the committee's members needs no Snapshot: monitoring alerts on every change of the Safe's owners or threshold."
  can:
    - "Hold the operator role: change positions in approved protocols, within budgets."
    - "Create every Clutch [[motion]] as the [[trusted caller]] of the [[universal factory]], and cancel its own motions."
