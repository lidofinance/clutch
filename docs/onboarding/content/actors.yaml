# --- Operator Safe ------------------------------------------------------------------------------
- id: operator-safe
  node: operator-safe
  name: Operator Safe
  status: instance
  label: specified
  what: "A new Safe with the committee's signers. It holds no assets and has no modules. From the lift of the launch cap, every transaction that it makes needs [the screening vendor]'s approval first. Until then it has no guard, and the vault stays under a cap of one million dollars (OD-54, OD-55)."
  controlled_by: "The committee's seven signers, at 4 of 7. Safe v1.5.0."
  can:
    - "Hold the operator role: change positions in approved protocols, within budgets."
    - "Create motions as the trusted caller of every Clutch factory, and cancel its own motions."
    - "Hold the operator role on the [[orders account]]: place CoW market, [[limit order|limit]], [[TWAP]] and [[stop-loss order|stop-loss]] orders that pay the Asset Safe."
    - "Remove the screening guard, but only through a fixed 10-day timelock."
  cannot:
    - "Run a transaction without [the screening vendor]'s single-use approval, once the guard is set. The guard [[fail closed|fails closed]]."
    - "Hold assets or modules."
    - "Be replaced without a DAO vote. A new operator Safe also needs every factory deployed and registered again."
  numbers: ["Safe v1.5.0", "4 of 7", "guard removal: 10-day timelock"]
  address: "To be deployed"
  sources: [ADR-005, ADR-010, ADR-006, ADR-007, INV-010, OD-54, "doc:docs/registers/parameters.md#parameters"]

# --- Emergency Safe -----------------------------------------------------------------------------
- id: emergency-safe
  node: emergency-safe
  name: Emergency Safe
  status: instance
  label: specified
  what: "A new Safe with the same seven signers as the committee, at a lower threshold, so that it can act in minutes. It holds no assets, and no guard screens it."
  controlled_by: "The committee's signers, at 2 of 7. Safe v1.5.0."
  can:
    - "Hold the emergency role: revoke the operator, zero approvals, exit positions and send assets to the Aragon Agent."
    - "Make every removal of an operator permission. A forum post follows."
    - "Hold the emergency role on the orders account: cancel any order, send tokens to the Aragon Agent or the Asset Safe, and place [[recovery order|recovery orders]]."
  cannot:
    - "Add a permission or give a non-zero approval."
    - "Enter a protocol, except to stake ETH, or borrow."
    - "Reach the first-loss shares. They sit in the [[first-loss Safe]], which has no module."
    - "Disable a module, or change where recovered assets go."
    - "Fail apart from the operator. The same people sign both Safes."
  numbers: ["Safe v1.5.0", "2 of 7", "initiate within 6 h"]
  address: "To be deployed"
  sources: [ADR-005, ADR-007, ADR-008, OD-42, OD-43, "lip:part-6", "doc:docs/registers/parameters.md#parameters"]

