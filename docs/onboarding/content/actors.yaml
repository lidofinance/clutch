# --- First-loss Safe ----------------------------------------------------------------------------
- id: first-loss-safe
  node: first-loss
  name: First-loss Safe
  status: instance
  label: specified
  what: "A new Safe that holds the DAO's [[first-loss shares]] in earnETH and earnUSD, and the vault's insurance funds. Aragon Voting owns it. One modifier carries the committee's first-loss role and the Easy Track executor's roles. The committee therefore executes the first-loss terms without a DAO vote. A burn, a fund, its money and a payout each wait for a motion's objection window, and an exit pays the Asset Safe."
  controlled_by: "Aragon Voting, at 1 of 1 (OD-73). Safe v1.5.0, with no guard or fallback handler, and one modifier: the first-loss modifier."
  can:
    - "Receive the first-loss shares from the Growth Committee Safe, once, after the enabling vote."
    - "Receive insurance money from the Asset Safe, only by motion (OD-107)."
    - "Burn the shares, but only in an enacted Easy Track motion, through the first-loss burn role (OD-67)."
    - "Redeem the shares with the proceeds pinned to the Asset Safe, through the first-loss role of the committee's Safe (OD-60, OD-108)."
    - "Pay out of a fund with a fixed payout address, only by motion, only to that address and at most the fund's remaining cap."
  cannot:
    - "Be reached by the operator or the emergency role. The no-redeem rule for the operator is structural, not written (OD-42)."
    - "Transfer or approve the first-loss shares. No role can."
    - "Keep a defect apart. One modifier serves the first-loss shares and every insurance fund, so a defect in it reaches all of them."
  numbers: ["Safe v1.5.0", "1 of 1", "one modifier", "no guard or fallback handler"]
  address: "To be deployed"
  sources: ["ADR-008#d13", "ADR-008#d19", "ADR-008#d21", "ADR-008#d22", "ADR-008#d23", "ADR-008#proposed-direction",
