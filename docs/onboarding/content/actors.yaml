    - {name: "Safe proxy factory", address: "0x14F2982D601c9458F93bd70B218933A6f8165e7b"}
    - {name: "MultiSendCallOnly v1.5.0", address: "0xA83c336B20401Af773B6219BA5027174338D1836"}
  sources: [ADR-005, ADR-010, INV-019, "doc:docs/research/safe-v150-due-diligence-2026-10-05.md#summary"]

