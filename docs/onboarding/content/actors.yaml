# --- Easy Track ---------------------------------------------------------------------------------
- id: easy-track
  node: easytrack
  name: Easy Track
  status: existing
  label: existing
  what: "Lido's optimistic governance. A [[motion]] enacts after its [[objection window]] unless LDO holders object. Clutch adds one factory to it, the [[universal factory]], and changes none of its settings."
  controlled_by: "The DAO sets its settings and its factory list. The Emergency Brakes multisig can pause it. Only the DAO can unpause it."
  can:
    - "Run a motion from a registered factory, with the global objection window."
    - "Rebuild the motion's script through the factory at enactment, and require the hash stored at creation. The factory's checks therefore run again at enactment."
    - "Let anyone enact a motion when its window ends without an objection."
    - "Act as the timelock for every structural increase of exposure: a new target or a higher budget waits for the objection window."
  cannot:
    - "Shorten a motion's window."
    - "Put its motions in order. Two motions can both pass their checks at creation, so the universal factory keeps a [[policy version]] for the motions that write permissions or budgets."
    - "Expire a motion. A motion stays open until it enacts or is cancelled, so the [[motion counter]] makes a stale motion fail."
    - "Reach the Aragon Agent."
    - "Hold more than 20 open motions at once. Every committee shares the limit, and a stale motion holds a slot until it is cancelled."
  numbers: ["window: 72 h", "objection: 0.5% of LDO", "window floor: 48 h", "open motions: at most 20, shared"]
  address: "0xF0211b7660680B49De1A7E9f25C65660F0a13Fea"
  sources: ["ADR-006#d1", "ADR-006#d4", "ADR-006#d11", "ADR-006#context", "ADR-013#d2", "ADR-013#d10",
    "ADR-013#context", "ADR-013#consequences", "ADR-013#proposed-direction", "INV-005", "INV-033",
