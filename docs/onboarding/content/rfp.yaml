# The request for solution (RFP) that Lido contributors sent to the policy provider, ask by ask:
# what it asked, how Clutch answers, and what Clutch changed and why. The research note in `note`
# records the asks; the build fails when an ask here is not in that note word for word.
# Verdict: kept (Clutch does what the request asked), changed (Clutch answers differently; `why`
# gives the reason), owed (the design has no answer yet). `added` lists what Clutch adds that the
# request did not ask for.
note: docs/research/request-for-solution-2026-10-07.md
intro: >-
  The RFP asked any other design to keep four properties, and Clutch keeps all four. Below, each card takes one
  part of the RFP.
properties_sources: ["doc:docs/research/request-for-solution-2026-10-07.md#what-to-send-back"]
properties:
  - name: DAO ownership
    how: "Aragon Voting is the only owner of every account that holds assets, and recovered assets go to the Aragon Agent. The Asset Safe owns both of its modifiers, which are proxies of a locked mastercopy."
    sources: ["ADR-008#d19", "ADR-007#d17", "ADR-007#d20", "ADR-005#context", "ADR-005#proposed-direction",
      "INV-001", "INV-021", "INV-023"]
  - name: Default-deny permissions
    how: "Each role reaches only named targets and functions, and every receiver is pinned to the vault. A motion adds a permission as a raw write of the universal factory, which LDO holders can object to for 72 hours. It never grants administration, or a delegatecall other than the order signer's."
    sources: ["ADR-005#proposed-direction", "ADR-006#d9", "ADR-006#d10", "ADR-013#d11", "ADR-013#d8", INV-003, INV-004,
      INV-034]
  - name: Rapid risk reduction
    how: "The emergency Safe revokes, exits and returns assets at once, and no guard sits on its path. It can also switch the operator off. Fork drills must show each action started within six hours."
    sources: ["ADR-006#d7", "ADR-006#d8", "ADR-006#d14", "ADR-005#d25", "ADR-005#context",
      "ADR-005#proposed-direction", "INV-002", "INV-009", "INV-010", "doc:ROADMAP.md#standing-gates"]
  - name: Walk-away operation
    how: "Clutch compiles and checks the policy itself, from the reviewed commit, and the provider's hosted app is out of the path. Removal, recovery and DAO actions are plain on-chain calls with no vendor code on their path."
    sources: ["ADR-004#d11", "ADR-004#d13", OD-33, INV-010]
sections:
  - id: accounts
    title: Accounts
    items:
      - asked: "An Asset Safe holds the assets and the positions. The Aragon Agent is its only owner, and the DAO cannot lose that ownership because a provider service is unavailable."
        verdict: changed
        clutch: "Aragon Voting, not the Aragon Agent, is the Asset Safe's only owner. The Safe has no guard and no fallback handler, so no vendor code is on the DAO's path."
        why: "A vote on the vault then runs without Dual Governance, which protects stETH holders, not the treasury. Aragon Voting already pays from the treasury through Finance, so it gains no new power."
        sources: ["ADR-005#d12", "ADR-005#d14", "ADR-005#d15", "ADR-005#d28", "ADR-005#proposed-direction",
          "INV-001", "INV-010"]
      - asked: "An Operator Safe at 4 of 7 makes routine transactions through a restricted role. It cannot change its own permissions, block their removal, borrow, or use an asset or a function that a motion or the DAO did not approve."
        verdict: kept
        clutch: "The committee's existing Safe, at 4 of 7, holds the operator role. It cannot borrow, administer a modifier or a Safe, or change its own permissions. It moves assets out only into the orders account, or back to the Aragon Agent."
        sources: ["ADR-005#proposed-direction", "ADR-010#d1", "ADR-010#proposed-direction", "ADR-014#d9",
          "INV-002", "ADR-005#d31", "OD-83"]
      - asked: "An Emergency Safe at 3 of 5, which the RFP links to the Emergency Brakes multisig, revokes approvals, exits approved positions and returns assets to the fixed DAO treasury address."
        verdict: changed
        clutch: "A new [[Emergency Safe]] at 3 of 5 holds the emergency role and the [[switch]]: two Emergency Brakes members, two committee members and one member of neither body. The Emergency Brakes multisig itself keeps only the Easy Track pause."
        why: "Financial emergencies need people who watch the portfolio every day, and technical ones need the engineering view. No single body acts alone, and the quorum without the committee returns assets without it."
        sources: ["ADR-005#d2", "ADR-005#d23", "ADR-005#d24", "ADR-005#d25", "ADR-005#proposed-direction",
          "INV-009", "lip:part-2"]
      - asked: "Neither Safe can block the removal of its own authority, and the Operator Safe cannot block a DAO recovery action."
        verdict: kept
        clutch: "The Asset Safe owns both modifiers, so a DAO vote can remove any role. The emergency Safe can switch the operator off, and the operator has no role on the recovery path."
        sources: ["ADR-005#d6", "ADR-005#d25", "ADR-005#proposed-direction", INV-009, INV-010]
    added:
      - text: "Two modifiers on the Asset Safe: the operator modifier for the operator and governance roles, and the safety modifier for the emergency, exit-governance and restart roles."
        why: "Recovery must keep working when the operator is switched off, and no screening may sit in its way."
        sources: ["ADR-005#d6", "ADR-005#context", "ADR-005#proposed-direction"]
      - text: "An orders account, owned by Aragon Voting, places CoW orders for the operator and for recovery."
        why: "Conditional orders need CoW's fallback handler, and the Asset Safe has none."
        sources: ["ADR-007#d17", "lip:part-6"]
      - text: "A [[first-loss Safe]], owned by Aragon Voting, holds the DAO's first-loss Earn shares and the insurance funds."
        why: "The chain cannot tell first-loss shares from other Earn shares, so a separate Safe keeps them apart, and the committee executes the first-loss terms without a DAO vote."
        sources: ["ADR-008#d19", "ADR-008#d21", "ADR-008#d23", "ADR-014#d4", "ADR-014#d10", "INV-021"]
    tech: "The Asset Safe, the emergency Safe and the first-loss Safe run Safe v1.5.0, and the committee's Safe runs Safe v1.3.0 (OD-80). Each modifier is an EIP-1167 minimal proxy of the locked Roles mastercopy, deployed through the Zodiac module proxy factory, with the Asset Safe as its owner, avatar and target."
    sources: ["doc:docs/research/request-for-solution-2026-10-07.md#accounts", "ADR-005#d12", "ADR-005#d13",
      "ADR-005#context", "ADR-005#proposed-direction", "lip:part-1", OD-80]

  - id: governance
    title: Governance and Easy Track
    items:
      - asked: "Easy Track manages the operator allowlist: it adds or removes an asset, a protocol target or a function selector, and changes a parameter constraint inside an allowed function."
        verdict: changed
        clutch: "Motions add and remove through one [[universal factory]], fixed at audit time. A motion is a list of [[raw write|raw writes]]: permissions with their condition trees, budgets, and actions such as a burn. The factory checks no write's content. The policy of each motion role refuses administration, membership and delegatecall, and the [[objection window]] bounds the rest. A motion also adds a token to the orders account."
        why: "A factory that built each permission from typed entries took 32,645 bytes of code against 3,371, and each new kind of protocol needed a changed factory and a vote. EM chose raw writes."
        sources: ["ADR-006#context", "ADR-013#d2", "ADR-013#d5", "ADR-013#d10", "ADR-013#d11",
          "ADR-013#proposed-direction", "ADR-013#options-considered", "ADR-007#d41", "OD-09", "OD-70", "OD-134", "INV-004", "INV-034", "INV-027", "ADR-006#options-considered"]
      - asked: "Lido contributors design, build, audit, deploy and maintain the Easy Track helper contracts. The provider confirms that its access control exposes the administration functions and works safely with this path."
        verdict: kept
        clutch: "The universal Easy Track factory is the only new code. Lido builds it in phase 2, and an external audit covers it in phase 3, with CoW's order signer, which has no known audit. The governance role calls six administration functions of the Roles modifier, each one guarded."
        sources: ["ADR-006#d1", "ADR-013#d5", "ADR-013#consequences", "INV-004", "doc:ROADMAP.md#roadmap",
          "ADR-007#d40"]
      - asked: "The Aragon Agent stays the only owner of the Asset Safe. Easy Track gets no ownership and no unrestricted execution, and it executes only the permission changes that the Operator Safe proposes in motions."
        verdict: changed
        clutch: "Aragon Voting, not the Aragon Agent, owns the Asset Safe. Easy Track never receives authority over the vault's owner or the Agent. The universal factory holds narrow motion roles and uses them only in an enacted motion's one call; Easy Track's executor holds no role. The committee's Safe, as the factory's [[trusted caller]], creates every motion."
        why: "As under Accounts: a vault vote passes no Dual Governance, and Aragon Voting gains no new power."
        sources: ["ADR-005#d28", "ADR-005#proposed-direction", "ADR-005#d31", "ADR-010#d24", "ADR-006#d13",
          "ADR-008#d23", "ADR-013#d12", "ADR-013#proposed-direction", "ADR-010#proposed-direction",
          "INV-004", "INV-035", "ADR-013#d18"]
      - asked: "A direct DAO path can make every change that Easy Track can make."
        verdict: kept
        clutch: "A direct Aragon Voting item can do everything on the owner path: replace the policy, change membership and apply any change without Easy Track. A fork test runs that path."
        sources: ["ADR-005#context", "ADR-005#proposed-direction", "test:test_D2_direct_DAO_path"]
      - asked: "The complete initial configuration is in place before ownership passes to the DAO, so no separate setup-only vote is needed."
        verdict: changed
        clutch: "Ownership never passes. The [[enabling vote]] approves the Safe batches that configure the vault, registers the universal factory and the two top-up factories, so no setup-only vote is needed."
        why: "The Asset Safe is created with Aragon Voting as its only owner, so only the DAO can configure the vault."
        sources: ["ADR-004#d14", "ADR-010#d22", "ADR-010#proposed-direction", "ADR-013#d6", "ADR-014#d14",
          "INV-001", "ADR-005#d32", "doc:script/DeployDryRun.s.sol",
          "doc:docs/specs/enabling-vote.md#the-vote", "OD-73"]
    added:
      - text: "An exit-governance role on the safety modifier: the motion that onboards a protocol also writes the emergency role's exit from it."
        why: "Without it, a protocol that a motion onboards would have no emergency exit until a DAO vote added one."
        sources: ["ADR-006#d13", "INV-025"]
      - text: "A restart role on the safety modifier: after the switch, a motion enables the operator modifier again, and the role can do nothing else."
        why: "No emergency body resumes what it stopped, and after the enabling vote no administrative action needs an Aragon vote."
        sources: ["ADR-013#d3", "ADR-013#d12", "INV-035"]
      - text: "A [[policy version]] for the motions that write permissions or budgets, and a [[motion counter]] that the emergency Safe raises at every stop."
        why: "Motions have no order, so two motions could undo each other's writes. The counter makes every open motion fail at once, so a stale motion cannot undo a revoke."
        sources: ["ADR-013#d2", "ADR-013#d10", "ADR-013#context", "INV-033"]
    tech: "The governance role holds `scopeTarget`, `revokeTarget`, `allowFunction`, `revokeFunction`, `scopeFunction` and `setAllowance` on the operator modifier. The first five pin the role key to `operator` and refuse the Asset Safe and its modules as targets; `allowFunction` and `scopeFunction` allow no delegatecall; `setAllowance` takes only the operator's budget keys."
    sources: ["doc:docs/research/request-for-solution-2026-10-07.md#governance-and-easy-track", "ADR-006#d8",
      "ADR-006#d9", "ADR-006#d10", "ADR-006#proposed-direction", "lip:part-4"]

  - id: paths
    title: Permission-change paths
    items:
      - asked: "Adding or widening a permission and removing one are separate actions. A removal cannot add or widen, and an expansion cannot make an arbitrary call."
        verdict: changed
        clutch: "One kind of motion carries both: a raw write can add, widen or remove, and the factory does not tell them apart. An expansion cannot reach administration, membership or a delegatecall, but it can grant any plain call on an ordinary target. An emergency removal is the emergency role's revoke, which cannot grant anything."
        why: "EM chose raw writes over a factory that checks each write's direction. The objection window and the review of each motion against the policy's source carry what that check carried."
        sources: ["ADR-006#d7", "ADR-006#d8", "ADR-006#d14", "ADR-013#d11", "ADR-013#proposed-direction", "ADR-013#consequences",
          "INV-004", "INV-034", "OD-134"]
      - asked: "An expansion waits through a three-day objection period."
        verdict: kept
        clutch: "Every motion has a 72-hour [[objection window]]: the timelock for every structural increase of exposure, such as a new target or a higher budget."
        sources: ["ADR-006#d11", "ADR-006#context", "ADR-010#d19"]
      - asked: "A standard removal goes through an Easy Track removal motion, with the same three-day objection period."
        verdict: kept
        clutch: "A routine removal is a motion of the universal factory that revokes the permission, or writes it again without the removed entries, with the same objection window."
        sources: ["ADR-006#d14", "ADR-013#d11", "runbook:Remove a strategy", "ADR-006#d7"]
      - asked: "For an urgent risk, the emergency authority blocks or revokes within hours, and a durable change follows later."
        verdict: kept
        clutch: "The emergency Safe revokes the operator's targets and functions at once, posts on the forum afterwards, and can switch the operator off. It also raises the motion counter, so no queued motion undoes the revoke. A revoke is durable: only a motion or a DAO vote grants the permission again."
        sources: ["ADR-006#d7", "ADR-006#d8", "ADR-006#d14", "ADR-005#d25", "ADR-005#d26", "ADR-013#d10",
          "ADR-013#d12", "INV-009", "INV-033", "lip:part-6"]
    sources: ["doc:docs/research/request-for-solution-2026-10-07.md#permission-change-paths", "ADR-013#d11"]

  - id: assets
    title: Assets and permissions
    items:
      - asked: "A launch set of stETH, wstETH, LDO, USDC, USDT, DAI, sDAI, USDS, sUSDS, earnUSD and earnETH, with a note of the assets or actions that need custom policy work."
        verdict: changed
        clutch: "Clutch takes EM's launch list: ETH, WETH, stETH, wstETH, earnETH, earnUSD, USDC, USDT, USDS, sUSDS, CoW Swap access and Lido Lend access. DAI earns through Sky's DAI–USDS converter, and sDAI and LDO are out."
        why: "EM set the list, without LDO. DAI earns through USDS without a swap or a third-party market, so sDAI is not needed. ETH and WETH need staking and wrapping."
        sources: ["ADR-011#d1", "ADR-011#d2", "ADR-011#d7", "ADR-007#d13", "ADR-007#d22", "ADR-007#d27",
          "ADR-011#d15", "INV-015"]
      - asked: "Unapproved actions are denied by default. On-chain rules restrict the target contracts, the functions, the transferred value and the relevant parameters."
        verdict: kept
        clutch: "Each role reaches only named targets and functions, and no target is open as a whole. Every receiver, owner and beneficiary is pinned to the vault, and only the staking and wrapping calls can carry ETH."
        sources: ["ADR-005#proposed-direction", INV-003, "doc:policy/constellation/artifacts/fork-25946643.json"]
      - asked: "Allocation limits per protocol, per yield-asset class and per liquid staking provider other than Lido, where this is technically possible."
        verdict: changed
        clutch: "The caps come from the mandate draft: per protocol or counterparty, per stablecoin, and for yield-bearing assets, each a share of a defined base. The whole vault may sit in Lido products."
        why: "The mandate is the committee's rulebook, and its launch list holds no asset of another liquid staking provider."
        sources: ["ADR-009#d4", "ADR-009#d9", "ADR-011#d1"]
      - asked: "The answer explains which limits hold before execution and which depend on reporting and remediation."
        verdict: kept
        clutch: "No limit reverts on chain, because the policy cannot see value. Before execution, budgets per spender bound how much can move each month, a requested screening rule refuses an operator transaction that breaks a cap, and the Zodiac UI refuses one in its own interface. The rest depends on reporting: a published cap reading every two weeks, and the emergency Safe's switch if a breach is not fixed within two working days and is larger at the next reading."
        sources: ["ADR-009#d1", "ADR-009#d13", "ADR-009#d24", "ADR-009#d25", "ADR-009#d41", "ADR-009#d43",
          "ADR-009#proposed-direction", "OD-39", "doc:docs/specs/control-matrix.md#the-matrix"]
      - asked: "The Operator Safe cannot add a target, a function, an asset or a wider parameter range without the governance process."
        verdict: kept
        clutch: "The operator holds no administration function: only motions and DAO votes write its permissions. A fork test checks that it cannot widen its own scope."
        sources: ["ADR-005#proposed-direction", "INV-004", "test:test_operator_holds_only_the_operator_key"]
      - asked: "The permission detail separates protocol targets, function selectors, asset parameters and other policy parameters."
        verdict: kept
        clutch: "The committed artifact lists every target, function and condition tree of each role, and the budget keys of each modifier. The Actors and Constellation tabs read it."
        sources: ["ADR-004#d13", "doc:policy/constellation/artifacts/fork-25946643.json"]
    tech: "Functions that act only for the calling Safe, such as wrapping, unwrapping and claims, take any arguments. Only stETH's `submit` and WETH's `deposit` can carry ETH."
    sources: ["doc:docs/research/request-for-solution-2026-10-07.md#assets-and-permissions", "ADR-011#d1",
      "doc:policy/constellation/artifacts/fork-25946643.json"]

  - id: emergency
    title: Emergency response
    items:
      - asked: "Liquid positions can be recovered within about six hours."
        verdict: kept
        clutch: "Every emergency action must start within six hours, and fork drills must prove it before launch."
        sources: ["ADR-002#d9", "doc:ROADMAP.md#standing-gates"]
      - asked: "The emergency role revokes token approvals and exits approved positions."
        verdict: kept
        clutch: "The emergency role sets approvals to zero, exits positions to the Asset Safe, unwraps wstETH and WETH, redeems sUSDS and Earn shares, and revokes the operator's targets and functions."
        sources: ["ADR-006#d7", "ADR-006#d8", "ADR-006#d14", "ADR-005#proposed-direction", "OD-49",
          "INV-025"]
      - asked: "Recovered assets go only to the fixed DAO treasury address."
        verdict: changed
        clutch: "Recovered assets go to the Aragon Agent, or to the orders account, whose recovery orders buy USDC or USDT and pay only the Agent. A recovery order lives at most one day."
        why: "The mandate lets the emergency path swap assets into stablecoins, and a swap needs an order. Aragon Voting owns the orders account."
        sources: ["ADR-007#d19", "ADR-007#d25", "ADR-007#proposed-direction", "OD-26", "INV-002", "INV-024"]
      - asked: "The Operator Safe cannot veto an emergency action."
        verdict: kept
        clutch: "Recovery runs through the emergency Safe, which has no guard, and the safety modifier, which carries no operator role. Switching the operator off leaves both working."
        sources: ["ADR-005#d6", "ADR-005#context", "ADR-005#proposed-direction", INV-009, INV-010]
      - asked: "The emergency role cannot add permissions, enter a new protocol, borrow, create leverage or change the recovery destination."
        verdict: kept
        clutch: "It cannot add a permission, borrow, reach the first-loss Safe, change the recovery destination, disable any module but the operator modifier, or restore what it stopped. The only protocol that it enters is Lido's staking, because recovery stakes ETH before it sells."
        sources: ["ADR-005#d25", "ADR-005#d26", "ADR-005#proposed-direction", "ADR-007#d13", "ADR-007#proposed-direction",
          INV-002, INV-027]
      - asked: "In an incident, new operator transactions stop first. The emergency signers check the event, revoke approvals, exit positions or start queued withdrawals, and return what is liquid to the treasury. The DAO disables a role or a module if needed, and an incident report follows."
        verdict: kept
        clutch: "The emergency Safe switches the operator off, revokes, exits and returns assets, redeems Earn shares through their queues, and sells stETH by a recovery order or sends it to the Agent. A DAO vote can disable anything, and the committee publishes an incident report within 72 hours."
        sources: ["ADR-006#d7", "ADR-006#d8", "ADR-006#d14", "ADR-005#d25", "ADR-005#proposed-direction",
          "ADR-009#d19", "INV-009", "runbook:Return assets to the Agent", "runbook:Switch the operator off"]
    tech: "The vault does not use Lido's withdrawal queue (ADR 007, decision 27): stETH leaves by a recovery order or by a transfer to the Agent. Earn shares leave through their redeem queues, and the role can cancel open deposit requests."
    sources: ["doc:docs/research/request-for-solution-2026-10-07.md#emergency-response", "ADR-005#proposed-direction",
      "ADR-007#d27", "lip:part-6", "doc:policy/constellation/artifacts/fork-25946643.json"]

  - id: monitoring
    title: Monitoring and transaction blocking
    items:
      - asked: "Monitoring covers transactions, assets, protocols and permission changes."
        verdict: kept
        clutch: "Lido's on-chain monitoring carries policy [[drift]] against the committed artifact, the approval inventory, budget burn, module, owner and singleton changes on the new Safes, transfers to the Aragon Agent, and every motion of the universal factory, decoded from one format. A motion that onboards a protocol needs monitoring of it before enactment."
        sources: ["ADR-009#proposed-direction", "ADR-013#proposed-direction", "ADR-014#d9", "lip:part-4"]
      - asked: "Alerts reach the operator, the emergency signers and DAO operations, with the supported signals and the expected alert times."
        verdict: owed
        clutch: "The detector specification lists each detector with what it watches, its severity and where it runs. It is owed in phase 1, and it sets no alert time yet."
        sources: ["ADR-009#d8", "ADR-009#d17", "ADR-009#proposed-direction"]
      - asked: "Each operator transaction is simulated and checked before execution, and the answer names the service that checks it."
        verdict: changed
        clutch: "Once the [[guard]] is set, the screening vendor checks each transaction of the committee's Safe before it runs, new motions included, and the guard refuses any that the vendor did not approve on chain, once. Until the [[launch cap]] lifts, the vault runs without the guard. The repository does not record whether the vendor simulates each transaction. From the launch, the Zodiac UI's signing flow refuses an operator transaction that would breach a cap, in its own interface only, and from the lift it requests the vendor's approval for each transaction it builds."
        why: "EM allowed a launch without the guard under this cap, so the vendor is not on the launch's critical path. Above the cap, blocking before execution stays a hard requirement."
        sources: ["ADR-010#d1", "ADR-010#d4", "ADR-010#d9", "ADR-010#d20", "ADR-010#d21", "ADR-010#d22",
          "ADR-010#proposed-direction", "ADR-010#d25", "ADR-009#d43", "OD-01", "INV-010", "lip:part-9"]
      - asked: "The answer explains what happens when the monitoring or blocking service is unavailable. On-chain permissions stay the final enforcement layer, and losing monitoring never widens them."
        verdict: kept
        clutch: "The guard [[fail closed|fails closed]]: the operator, new motions and the committee's other duties on its Safe stop, and recovery is unaffected. The owners can remove the guard after ten days. If monitoring stops, the permissions on chain still hold and do not widen."
        sources: ["ADR-010#d4", "ADR-010#d10", "ADR-010#proposed-direction",
          "doc:docs/specs/threat-model.md#failure-modes", "OD-83"]
    tech: "The guard is set on the committee's Safe with `setGuard`, and its bypass mode stays off. The vendor's key approves each transaction hash once, and the guard holds no standing approval except its two built-in timelock approvals."
    sources: ["doc:docs/research/request-for-solution-2026-10-07.md#monitoring-and-transaction-blocking", "ADR-009#d7",
      "ADR-010#d9", "ADR-010#d10", "ADR-010#proposed-direction", OD-83]

  - id: nav
    title: Net asset value
    items:
      - asked: "The NAV shows the total in USD, the valuation time and the freshness of the data, by asset, protocol, strategy and position. The answer says whether NAV is the provider's product, a partner's or custom work."
        verdict: changed
        clutch: "Two readings. Lido's report generator reads the vault at a pinned block, with each price's source and timestamp. The policy provider makes its own in the Zodiac UI, with the same rules, and shows the value per account, asset and protocol. Neither reads the other's data, both go to IPFS, and both count: a breach in either triggers the [[switch]], and no top-up motion starts while they differ by more than a band."
        why: "Two independent readings check each other, and anyone can re-run Lido's at a pinned block."
        sources: ["ADR-009#d19", "ADR-009#d40", "ADR-009#d41", "ADR-009#d42", "ADR-009#d44",
          "ADR-009#proposed-direction", "ADR-009#d35", "ADR-009#d36", "ADR-014#proposed-direction"]
      - asked: "The launch design permits no debt, but the NAV still detects and shows any unexpected liability."
        verdict: owed
        clutch: "No role can borrow, so the design has no source of debt. The report and the Zodiac UI's requirement list do not name a liability line yet."
        sources: ["ADR-009#proposed-direction", "doc:docs/specs/control-matrix.md#the-matrix"]
    sources: ["doc:docs/research/request-for-solution-2026-10-07.md#net-asset-value", "ADR-009#d19", "ADR-009#d40"]

  - id: independence
    title: Provider independence
    items:
      - asked: "The on-chain system keeps working without the provider's hosted app, API, extension, indexer, relayer or cloud service."
        verdict: kept
        clutch: "Clutch's own offline compiler builds every policy change from the reviewed commit, and the hosted app is out of the path. The modifiers are proxies of a locked mastercopy that the Asset Safe owns. Swaps need CoW's off-chain services, but the emergency role can always send assets to the Agent."
        sources: ["ADR-004#d11", "ADR-004#d13", OD-33, "ADR-005#context", "ADR-005#proposed-direction", "ADR-007#d19"]
      - asked: "An authorized account can send a valid transaction through another Safe-compatible frontend, or as raw transaction data."
        verdict: kept
        clutch: "Every account is a standard Safe, and a role acts through a plain call to its modifier, `execTransactionWithRole`. The fork tests make these calls with no frontend at all."
        sources: ["ADR-005#proposed-direction", "doc:test/Drills.t.sol"]
      - asked: "Permission removal, module disablement, emergency recovery and DAO ownership actions stay available through an outage, a suspension, a billing dispute or a contract termination."
        verdict: kept
        clutch: "All of them are on-chain calls by the emergency Safe or the DAO, and no vendor code is on their path."
        sources: ["ADR-006#d7", "ADR-006#d8", "ADR-006#d14", "ADR-005#d25", "ADR-005#proposed-direction",
          "INV-010", "doc:docs/specs/lip-draft.md#problem"]
    tech: "The repository-owner team holds the Zodiac workspace and its API key. CI and agents never push, and the key never enters the repository, CI or a vote."
    sources: ["doc:docs/research/request-for-solution-2026-10-07.md#provider-independence", "ADR-004#d16", OD-35]

  - id: beyond
    title: What the RFP did not cover
    items: []
    added:
      - text: "Funding: a [[top-up motion]], within a limit for each three months. The launch tranche, one million dollars, is the first top-up."
        why: "The committee expects regular top-ups, so a vote for each would cost too much. The top-up factories are Lido's existing code in new instances."
        sources: ["ADR-014#d13", "ADR-014#d14", "ADR-014#d15", "INV-037"]
      - text: "Insurance: funds for earnETH, earnUSD and Lido Lend, built in at launch. Their money comes from the Asset Safe by motion, and every burn and payout is a motion."
        why: "EM wants insurance for Lido Earn and Lido Lend ready at launch, and LDO holders can object to each flow of its money."
        sources: ["ADR-014#d4", "ADR-014#d5", "ADR-014#d6", "ADR-014#d7", "ADR-008#d26", "INV-039"]
      - text: "Returns: funds go back to the Aragon Agent only in an emergency or a recovery. The committee's Safe may also send any vault token to the Agent, with no motion and no vote."
        why: "A return to the treasury loses nothing; at worst the vault stops working. Redemption and fund-exit proceeds stay in the vault."
        sources: ["ADR-014#d8", "ADR-014#d9", "ADR-014#d10", "ADR-014#consequences", "INV-038"]
      - text: "Budgets: each approval to a protocol spender spends that spender's [[budget key]], which refills no more often than every 30 days. A motion sets a budget, and the objection window bounds its size."
        why: "A spender can pull an approval without any deposit, so the approval is what must be bounded."
        sources: ["ADR-009#d13", "ADR-009#d15", "ADR-013#d11", "INV-008", "INV-012"]
      - text: "Reports: a monthly report that anyone can re-run at a pinned block, and a cap reading every two weeks on IPFS, Lido's next to the policy provider's own."
        why: "Tokenholders hold the committee to the mandate through its reports."
        sources: ["ADR-009#d19", "ADR-009#d24", "ADR-009#d25", "ADR-009#d34", "ADR-009#d40", "ADR-009#d41",
          "ADR-009#d42"]
      - text: "A [[control matrix]] that gives every rule of the mandate a control on each layer that can carry it, with an owner."
        why: "Much of the mandate cannot be enforced on chain."
        sources: ["ADR-009#d26", "doc:docs/specs/control-matrix.md#the-matrix"]
    sources: ["ADR-014#d13", "ADR-009#d13", "ADR-009#d19", "ADR-009#d26"]
