  to: operator-modifier
  kind: owns
  short: owns
  label: The Asset Safe owns the operator modifier and enables it as a module. A permitted call runs as the Asset Safe.
  label_at:
  - 458
  - 435
- id: own-sf
  from: asset-safe
  to: safety-modifier
  kind: owns
  short: owns
  label: The Asset Safe owns the safety modifier and enables it as a module. A permitted call runs as the Asset Safe.
  label_at:
  - 722
  - 435
- id: op-role
  from: committee
  to: operator-modifier
