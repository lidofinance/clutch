# The system map. Coordinates are in the SVG viewBox. Domains: gov, ops, vault, ext.
# Kinds: body, multisig, contract, service, external.
# Statuses: existing, instance (new instance of existing code), new (new code), mixed.
width: 1180
height: 750
description: The Lido DAO owns the Asset Safe; it also owns the orders account and the first-loss Safe, which the map
  shows without an arrow. The Asset Safe owns two Roles modifiers. The operator Safe holds the operator role and Easy Track holds the governance role on the operator modifier.
  The emergency Safe holds the emergency role and the Emergency Brakes multisig holds the technical role on the safety
  modifier. Easy Track also holds the exit-governance role there, and every role acts on the orders account through its
  own two modifiers; the map draws no arrow for these. The screening guard approves each operator Safe transaction. The Asset Safe uses approved protocols and swaps
  through CoW orders from the orders account. The first-loss Safe holds the DAO's first-loss Earn shares. Monitoring
  watches the vault and pages the Emergency Brakes multisig. Reporting publishes from the vault's snapshots.
nodes:
- id: committee
  label: Committee
  sub: Treasury Management · 4 of 7
  summary: The people who run the mandate. The same signers sign the operator Safe and the emergency Safe.
  domain: ops
  kind: multisig
  status: existing
  x: 40
  y: 44
  w: 240
  h: 84
- id: dao
  label: Lido DAO
  sub: LDO vote · Aragon Agent
  summary: The final authority. The Aragon Agent is the only owner of the Asset Safe.
  domain: gov
  kind: body
  status: existing
  x: 430
  y: 44
  w: 320
  h: 84
- id: funding
  label: Funding path
  sub: Finance · registries · factories
  summary: Moves money from the DAO treasury to the Asset Safe through Easy Track top-up motions, within monthly limits.
  domain: gov
  kind: contract
  status: mixed
  x: 860
  y: 44
  w: 280
  h: 84
- id: easytrack
  label: Easy Track
  sub: motions · 72 h objection
  summary: Lido's optimistic governance. A motion enacts unless LDO holders object within 72 hours. It holds the governance
    role.
  domain: gov
  kind: contract
  status: mixed
  x: 40
  y: 192
  w: 240
  h: 84
- id: operator-safe
  label: Operator Safe
  sub: 4 of 7 · screened
  summary: Holds the operator role. Each of its transactions needs the screening vendor's approval first.
  domain: ops
  kind: multisig
  status: instance
  x: 330
  y: 192
  w: 240
  h: 84
- id: emergency-safe
  label: Emergency Safe
  sub: 2 of 7 · same signers
  summary: 'Holds the emergency role. It can only reduce exposure: revoke, exit, sell into stablecoins and send assets home.'
  domain: ops
  kind: multisig
  status: instance
  x: 610
  y: 192
  w: 240
  h: 84
- id: brakes
  label: Emergency Brakes
  sub: independent stop · 3 of 5
  summary: Independent of the committee. It holds the technical role and the Easy Track pause.
  domain: ops
  kind: multisig
  status: existing
  x: 900
  y: 192
  w: 240
  h: 84
- id: screening
  label: Screening guard
  sub: '[the screening vendor]'
  summary: A transaction guard on the operator Safe. It refuses any transaction that the vendor has not approved once.
  domain: ext
  kind: service
  status: instance
  x: 40
  y: 334
  w: 240
  h: 84
- id: operator-modifier
  label: Operator modifier
  sub: 'operator, governance'
  summary: A Zodiac Roles modifier. It lets the operator do only what the policy lists, within budgets.
  domain: vault
  kind: contract
  status: instance
  x: 330
  y: 334
  w: 240
  h: 84
- id: safety-modifier
  label: Safety modifier
  sub: 'emergency, technical, exits'
  summary: A second Roles modifier for the emergency and technical roles. Nothing screens it, so recovery never waits on a
    vendor. Its exit-governance role, which is specified, lets the motion that onboards a protocol add its emergency exit
    here.
  domain: vault
  kind: contract
  status: instance
  x: 610
  y: 334
  w: 240
  h: 84
- id: policy
  label: Policy pipeline
  sub: constellation → artifact
  summary: The permission policy as a Zodiac constellation, compiled by Clutch's own compiler into a committed artifact that
    votes and tests use.
  domain: ext
  kind: service
  status: mixed
  x: 900
  y: 334
  w: 240
  h: 84
- id: asset-safe
  label: Asset Safe
  sub: holds the assets · Agent owns it
  summary: The vault. A Safe that holds the assets. Only the Aragon Agent owns it; the roles act through the two modifiers.
  domain: vault
  kind: contract
  status: instance
  x: 430
  y: 486
  w: 320
  h: 88
- id: first-loss
  label: First-loss Safe
  sub: no modules · Agent owns it
  summary: A Safe that the Aragon Agent owns, with no modules. It holds only the DAO's first-loss Earn shares, so no role
    can reach them. Only a DAO vote can burn or redeem them.
  domain: vault
  kind: contract
  status: instance
  x: 60
  y: 470
  w: 240
  h: 84
- id: protocols
  label: Approved protocols
  sub: Lido staking · Lido Earn · Sky
  summary: 'Where the vault puts assets to work: stETH and wstETH, the withdrawal queue, earnETH and earnUSD, and Sky''s sUSDS
    and converter.'
  domain: ext
  kind: external
  status: existing
  x: 40
  y: 646
  w: 280
  h: 84
- id: orders
  label: Orders account
  sub: CoW orders · Agent owns it
  summary: 'A Safe that the Aragon Agent owns, with its own two modifiers. The roles place CoW orders from it: the operator''s
    orders pay the Asset Safe, and recovery orders pay the Aragon Agent.'
  domain: vault
  kind: contract
  status: mixed
  x: 370
  y: 646
  w: 260
  h: 84
- id: monitoring
  label: Monitoring
  sub: two estates · alerts
  summary: Watches the vault, the liquidity buffer, the orders, the motions and the Safes, and pages the right body when
    something is wrong.
  domain: ext
  kind: service
  status: mixed
  x: 680
  y: 646
  w: 220
  h: 84
- id: reporting
  label: Reporting
  sub: IPFS · forum
  summary: Monthly reports and fortnightly cap readings, published on IPFS and cited on the forum. Each report shows the
    caps and the liquidity buffer; no contract checks them.
  domain: ext
  kind: service
  status: mixed
  x: 940
  y: 646
  w: 200
  h: 84
