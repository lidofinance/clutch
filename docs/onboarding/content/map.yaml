  to: protocols
  kind: owns
  short: Earn shares · insurance
  label: The first-loss Safe holds the DAO's first-loss shares in earnETH and earnUSD, and the positions of the insurance
    funds. Only an enacted motion burns or pays out, and only the committee's narrow role redeems, to the Asset Safe.
- id: insure
  from: asset-safe
  to: first-loss
  kind: governs
  short: insurance
  label: A motion moves insurance money from the Asset Safe to the first-loss Safe, pinned to it.
- id: treasury
  from: dao
  to: funding
  kind: governs
  short: votes
  label: A top-up is an Easy Track motion. It pays through Aragon Finance, from the treasury that the Aragon
