  - 388
  - 141
- id: signers-em
  from: committee
  to: emergency-safe
  kind: signers
  short: two seats
  label: Two of the committee's signers sit on the emergency Safe. The committee cannot act alone there.
  via:
  - - 450
    - 170
  - - 730
    - 170
  label_at:
  - 660
  - 164
- id: screen
  from: screening
  to: committee
  kind: screens
  short: approves each transaction
  label: Once it is set, before a funding above the launch cap, the vendor's guard on the committee's Safe refuses a transaction that the vendor has not approved, once and exactly.
  label_at:
  - 170
  - 330
- id: revoke
  from: safety-modifier
  to: operator-modifier
  kind: safety
  short: revoke · disable
  label: The emergency role can revoke the operator's permissions, and its switch can disable the operator modifier.
  label_at:
  - 590
  - 328
- id: positions
  from: asset-safe
  to: protocols
  kind: owns
  short: positions
  label: The Asset Safe deposits, stakes, converts and redeems in the approved protocols. Receivers are pinned to the Asset
    Safe.
- id: swaps
  from: asset-safe
  to: orders
  kind: owns
  short: swaps
  label: To swap, a role sends a token to the orders account and places a CoW order there. The operator's transfers
    spend its orders budgets. The operator's orders pay the Asset Safe; recovery orders pay the Aragon Agent.
  both: true
- id: first-loss-shares
