# The system map. Coordinates are in the SVG viewBox. Domains: gov, ops, vault, ext.
# Kinds: body, multisig, contract, service, external.
# Statuses: existing, instance (new instance of existing code), new (new code), mixed.
width: 1180
height: 750
description: The Lido DAO owns the Asset Safe; it also owns the orders account and the first-loss Safe, which the map
  shows without an arrow. The Asset Safe owns two Roles modifiers. The committee's Safe holds the operator role, and the
  universal factory the governance role, on the operator modifier. The emergency Safe holds the emergency role on the safety modifier, the switch included. Two of
  its five signers come from the committee and two from the Emergency Brakes multisig, which can pause Easy Track. One
  universal factory builds every Clutch motion and holds every role that a motion uses, on all four modifiers. The map
  draws no arrow for the factory's other roles, for the roles on the orders account's modifier, or for the committee's
  first-loss role. Funding comes through Finance to the Asset Safe, by a top-up motion or by an Aragon vote. Once the
  screening guard is set, it approves each transaction of the committee's Safe. The Asset Safe uses approved protocols,
  swaps through CoW orders from the orders account, and pays insurance money to the first-loss Safe by motion.
  Monitoring watches the vault and pages the emergency Safe. Reporting publishes from the vault's snapshots.
nodes:
- id: committee
  label: Committee Safe
  sub: Treasury Management · 4 of 7
  summary: The committee's existing Safe. It holds the operator role and is the universal factory's trusted caller. Two
    of its signers sit on the emergency Safe.
  domain: ops
  kind: multisig
  status: existing
  x: 330
  y: 192
  w: 240
  h: 84
- id: dao
  label: Lido DAO
  sub: LDO vote · Voting owns the vault
  summary: The final authority. Aragon Voting is the only owner of the Asset Safe, and it alone changes a top-up
    registry's limit. The Aragon Agent, the treasury, gets funds back only in an emergency or a recovery.
  domain: gov
  kind: body
  status: existing
  x: 430
  y: 44
  w: 320
  h: 84
- id: funding
  label: Funding path
  sub: Finance · top-ups
  summary: Moves money from the DAO treasury to the Asset Safe. A top-up motion of the committee's Safe pays it
    through Aragon Finance, within a limit for each three months.
  domain: gov
  kind: contract
  status: existing
  x: 860
  y: 44
  w: 280
  h: 84
- id: easytrack
  label: Easy Track
  sub: universal factory · 72 h
  summary: Lido's optimistic governance. A motion enacts unless LDO holders object within 72 hours. One universal factory
    builds every Clutch motion and holds the roles that motions use.
  domain: gov
  kind: contract
  status: mixed
  x: 40
  y: 192
  w: 240
  h: 84
- id: emergency-safe
  label: Emergency Safe
  sub: 3 of 5 · two bodies and one
  summary: 'Holds the emergency role and the switch. Two committee members, two Emergency Brakes members and one member of
    neither body sign it, so the committee cannot use it alone. It can only reduce exposure: revoke, switch off, exit, sell
    into stablecoins and send assets home.'
  domain: ops
  kind: multisig
  status: instance
  x: 610
  y: 192
  w: 240
  h: 84
- id: screening
  label: Screening guard
  sub: '[the screening vendor]'
  summary: A transaction guard on the committee's Safe. It refuses any transaction that the vendor has not approved once. It is set after the launch, before a funding above the launch cap.
  domain: ext
  kind: service
  status: instance
  x: 40
  y: 334
  w: 240
  h: 84
- id: operator-modifier
  label: Operator modifier
  sub: 'operator, governance'
  summary: A Zodiac Roles modifier. It lets the operator do only what the policy lists, within budgets. It also carries
    the governance and insurance-funding roles that motions use.
  domain: vault
  kind: contract
  status: instance
  x: 330
  y: 334
  w: 240
  h: 84
- id: safety-modifier
  label: Safety modifier
  sub: 'emergency, exits, restart'
  summary: A second Roles modifier for the emergency role, the switch included. Nothing screens it, so recovery never waits
    on a vendor. Its exit-governance role lets the motion that onboards a protocol, or adds a token to the order lists, add
    its emergency exit here. Its restart role lets a motion enable the operator modifier again after the switch.
  domain: vault
  kind: contract
  status: instance
  x: 610
  y: 334
  w: 240
  h: 84
- id: policy
  label: Policy pipeline
  sub: constellation → artifact
  summary: The permission policy as a Zodiac constellation, compiled by Clutch's own compiler into a committed artifact that
    votes and tests use.
  domain: ext
  kind: service
  status: mixed
  x: 900
  y: 334
  w: 240
  h: 84
- id: asset-safe
  label: Asset Safe
  sub: holds the assets · Voting owns it
  summary: The vault. A Safe that holds the assets. Only Aragon Voting owns it; the roles act through the two modifiers.
  domain: vault
  kind: contract
  status: instance
  x: 430
  y: 486
  w: 320
  h: 88
- id: first-loss
  label: First-loss Safe
  sub: insurance · Voting owns it
  summary: A Safe that Aragon Voting owns. It holds the DAO's first-loss Earn shares and the vault's insurance funds.
    Motions burn, fund and pay out. On the Earn team's written instruction, a role of the committee's Safe redeems the
    shares to the Asset Safe.
  domain: vault
  kind: contract
  status: instance
  x: 60
  y: 470
  w: 240
  h: 84
- id: protocols
  label: Approved protocols
  sub: Lido staking · Lido Earn · Sky
  summary: 'Where the vault puts assets to work: stETH and wstETH, earnETH and earnUSD, and Sky''s sUSDS and converter.'
  domain: ext
  kind: external
  status: existing
  x: 40
  y: 646
  w: 280
  h: 84
- id: orders
  label: Orders account
  sub: CoW orders · Voting owns it
  summary: 'A Safe that Aragon Voting owns, with one modifier of its own. The roles place CoW orders from it: the operator''s
    orders pay the Asset Safe, and recovery orders pay the Aragon Agent. A motion adds a token to its lists.'
  domain: vault
  kind: contract
  status: mixed
  x: 370
  y: 646
  w: 260
  h: 84
- id: monitoring
  label: Monitoring
  sub: two estates · alerts
  summary: Watches the vault, the orders, every motion, every transfer to the Aragon Agent and the Safes, and pages the
    right body when something is wrong.
  domain: ext
  kind: service
  status: mixed
  x: 680
  y: 646
  w: 220
  h: 84
- id: reporting
  label: Reporting
  sub: IPFS · forum
  summary: Monthly reports and fortnightly cap readings, published on IPFS and cited on the forum. Each report shows the
    caps, and each monthly report shows the TMC-6 ratio for the whole treasury; no contract checks them.
  domain: ext
  kind: service
  status: mixed
  x: 940
  y: 646
  w: 200
  h: 84
