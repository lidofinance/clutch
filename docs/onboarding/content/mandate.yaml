# The Treasury Management mandate, block by block: what the draft says, how Clutch keeps each
# rule, and what Clutch changed and why. Only what the repository already records about the draft;
# the draft itself is restricted, and no figure from it enters this page.
# Change state: owed (EM decided; the mandate's Snapshot text owes the change), forum (the mandate's
# forum post carries it, OD-90), design (Clutch's design choice; no text change is needed),
# proposed (agent-drafted, not yet decided).
intro: >-
  LDO holders approve the mandate in a Snapshot vote. Its draft is not public yet, so this tab paraphrases only what
  the repository records about it, and shows no figure from it.
blocks:
  - id: custody
    title: Purpose and custody
    says: "The committee puts a bounded part of the DAO treasury to work in approved protocols. The DAO keeps the assets, and no committee or service provider can take them."
    kept:
      - "On chain: Aragon Voting is the only owner of the Asset Safe, the orders account and the first-loss Safe, and recovered assets go to the Aragon Agent."
      - "On chain: every receiver, owner and beneficiary in the operator's permissions is the vault."
      - "Detection: alerts on any change of the owners, modules or singleton of every new Safe."
    tech: "INV-001, INV-021 and INV-023 fix the owners; INV-003 and INV-022 fix the receivers."
    changes:
      - text: "The custody section names Aragon Voting as the owner of the vault's Safes, and the Aragon Agent as the destination of recovered assets. It says that no vault action passes Dual Governance."
        why: "A vote on the vault then runs without Dual Governance, which protects stETH holders, not the treasury. Aragon Voting already pays from the treasury through Finance, so it gains no new power."
        state: owed
        sources: ["ADR-005#d28", OD-73, OD-90]
    sources: ["ADR-005#d19", "ADR-005#d20", "ADR-005#d28", "ADR-005#proposed-direction", OD-73, INV-001, INV-003,
      "doc:docs/product/brief.md#the-system", "doc:docs/specs/lip-draft.md#simple-summary",
      "doc:docs/specs/control-matrix.md#the-matrix"]

  - id: assets
    title: Assets and venues
    says: "A launch list of assets and venues: ETH, WETH, stETH, wstETH, earnETH, earnUSD, USDC, USDT, USDS, sUSDS, CoW Swap access and Lido Lend access. It names four main stablecoins: USDC, USDT, USDS and DAI."
    kept:
      - "On chain: default deny. A new target needs a template motion with a 72-hour objection window, or a DAO vote."
      - "Before execution: the screening vendor checks every operator transaction and every new motion, once the launch cap lifts (OD-54)."
      - "Detection: drift of the chain from the committed policy."
    tech: "INV-004 and INV-005 bound what a motion can add. INV-015 keeps the operator inside the launch scope."
    changes:
      - text: "DAI joins the launch list, so the vault holds all four main stablecoins. DAI earns through Sky's DAI–USDS converter, one to one, and not through swaps."
        why: "The mandate's four main stablecoins include DAI, and converting is cheaper than swapping."
        state: design
        sources: ["ADR-011#d2", "ADR-011#d7", OD-22]
      - text: "Lido Lend joins by one motion after launch. It is a separate deployment that is compatible with Morpho Blue, and the same motion adds its emergency exit."
        why: "Lido Lend does not exist yet, so its address cannot be in the enabling vote."
        state: design
        sources: ["ADR-011#d3", "ADR-011#d13", OD-49]
      - text: "The asset list names ETH, WETH and Sky's DAI–USDS converter."
        why: "The vault stakes ETH, trades WETH in CoW orders and earns on DAI through the converter, so the list must name what the launch uses."
        state: owed
        sources: ["ADR-011#d7", "ADR-011#d12", "ADR-011#d14", OD-90]
      - text: "LDO leaves the launch list, the operator's order lists and the recovery sell list."
        why: "LDO is not a funding asset, so it would enter the vault only through a buy order or a DAO vote, and a buy order reads as an LDO buyback. EM removed it on 2026-10-22."
        state: design
        sources: [OD-91, "ADR-011#d15", "ADR-011#d1", "ADR-007#d22"]
    sources: ["ADR-011#d1", "ADR-011#d2", "ADR-011#d15", "ADR-006#d2", "ADR-006#d3", "ADR-006#d11", "ADR-006#context", INV-004,
      INV-015, "lip:part-8", "doc:docs/specs/control-matrix.md#the-matrix", OD-54]

  - id: caps
    title: Exposure caps
    says: "Caps on exposure, each a share of a defined base: per protocol or counterparty, per stablecoin, and for yield-bearing assets. The whole vault may sit in Lido's own products."
    kept:
      - "On chain: none. The policy cannot see value; budgets per protocol spender bound how much can move each month."
      - "Before execution: the Zodiac UI refuses an operator transaction that breaches a cap, in its interface only; a screening rule is requested for the same refusal."
      - "Detection: monitoring publishes the cap reading of each fortnightly snapshot. If a breach is not fixed within two working days and is larger at the next reading, the emergency Safe switches the operator off. A breach in either reading, Lido's or the policy provider's, counts."
      - "Display: each cap against its limit, in the Zodiac UI."
    tech: "Budget keys count token units and refill no more often than every 30 days. Caps are ratios, so budgets drift with price. There is no routine retune: a budget motion follows an event (OD-56)."
    changes:
      - text: "Exposure to mature Lido products is unbounded. A new Lido product, Lido Lend first, stays in the protocol cap until it meets the maturity criteria and a budget motion with a forum post unlocks it. earnETH and earnUSD are not new."
        why: "The mandate backs Lido's own products without a cap. The maturity step keeps a product without a track record from taking the whole vault on its first day."
        state: owed
        sources: ["ADR-009#d28", OD-41, OD-90]
      - text: "The illustrative balance renames its \"USD-denominated\" heading."
        why: "The heading read like the base of the yield-bearing cap, which it is not."
        state: owed
        sources: ["ADR-009#d10", OD-03]
      - text: "The mandate says that caps are kept by measurement, publication and remediation, not by reverting a transaction."
        why: "The permission layer cannot see value, so no contract reverts on a cap."
        state: proposed
        sources: ["ADR-009#d1", "ADR-009#proposed-direction", "lip:part-9"]
    sources: ["ADR-009#d4", "ADR-009#d9", "ADR-009#d13", "ADR-009#d15", "ADR-009#d24", "ADR-009#d25", "ADR-009#d29", "ADR-009#d41", "ADR-009#d43", OD-84, OD-86,
      "ADR-009#d31", "ADR-009#d34", "ADR-009#proposed-direction", "ADR-011#d10", OD-29, OD-32, OD-58,
      "doc:docs/specs/control-matrix.md#the-matrix", OD-56]

  - id: buffer
    title: Liquidity buffer
    says: "A stablecoin buffer of one month of baseline spend."
    kept:
      - "On chain: none."
      - "Before execution: the Zodiac UI refuses an operator transaction that takes the buffer below its floor, in its interface only; a screening rule is requested for the same refusal."
      - "Detection: a continuous detector with an early warning, and a line in every report."
      - "Display: the buffer against its floor, in the Zodiac UI."
    tech: "The buffer counts the stablecoins that the Asset Safe holds directly, and sUSDS. Its figure comes from the attested computation."
    changes:
      - text: "The forum post states the buffer's controls: the detector, the report line, screening where the vendor can check it, the display, and the committee's window to restore it. The Snapshot text keeps the rule."
        why: "Nothing on chain can hold a buffer, so monitoring, reports, screening and the display must keep it. The control matrix carries that detail, and the forum post carries the control matrix."
        state: forum
        sources: ["ADR-009#d27", OD-40, OD-90]
    sources: ["ADR-009#d27", "ADR-009#d29", "ADR-009#d43", "ADR-009#proposed-direction", OD-40, OD-86, "runbook:Restore the liquidity buffer"]

  - id: funding
    title: Funding and top-ups
    says: "The vault holds up to the mandate size in assets. Each funding counts in US dollars at its value when it is funded, and the legacy positions count too. The vault never holds more than a set share of the DAO's non-LDO treasury. More funding needs a separate DAO approval, and a replenishment needs published eligibility conditions. After an objection, a further pull needs a Snapshot vote."
    kept:
      - "On chain: two funding registries pay only the Asset Safe, within a limit per month each. The limits are a backstop: they allow more than the mandate size."
      - "Before execution: the screening vendor checks every top-up motion when the committee's Safe creates it, once the launch cap lifts (OD-54)."
      - "Detection: alerts on a top-up above the posted headroom, on a top-up that would take the vault above the mandate size or the treasury share, and on any top-up after an objected one."
    tech: "INV-017 fixes the registries' recipient. A registry cannot enforce the Snapshot-vote rule after an objection; monitoring and a DAO vote that sets the limit to zero cover it. Nothing on chain holds the mandate size or the treasury share."
    changes:
      - text: "The funding rules allow sUSDS."
        why: "A DAO vote adds USDS to the shared payment permission, and the stablecoin registry pays sUSDS too."
        state: owed
        sources: ["ADR-008#d9", "ADR-008#d10", OD-11]
      - text: "ETH is not a funding asset; stETH covers the mandate's \"(st)ETH\"."
        why: "EM decided that stETH covers the mandate's \"(st)ETH\", so the funding registries need no ETH path."
        state: design
        sources: ["ADR-008#d11", OD-11]
      - text: "Until the screening guard is live, the vault stays under a cap of one million dollars on the Asset Safe and the orders account. A forum post lifts the cap once the guard is set with its bypass mode off."
        why: "EM allowed a launch without the guard under this cap. The registries keep their limits, so the cap holds by procedure: top-ups stop at the cap, monitoring alerts above it, and LDO holders can object."
        state: owed
        sources: ["ADR-010#d20", "ADR-010#d21", "ADR-010#d22", "ADR-008#d20", OD-54, OD-55]
      - text: "The size section states the treasury share's base, the time of its test, and the remedy for a breach that no vault transaction causes. The funding section publishes the eligibility conditions of a replenishment."
        why: "The treasury's own spending or a price move can breach the share with no vault transaction, and a top-up needs conditions to meet."
        state: owed
        sources: ["ADR-008#d33", "ADR-008#d34", OD-89]
      - text: "Monitoring keeps the funded value: the first-loss shares at their value on the day of the transfer, and each top-up at its value on the day of its enactment, by the report's price rule. Each top-up's forum post states it, with the headroom under the mandate size."
        why: "The mandate counts each funding at its value when funded, so later prices do not move the vault against its size."
        state: proposed
        sources: ["ADR-008#proposed-direction", OD-89]
    sources: ["ADR-008#d3", "ADR-008#d4", "ADR-008#d5", "ADR-008#d6", "ADR-008#d8", "ADR-008#d32", "ADR-008#d33", "ADR-008#d34",
      "ADR-008#proposed-direction", OD-06, OD-11, OD-54, OD-89, INV-017, "runbook:Top up the vault"]

  - id: swaps
    title: Swaps
    says: "The emergency path may swap any asset into any of the four main stablecoins."
    kept:
      - "On chain: every swap is a CoW order from the orders account, and each role's permissions pin the receiver: the Asset Safe for the operator, the Aragon Agent for recovery."
      - "Before execution: the screening vendor checks every operator order. Recovery orders are never screened."
      - "Detection: each fill against a market price, open orders, and a page on every emergency swap."
    tech: "Orders live at most 90 days, recovery orders 1 day (INV-024). Nothing on chain bounds an order's price; CoW's competition and EBBO rule hold a fill to the on-chain market."
    changes:
      - text: "The forum post's emergency section states that the emergency swap goes into USDC, or USDT as the second destination, and not into any of the four main stablecoins."
        why: "USDS and DAI carry USDC risk through Sky's peg stability module, so they are no escape from a USDC depeg. The forum post carries the emergency section."
        state: forum
        sources: ["ADR-007#d5", "ADR-007#d15", OD-26, OD-90]
      - text: "The swap section says plainly what the launch trades off: CoW's market, limit and TWAP orders through the orders account are the only venue, nothing on chain bounds their price, and Uniswap and 1inch wait for a screening check of the output."
        why: "The committee needs those order types, and a router swap without a bounded output loses value to front-running. One venue at launch is a trade-off, so the text names it."
        state: owed
        sources: ["ADR-007#d18", "ADR-007#d20", "ADR-007#d26", OD-43, OD-48, OD-90]
    sources: ["ADR-007#d17", "ADR-007#d18", "ADR-007#d19", "ADR-007#d23", "ADR-007#d25", "ADR-007#d26", "ADR-007#d29",
      "ADR-007#proposed-direction", OD-26, OD-43, OD-48, OD-61, INV-024, "runbook:Recovery order"]

  - id: emergency
    title: Emergency exit
    says: "A dual-access emergency exit: the DAO, and an emergency committee independent of the Treasury Management Committee, can each return every asset to the treasury within six hours."
    kept:
      - "On chain: the emergency Safe revokes, exits and sends assets to the Agent through the safety modifier, which nothing screens. Its five signers are two committee members, two Emergency Brakes members and one member of neither body, at 3 of 5, so the committee cannot use it alone."
      - "On chain: the emergency Safe can switch the operator off; the Emergency Brakes multisig can pause Easy Track; only a DAO vote restarts."
      - "Drills: fork drills must show every emergency action initiated within six hours."
    tech: "INV-002 and INV-009 fix the emergency powers, and INV-027 refuses any emergency call that restores authority. A motion that onboards a protocol also adds its emergency exit through the exit-governance role (INV-025)."
    changes:
      - text: "The forum post's emergency section describes the emergency Safe: three of five, with two committee members, two Emergency Brakes members and a fifth signer who is a member of neither body."
        why: "Its quorum without the committee, the two Emergency Brakes members and the fifth signer, is the draft's independent emergency committee, so the dual-access exit holds as drafted. The detail fits the forum post."
        state: forum
        sources: ["ADR-005#d24", OD-58, OD-90]
    sources: ["ADR-005#d2", "ADR-005#d4", "ADR-005#d11", "ADR-005#d23", "ADR-005#d24", "ADR-005#d25", "ADR-005#d26",
      "ADR-005#context", "ADR-005#proposed-direction", OD-49, OD-58, OD-59, "lip:part-6", "runbook:Return assets to the Agent"]

  - id: reporting
    title: Reporting
    says: "The committee publishes a monthly report within seven calendar days after month-end, a post before each top-up, and an incident report."
    kept:
      - "A report generator in this repository that anyone can run again at a pinned block."
      - "No top-up starts while the monthly report is late; monitoring flags it on day 8."
      - "Monitoring publishes the cap reading of each fortnightly snapshot to IPFS."
      - "Each monthly report lists every open order with its limit, its age and the idle balance behind it."
      - "Display: two readings, Lido's report generator and the policy provider's own, on the same rules. Both go to IPFS, and a breach in either counts."
    tech: "Prices follow a five-level waterfall, Coingecko first, and every price shows its level and its source. Reports have no on-chain anchor; the forum post carries the report's identifier."
    changes:
      - text: "The LIP states the price waterfall, and that the committee's valuation policy sets its band and the share that its last level may price. The mandate text does not need it."
        why: "Reviewers can then hold the committee to how each figure was priced, and the Snapshot text stays short."
        state: design
        sources: ["ADR-009#d23", "ADR-009#d35", "ADR-009#d37", OD-14, OD-62, OD-90]
      - text: "The reporting section states the late-report rule: no top-up while the report is late."
        why: "The report is the evidence for every top-up."
        state: owed
        sources: ["ADR-009#d21", "ADR-009#d23", OD-14]
    sources: ["ADR-009#d19", "ADR-009#d21", "ADR-009#d22", "ADR-009#d25", "ADR-009#d35", "ADR-009#d36", "ADR-009#d40",
      "ADR-009#d41", "ADR-009#d42", "ADR-009#d44", "ADR-007#d29", OD-14, OD-32, OD-61, OD-62, OD-84, OD-85, OD-87]

  - id: legacy
    title: Legacy investments
    says: "Legacy DAO investments carry over into the vault and reduce the initial funding request."
    kept:
      - "On chain: the DAO's first-loss Earn shares sit in a first-loss Safe. A burn runs only as an Easy Track motion, and one narrow role of the committee's Safe redeems them to the Aragon Agent; no other role reaches them."
      - "The committee acts on the Earn team's written instruction, under the March 2026 terms. Below them, a Snapshot exception comes first."
      - "Detection: alerts on any change of the first-loss Safe's balance, owners or modules, and a page on every burn motion and every action of the role."
    tech: "INV-021 fixes the first-loss Safe's shape and its two roles. The Growth Committee's Safe moves the shares once, after the enabling vote."
    changes:
      - text: "The legacy section takes over the first-loss terms of the March 2026 Earn allocation, with the committee as executor in place of the Growth Committee: a burn as an Easy Track motion, and an exit through one narrow role on a first-loss Safe."
        why: "The chain cannot tell first-loss shares from other Earn shares, so a separate Safe keeps them apart. A burn moves the shares' value to other depositors, so LDO holders get the objection window, and no burn is silent; an exit pays the DAO, so it stays fast."
        state: owed
        sources: ["ADR-008#d14", "ADR-008#d21", "ADR-008#d22", "ADR-008#d23", OD-21, OD-42, OD-60, OD-67, OD-90]
      - text: "Twyne reduces the seed only when its holder and form are shown."
        why: "No Lido address checked holds a Twyne position."
        state: design
        sources: ["ADR-008#d17", OD-21]
    sources: ["ADR-008#d13", "ADR-008#d17", "ADR-008#d19", "ADR-008#d21", "ADR-008#d22", "ADR-008#d23",
      "ADR-008#proposed-direction", OD-21, OD-42, OD-60, OD-67, INV-021, "runbook:Move the legacy Earn shares", "runbook:Burn first-loss Earn shares"]

  - id: controls
    title: How each rule is kept
    says: "LDO holders approve the mandate in a Snapshot vote, before the enabling vote."
    kept:
      - "Every rule gets a control on each layer that can carry it: on chain, before execution, detection and display."
      - "Motions are the timelock for every structural increase of exposure."
      - "A relaxation of a screening rule gets a notice on the forum, and the vendor's own delay if it has one."
    tech: "The control matrix maps each rule to its controls, owner and status."
    changes:
      - text: "The forum post carries the control matrix, which says how each rule is kept."
        why: "Much of the mandate cannot be enforced on chain, so each rule needs a named control and owner. That detail fits the forum post, and the Snapshot text stays short."
        state: forum
        sources: ["ADR-009#d26", OD-39, OD-90]
      - text: "Easy Track motions are the timelock for structural increases of exposure, and screening rules get change control."
        why: "A wider target list or a looser screening rule must not take effect without notice."
        state: design
        sources: ["ADR-009#d30", "ADR-010#d19", "ADR-010#d23", OD-45, OD-64]
    sources: ["ADR-009#d26", "ADR-009#d30", OD-39, OD-45, "doc:docs/specs/control-matrix.md#control-matrix",
      "doc:ROADMAP.md#roadmap"]
