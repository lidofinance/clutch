# The Treasury Management mandate, block by block: what the mandate's text says, how Clutch keeps
# each rule, and where the design and the text differ, and why. The text of 2026-11-19 is the source
# of truth, and the design follows it (OD-160 to OD-167). Only what the repository already records
# about the text; the text itself is restricted, and no figure from it enters this page.
# Change state: owed (the mandate's text owes the change before its Snapshot; the enabling-vote
# specification lists these), forum (the mandate's forum post carries it, OD-90), design (Clutch's
# own rule or design choice; no text change is needed), proposed (agent-drafted, not yet decided).
intro: >-
  LDO holders approve the mandate in a Snapshot vote. Its text is not public yet, so this tab paraphrases only what
  the repository records about it, and shows no figure from it. The text is the source of truth, and the design
  follows it. The notes mark Clutch's own rules and the changes that the text still owes.
blocks:
  - id: custody
    title: Purpose and custody
    says: "The committee puts a bounded part of the DAO treasury to work in approved protocols. The DAO keeps the assets, and no committee or service provider can take them."
    kept:
      - "On chain: Aragon Voting is the only owner of the Asset Safe, the orders account and the first-loss Safe, so no vault action passes Dual Governance."
      - "On chain: every receiver, owner and beneficiary in the operator's permissions is the vault."
      - "Detection: alerts on any change of the owners, modules or singleton of every new Safe."
    tech: "INV-001, INV-021 and INV-023 fix the owners; INV-003 and INV-022 fix the receivers. Recovered assets go to the Aragon Agent."
    sources: ["ADR-008#d19", "ADR-007#d17", "ADR-007#d20", "ADR-005#d28", "ADR-005#proposed-direction",
      "ADR-014#d8", "INV-001", "INV-003", "INV-038", "doc:docs/product/brief.md#the-system",
      "doc:docs/specs/lip-draft.md#simple-summary", "doc:docs/specs/control-matrix.md#the-matrix",
      "doc:docs/specs/enabling-vote.md#the-mandates-owed-text"]

  - id: assets
    title: Assets and venues
    says: "A launch list of assets and venues. It names four main stablecoins: USDC, USDT, USDS and DAI. The disclosure of an onboarding comes before its motion, by the period that the mandate sets."
    kept:
      - "On chain: [[default-deny]]. A new target needs a [[motion]] of the universal factory, with a 72-hour objection window."
      - "Before execution: the screening vendor checks every operator transaction and every new motion, once the guard is set."
      - "Detection: drift of the chain from the committed policy."
    tech: "INV-004 and INV-005 bound what a motion can add. INV-015 keeps the operator inside the launch scope."
    changes:
      - text: "Twyne leaves the launch list. It can come after launch by an onboarding motion, with its permissions, monitoring and exits."
        why: "The launch scope holds no Twyne permission. An onboarding of Twyne also needs a check against the mandate's ban on borrowing first."
        state: owed
        sources: ["ADR-011#d16", "doc:docs/specs/enabling-vote.md#the-mandates-owed-text"]
      - text: "DAI earns through Sky's DAI–USDS converter, one to one, not through swaps."
        why: "The mandate's four main stablecoins include DAI, and converting is cheaper than swapping."
        state: design
        sources: ["ADR-011#d2", "ADR-011#d7"]
      - text: "Lido Lend joins by one motion after launch, and the same motion adds its emergency exit."
        why: "Lido Lend does not exist yet, so its address cannot be in the enabling vote."
        state: design
        sources: ["ADR-011#d3", "ADR-011#d13"]
      - text: "LDO is on no list: not on the launch list, not on the operator's order lists and not on the recovery sell list."
        why: "LDO would enter the vault only through a buy order or a vote, and a buy order reads as an LDO buyback."
        state: design
        sources: ["ADR-011#d15", "ADR-011#d1", "ADR-007#d22", "ADR-014#d15"]
      - text: "A new token joins the operator's order lists by one motion, on the sell side and the buy side."
        why: "A vote of about five days for each new token is heavy. The motion can grant only one delegatecall, to CoW's order signer."
        state: design
        sources: ["ADR-007#d41", "ADR-013#d8"]
    sources: ["ADR-011#d1", "ADR-011#d2", "ADR-011#d7", "ADR-011#d15", "ADR-006#d2", "ADR-006#d4", "ADR-005#d31",
      "ADR-010#d22", "ADR-010#d24", "ADR-006#d11", "ADR-006#context", "ADR-013#d5", "ADR-013#d11", "INV-004",
      "INV-015", "lip:part-8", "doc:docs/specs/control-matrix.md#the-matrix"]

  - id: caps
    title: Exposure caps
    says: "Caps on exposure, each a share of a defined base: per protocol or counterparty, per stablecoin, and for yield-bearing assets. No cap holds a Lido product, so the whole vault may sit in Lido's own products."
    kept:
      - "On chain: none. The policy cannot see value; budgets per protocol spender bound how much can move each month."
      - "Before execution: the Zodiac UI refuses an operator transaction that breaches a cap, in its interface only. A screening rule is requested for the same refusal, once the guard is set."
      - "Detection: monitoring publishes the cap reading of each [[fortnightly snapshot]]. An alert on a breach in either reading, Lido's or the policy provider's, pages the emergency Safe."
      - "Display: each cap against its limit, in the Zodiac UI."
    tech: "Budget keys count token units and refill no more often than every 30 days. Caps are ratios, so budgets drift with price. There is no routine retune: a budget motion follows an event (OD-56). A Lido product's budget key and its motion bound each month's deposits."
    changes:
      - text: "The [[switch]] has no fixed trigger after a cap breach. The emergency Safe's signers act on their judgment, and the committee owns the fix."
        why: "The mandate's text holds no remedy for a cap breach, so no rule of the text forces the switch. The emergency role may act at any time."
        state: design
        sources: ["ADR-009#d6", "ADR-009#d25", "ADR-009#d34", "ADR-009#d41", "OD-165"]
      - text: "The mandate says that caps are kept by measurement, publication and remediation, not by reverting a transaction."
        why: "The permission layer cannot see value, so no contract reverts on a cap."
        state: proposed
        sources: ["ADR-009#d1", "ADR-009#proposed-direction", "lip:part-9"]
    sources: ["ADR-009#d4", "ADR-009#d9", "ADR-009#d13", "ADR-009#d15", "ADR-009#d25",
      "ADR-009#d29", "ADR-009#d41", "ADR-009#d43", "ADR-009#d31", "ADR-009#d34",
      "ADR-009#proposed-direction", "ADR-010#d22", "doc:docs/specs/control-matrix.md#the-matrix", "OD-56", "OD-167"]

  - id: runway
    title: Stablecoin reserves and the runway
    says: "The committee builds stablecoin reserves in the vault. It returns them to the treasury when the DAO's stablecoin runway falls below the level that the mandate sets."
    kept:
      - "On chain: the operator's transfer pinned to the Aragon Agent returns any vault token, with no motion and no vote. The vault keeps no liquidity buffer of its own."
      - "Detection: monitoring reports each transfer to the Agent, at a low severity."
      - "Detection: each monthly report shows the TMC-6 ratio for the whole treasury, the vault's sUSDS included."
    tech: "The treasury's TMC-6 rules keep a stablecoin runway floor across the DAO's and the foundations' wallets, and cap sUSDS and tokenized money market funds for the whole treasury. The committee publishes the operating expenses that the runway reading uses; the repository holds no figure."
    changes:
      - text: "The runway floor is a gate of a top-up motion: no top-up takes the treasury's stablecoins below the runway floor of TMC-6. The motion's forum post states the treasury's stablecoin runway after the top-up, and monitoring alerts on a top-up motion that breaks the floor."
        why: "A top-up takes stablecoins out of the treasury, so each one is checked against the treasury's runway. The alert is not built."
        state: design
        sources: ["ADR-009#d48", "OD-163", "doc:docs/specs/control-matrix.md#the-matrix"]
    sources: ["ADR-014#d8", "ADR-014#d9", "ADR-009#d46", "ADR-009#d47", "ADR-009#d48", "ADR-009#proposed-direction",
      "runbook:Return assets to the Agent",
      "doc:docs/research/easy-track-first-2026-11-05.md#treasury-rules-that-the-committees-items-touch"]

  - id: funding
    title: Funding
    says: "The enabling vote pays the vault's initial funding from the treasury, in the amounts that the mandate sets. Top-ups through Easy Track follow. The size is tested at every top-up: the vault's value at that time plus the top-up may not exceed the mandate size, and the legacy positions count in that value. When gains take the vault's value above the size, nothing is sold, and top-ups stop. More funding than the mandate size needs a separate DAO approval. After an objection stops a top-up, further funding needs a Snapshot vote."
    kept:
      - "On chain: treasury funds reach the vault only through Finance. The enabling vote pays the initial funding, and after it a [[top-up motion]] of the committee's Safe pays each top-up, within a registry's limit for three months. Each registry lists the Asset Safe as its only recipient."
      - "Detection: the forum post of each top-up motion states the vault's value, the headroom under the mandate size, the treasury share and the treasury's stablecoin runway after the top-up. Monitoring alerts on a top-up motion that breaks the headroom, and on one that follows an objected one."
    tech: "INV-037: treasury funds reach the vault only by the enabling vote's payments and by the two top-up factories. The vote's payments pass no top-up registry and no objection window. The vault's value counts the first-loss shares, by the report's price rule. Nothing on chain holds the mandate size or the treasury share; LDO holders do, when they object to a top-up motion."
    changes:
      - text: "The funding section says that the enabling vote pays the initial funding from the treasury, so not every funding is a top-up motion. It says that the holder's signers move the Earn positions after the vote. It asks for no test with real funds before the vote."
        why: "The text funds the vault at the vote, and the vote pays only from the treasury. The Growth Committee's Safe holds the Earn positions, so the vote cannot move them."
        state: owed
        sources: ["ADR-014#d14", "ADR-014#d18", "ADR-008#d13", "OD-161", "doc:docs/specs/enabling-vote.md#the-mandates-owed-text"]
      - text: "The vault never holds more than a set share of the DAO's non-LDO treasury. This [[treasury share]] is Clutch's own rule, and the acceptor sets its figure."
        why: "The mandate's text holds no such share, and the text needs none. The design keeps the test as its own rule."
        state: design
        sources: ["ADR-008#d33", "OD-164", "doc:docs/specs/enabling-vote.md#the-mandates-owed-text"]
    sources: ["ADR-008#d32", "ADR-008#d33", "ADR-008#d34", "ADR-008#d37", "ADR-014#d13", "ADR-014#d14",
      "ADR-014#d15", "ADR-014#d18", "ADR-014#d19", "ADR-014#proposed-direction", "ADR-009#d48",
      "ADR-009#proposed-direction", "INV-037", "runbook:Top up the vault",
      "doc:docs/specs/control-matrix.md#the-matrix",
      "test:test_topup_the_enabling_vote_registers_the_factories_and_its_payments_spend_no_limit"]

  - id: screening
    title: Screening and monitoring
    says: "A screening guard checks the committee's transactions before execution. The guard is set when the vault's volume in a quarter passes the threshold that the mandate sets."
    kept:
      - "Before execution: none at launch. The vault launches without the guard. Until the guard is set, no control before execution holds a cap or an order's price."
      - "On chain: the permissions and the budgets hold from the launch. Once set, the guard refuses any transaction of the committee's Safe that the vendor has not approved, once and exactly."
      - "Detection: monitoring runs from go-live. Until the guard is set, it is the only control of the caps and of an order's price."
    tech: "INV-010 holds from the moment the guard is set, with its bypass mode off. What counts as volume, and who reads it, is open (OD-168)."
    changes:
      - text: "The text states one rule for the guard: it is set when the vault's volume in a quarter passes the threshold. The go-live condition, the table of guardrails and the list of control layers say the same. None says that screening holds a limit or an order's price before the guard is set."
        why: "The vault launches without the guard, so a reader must not count on screening before the threshold."
        state: owed
        sources: ["ADR-010#d20", "ADR-010#d22", "OD-160", "doc:docs/specs/enabling-vote.md#the-mandates-owed-text"]
      - text: "The text defines the volume and its quarter."
        why: "The threshold decides when the guard is set, and the text does not say what counts as volume."
        state: owed
        sources: ["ADR-010#d22", "OD-168", "doc:docs/specs/enabling-vote.md#the-mandates-owed-text"]
      - text: "The text says that monitoring runs from go-live, and not from the volume threshold."
        why: "Until the guard is set, monitoring is the only control of the caps and of an order's price."
        state: owed
        sources: ["ADR-010#proposed-direction", "doc:docs/specs/enabling-vote.md#the-mandates-owed-text"]
    sources: ["ADR-010#d1", "ADR-010#d4", "ADR-010#d20", "ADR-010#d22", "ADR-010#d24",
      "ADR-010#proposed-direction", "INV-010", "OD-160", "OD-168", "doc:docs/specs/control-matrix.md#the-matrix"]

  - id: swaps
    title: Swaps
    says: "The emergency path may swap any asset into any of the four main stablecoins."
    kept:
      - "On chain: every swap is a CoW order from the orders account, and each role's permissions pin the receiver: the Asset Safe for the operator, the Aragon Agent for recovery."
      - "Before execution: once the guard is set, the screening vendor checks every operator order. Recovery orders are never screened."
      - "Detection: each fill against a market price, open orders, and a page on every emergency swap."
    tech: "Orders live at most 90 days, recovery orders 1 day (INV-024). Nothing on chain bounds an order's price; CoW's competition and EBBO rule hold a fill to the on-chain market."
    changes:
      - text: "The forum post's emergency section states that the emergency swap goes into USDC, or USDT as the second destination, and not into any of the four main stablecoins."
        why: "USDS and DAI carry USDC risk through Sky's peg stability module, so they are no escape from a USDC depeg."
        state: forum
        sources: ["ADR-007#d5", "ADR-007#d15", "OD-90"]
      - text: "CoW's market, limit and TWAP orders through the orders account are the only venue. Uniswap and 1inch wait for a screening check of the output and for a permission that pins every route address."
        why: "The committee needs those order types, and a router swap without a bounded output loses value to front-running."
        state: design
        sources: ["ADR-007#d18", "ADR-007#d20", "ADR-007#d26"]
    sources: ["ADR-007#d17", "ADR-007#d18", "ADR-007#d19", "ADR-007#d25", "ADR-007#d26", "ADR-007#d29",
      "ADR-007#proposed-direction", "OD-26", "INV-024", "runbook:Recovery order"]

  - id: emergency
    title: Emergency exit
    says: "A dual-access emergency exit: the DAO, and an emergency committee independent of the Treasury Management Committee, can each return every asset to the treasury."
    kept:
      - "On chain: the emergency Safe revokes, exits and sends assets to the Agent through the safety modifier, which nothing screens. The committee cannot use it alone."
      - "On chain: the emergency Safe can [[switch]] the operator off, and the Emergency Brakes multisig can pause Easy Track. Neither restarts what it stopped."
      - "Drills: fork drills must show every emergency action initiated within six hours."
    tech: "INV-002 and INV-009 fix the emergency powers, and INV-027 refuses any emergency call that restores authority. A motion that onboards a protocol also adds its emergency exit through the exit-governance role (INV-025)."
    changes:
      - text: "The sentence on the emergency Safe's fifth signer names the class: a Lido Labs engineering contributor who is a member of neither the committee nor the Emergency Brakes multisig."
        why: "The mandate's Snapshot sets the class, and the acceptor names the person. No separate Snapshot appoints the signer."
        state: owed
        sources: ["ADR-005#d24", "OD-65", "doc:docs/specs/enabling-vote.md#the-mandates-owed-text"]
      - text: "The forum post's emergency section describes the emergency Safe: three of five, with two committee members, two Emergency Brakes members and a fifth signer, a Lido Labs engineering contributor who is a member of neither body."
        why: "Its quorum without the committee, the two Emergency Brakes members and the fifth signer, is the mandate's independent emergency committee, so the dual-access exit holds."
        state: forum
        sources: ["ADR-005#d24", "OD-90", "doc:docs/specs/enabling-vote.md#the-mandates-owed-text"]
      - text: "Every emergency action starts within six hours. This gate is Clutch's own, and fork drills must prove it."
        why: "A recovery that starts late in a depeg loses value, so the design keeps the gate as its own rule."
        state: design
        sources: ["OD-167", "doc:ROADMAP.md#standing-gates"]
    sources: ["ADR-005#d2", "ADR-005#d23", "ADR-006#d7", "ADR-006#d8", "ADR-006#d14", "ADR-005#d24",
      "ADR-005#d25", "ADR-005#d26", "ADR-005#context", "ADR-005#proposed-direction", "ADR-013#d12", "OD-49",
      "lip:part-6", "runbook:Return assets to the Agent", "runbook:Restart after a stop"]

  - id: reporting
    title: Reporting
    says: "The committee publishes a monthly report within seven calendar days after month-end, a post before each top-up, and an incident report."
    kept:
      - "A report generator in this repository that anyone can run again at a pinned block."
      - "No top-up motion starts while the monthly report is late; monitoring flags the late report on day 8 and alerts on one that starts."
      - "Each monthly report shows the TMC-6 ratio for the whole treasury."
      - "Monitoring publishes the cap reading of each fortnightly snapshot to IPFS."
      - "Each monthly report lists every open order with its limit, its age and the idle balance behind it."
      - "Display: two readings, Lido's report generator and the policy provider's own, on the same rules. Both go to IPFS."
    tech: "Prices follow a five-level waterfall, Coingecko first, and every price shows its level and its source. Reports have no on-chain anchor; the forum post carries the report's identifier."
    changes:
      - text: "The reporting section says that the runway reading needs the DAO's operating expenses, so not every line of a report can be rebuilt from on-chain data."
        why: "The operating expenses are not on chain. The committee publishes the figures that the runway reading uses."
        state: owed
        sources: ["ADR-009#d48", "OD-163", "doc:docs/specs/enabling-vote.md#the-mandates-owed-text"]
      - text: "The LIP states the [[price waterfall]], and that the committee's valuation policy sets its band and the share that its last level may price. The mandate's text leaves it to the LIP."
        why: "Reviewers can then hold the committee to how each figure was priced, and the Snapshot text stays short."
        state: design
        sources: ["ADR-009#d23", "ADR-009#d35", "ADR-009#d37", "lip:part-9"]
    sources: ["ADR-009#d19", "ADR-009#d21", "ADR-009#d22", "ADR-009#d23", "ADR-009#d25", "ADR-009#d35",
      "ADR-009#d36", "ADR-009#d40", "ADR-009#d41", "ADR-009#d42", "ADR-009#d44", "ADR-009#d47", "ADR-007#d29",
      "ADR-014#proposed-direction"]

  - id: legacy
    title: Legacy investments
    says: "Legacy DAO investments carry over into the vault and count in its value. The first-loss terms of the March 2026 Earn allocation carry over with them."
    kept:
      - "On chain: the DAO's first-loss Earn shares sit in a [[first-loss Safe]]. A burn runs only as an Easy Track motion, and one narrow role of the committee's Safe redeems them to the Asset Safe; no role can transfer or approve them."
      - "The committee acts on the Earn team's written instruction, under the March 2026 terms. Below them, a Snapshot exception comes first."
      - "Detection: alerts on any change of the first-loss Safe's balance, owners or modules, and a page on every burn motion and every action of the role."
    tech: "INV-021 fixes the first-loss Safe's shape and its roles. The enabling vote does not move the Earn positions: the Growth Committee's Safe moves the shares once, after the vote."
    changes:
      - text: "The committee executes the first-loss terms in place of the Growth Committee: a burn as an Easy Track motion, and an exit through one narrow role on a first-loss Safe."
        why: "A burn moves the shares' value to other depositors, so LDO holders get the objection window; an exit keeps the value in the vault, so it stays fast."
        state: design
        sources: ["ADR-008#d14", "ADR-008#d21", "ADR-008#d22", "ADR-008#d23", "OD-42"]
      - text: "Redemption and fund-exit proceeds stay in the vault: they pay the Asset Safe, not the treasury."
        why: "An exit keeps the value in the vault. A return to the treasury is the committee's own transfer, pinned to the Aragon Agent."
        state: design
        sources: ["ADR-014#d9", "ADR-014#d10", "ADR-014#proposed-direction"]
      - text: "A Twyne position counts in the vault's value only when its holder and form are shown on chain or in a signed record."
        why: "No Lido address checked holds a Twyne position."
        state: design
        sources: ["ADR-008#d17"]
    sources: ["ADR-008#d13", "ADR-008#d17", "ADR-008#d19", "ADR-008#d21", "ADR-008#d22", "ADR-008#d23",
      "ADR-008#d32", "ADR-008#proposed-direction", "ADR-014#d10", "ADR-014#d14", "INV-021",
      "runbook:Move the legacy Earn shares", "runbook:Burn first-loss Earn shares",
      "doc:docs/specs/enabling-vote.md#the-mandates-owed-text"]

  - id: insurance
    title: Insurance
    says: "No insurance money moves before a Snapshot approves the insurance framework and raises the mandate size for it."
    kept:
      - "On chain: insurance for earnETH, earnUSD and Lido Lend is built in at launch and stays unused. Insurance money reaches the first-loss Safe only by motion, from the Asset Safe, within the budget key of its token."
      - "On chain: a payout goes only to the address that the fund's creating motion pinned, at most the fund's remaining cap."
      - "Detection: alerts on any change of the first-loss Safe's balance."
    tech: "INV-039 fixes the path of insurance money and the payout. Every insurance action is a motion, so LDO holders can object to each one."
    sources: ["ADR-014#d4", "ADR-014#d5", "ADR-014#d6", "ADR-014#d7", "ADR-008#d29", "INV-039",
      "runbook:Run an insurance motion", "OD-167"]

  - id: controls
    title: How each rule is kept
    says: "LDO holders approve the mandate in a Snapshot vote, before the enabling vote. The disclosure of an onboarding or of a higher budget comes before the motion, by the period that the mandate sets. A relaxation that loosens a limit of the mandate waits for its Easy Track motion."
    kept:
      - "Every rule gets a control on each layer that can carry it: on chain, before execution, detection and display."
      - "Motions are the timelock for every structural increase of exposure: a new target and a higher budget each wait for the objection window."
      - "A relaxation of a screening rule that loosens a limit of the mandate takes effect only after an Easy Track motion with the matching on-chain change passes its objection window. Any other relaxation gets a notice on the forum, and the vendor's own delay if it has one."
    tech: "The control matrix maps each rule to its controls, owner and status."
    changes:
      - text: "The forum post carries the [[control matrix]], which says how each rule is kept."
        why: "Much of the mandate cannot be enforced on chain, so each rule needs a named control and owner."
        state: forum
        sources: ["ADR-009#d26", "OD-90"]
      - text: "Where a relaxation of a screening rule loosens a limit of the mandate and no on-chain value changes with it, the relaxation waits for a Snapshot."
        why: "With no on-chain change, no motion exists to wait for. This part is the agent's reading."
        state: design
        sources: ["ADR-010#d19", "ADR-010#d23", "OD-167"]
    sources: ["ADR-009#d26", "ADR-006#d4", "ADR-006#d11", "ADR-010#d19", "ADR-010#d23", "OD-167",
      "doc:docs/specs/control-matrix.md#control-matrix", "doc:ROADMAP.md#roadmap"]
