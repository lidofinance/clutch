# The guided tour: ten short scenes on the system map, for any reader.
- title: The vault, and who owns it
  text: "Clutch puts a bounded part of the DAO treasury to work in approved protocols. The assets sit in one new [[Safe]], the **Asset Safe**.\n\nThe Asset Safe has exactly one owner: Aragon Voting, the DAO's vote. The DAO keeps custody. In an emergency, assets go back to the [[Aragon Agent]], the DAO's treasury, a fixed address.\n\nAragon Voting also owns two smaller Safes: the [[orders account]], which places swap orders, and the [[first-loss Safe]], which holds the DAO's first-loss shares apart."
  tech: "The Asset Safe is a Safe v1.5.0 proxy. Aragon Voting is its only owner, at a threshold of one, and it has no guard and no fallback handler. Voting approves each transaction by `approveHash`, or sends it itself, without Dual Governance (INV-001, OD-73)."
  nodes: [dao, asset-safe, orders, first-loss]
  edges: [own]
  sources: ["ADR-005#d12", "ADR-005#d14", "ADR-005#d15", "ADR-005#d19", "ADR-005#d20", "ADR-005#proposed-direction",
    "ADR-007#d17", "ADR-008#d19", INV-001, "doc:docs/product/brief.md#the-system", OD-73]

- title: Nobody touches the vault directly
  text: "The Asset Safe switches on two [[Roles modifier|Roles modifiers]] from Zodiac. Each holder of a [[role]] calls a modifier. The modifier checks the call against the policy and, if it is allowed, runs it as the Asset Safe.\n\nThe policy is [[default-deny]]: a call that the policy does not list is refused."
  tech: "The modifiers are EIP-1167 proxies of the deployed, locked Roles mastercopy. The Asset Safe is their owner, avatar and target."
  nodes: [asset-safe, operator-modifier, safety-modifier]
  edges: [own-op, own-sf]
  sources: ["ADR-005#d6", "ADR-005#context", "ADR-005#proposed-direction", "lip:part-1"]

- title: "The operator: the committee at work"
  text: "The Treasury Management Committee runs the vault through its existing Safe, at 4 of 7, which holds the **operator role**. The operator can enter and leave approved protocols, within budgets.\n\nIt cannot move assets out: every receiver, owner and beneficiary in its operator permissions is the Asset Safe. Its one other role, on the [[first-loss Safe]], redeems the first-loss shares to the Aragon Agent. A burn of them is an Easy Track motion that it creates."
  tech: "The committee's Safe, on Safe v1.3.0, calls `execTransactionWithRole` on the operator modifier with the role key `bytes32(\"operator\")`; a batch goes through Safe's MultiSendCallOnly v1.3.0. Every receiver, owner and beneficiary is pinned with `EqualToAvatar` (INV-003)."
  nodes: [committee, operator-modifier, asset-safe, protocols]
  edges: [op-role, own-op, positions]
  flows: [op-tx, swap-order]
  sources: ["ADR-005#d9", "ADR-005#d27", "ADR-005#proposed-direction", "ADR-008#d23", OD-60, OD-67, INV-003,
    "test:test_D3_operator_cannot_route_around_avatar", "ADR-005#d31", OD-80]

- title: Every operator transaction is screened
  text: "[the screening vendor]'s [[guard]] sits on the committee's Safe. It refuses any transaction that the vendor has not approved, once and exactly, the committee's other duties included (OD-83).\n\nIf the vendor stops, the operator stops too: the guard [[fail closed|fails closed]]. Recovery does not change, because no guard sits on the emergency path.\n\nAt launch the guard is not set yet. The vault starts under a [[launch cap]] of one million dollars, and the cap lifts once the guard is live (OD-54)."
  tech: "A transaction guard on the committee's Safe. The vendor's key approves each exact transaction on chain, once, before it runs; a transaction without an approval reverts. The owners can remove the guard only through a 10-day timelock. Its bypass mode stays off: turning it on needs the vendor's approval and a 10-day timelock (INV-010)."
  nodes: [screening, committee]
  edges: [screen]
  flows: [vendor-outage]
  sources: ["ADR-010#d1", "ADR-010#d3", "ADR-010#d4", "ADR-010#d9", "ADR-010#d10", "ADR-010#d20", "ADR-010#d21",
    "ADR-010#d22", "ADR-010#proposed-direction", INV-010, OD-54, OD-83]

- title: Changes by motion, inside templates
  text: "The committee can widen its own permissions only through Easy Track [[motion|motions]], each built by a fixed [[template]]. LDO holders have 72 hours to object, and 0.5% of LDO stops a motion. This window is the timelock for every structural increase of exposure, such as a new target or a higher budget.\n\nAt enactment, the governance role writes the change. The modifier checks that write again: no role change, no [[delegatecall]], and no administrative target. The Asset Safe and its modifiers are refused as targets. The same motion gives the emergency role an exit from what it onboards."
  tech: "The governance role may call six functions on the operator modifier: `scopeTarget`, `revokeTarget`, `allowFunction`, `revokeFunction`, `scopeFunction` and `setAllowance`. The role key is pinned to `operator`, and a `Nor` condition refuses the Asset Safe and its modules as targets. The execution option must be below 2, so no delegatecall. `setAllowance` takes only the operator's budget keys, with a refill period of at least 30 days (INV-004, INV-012)."
  nodes: [committee, easytrack, dao, operator-modifier]
  edges: [motions, object, gov-role]
  flows: [onboard, budget, unlock]
  sources: ["ADR-006#d2", "ADR-006#d3", "ADR-006#d4", "ADR-006#d5", "ADR-006#d8", "ADR-006#d9", "ADR-006#d10",
    "ADR-006#d11", "ADR-006#d13", "ADR-006#context", "ADR-006#proposed-direction", INV-004, INV-012, OD-36,
    OD-38, OD-45, "doc:policy/constellation/constellation/roles/governance/permissions.ts"]

- title: Swaps are CoW orders
  text: "Every swap is a [[CoW]] order placed from the [[orders account]]. The operator sends a token there under a budget, then places a market, [[limit order|limit]] or [[TWAP]] order that pays the Asset Safe. A [[recovery order]] buys USDC or USDT and pays the Aragon Agent.\n\nNothing on chain bounds an order's price. CoW's competition rules, screening, the budgets and monitoring of each fill take its place."
  tech: "Market and limit orders: a delegatecall from the orders account to CoW's order signer, `signOrder`, with tokens from the lists, the Asset Safe as receiver and a `validDuration` of at most 90 days. TWAP orders go through ComposableCoW, with only the TWAP handler; a TWAP order is created with `createWithContext`, so it starts at its creation. These permissions are ADR 007's proposed direction (INV-022, INV-024)."
  nodes: [asset-safe, orders]
  edges: [swaps]
  flows: [swap-order, standing-order, recovery-order]
  sources: ["ADR-007#d5", "ADR-007#d17", "ADR-007#d18", "ADR-007#d19", "ADR-007#d23", "ADR-007#d26",
    "ADR-007#proposed-direction", OD-43, INV-013, INV-014, INV-022, INV-024]

- title: "Money in: top-ups"
  text: "Funding comes from the DAO treasury through the existing payment path. The vault holds up to the [[mandate size]]. After the seed, the committee's Safe creates a [[top-up]] motion only when the mandate's published conditions allow one. LDO holders can object for 72 hours.\n\nTwo funding registries pay only the Asset Safe, each within a monthly limit. The objection is the control; the limit is the backstop."
  tech: "Two allowed-recipients registries from Easy Track's registry factories, with Aragon Voting as their admin (OD-92), each with the Asset Safe as its only recipient and a one-month period. Two top-up factories create the motions, with the committee's Safe as their trusted caller (INV-017)."
  nodes: [committee, easytrack, funding, dao, asset-safe]
  edges: [motions, topup-motion, treasury, topup]
  flows: [topup, seed]
  sources: ["ADR-008#d3", "ADR-008#d4", "ADR-008#d5", "ADR-008#d32", "ADR-008#d34", "ADR-008#proposed-direction", INV-017, OD-89, "ADR-008#d35", OD-92]

- title: "Emergencies: two fast stops, one slow restart"
  text: "The **emergency Safe** has five signers: two committee members, two members of the Emergency Brakes multisig and one member of neither body. Three must sign, so the committee cannot use it alone. Through the safety modifier it revokes the operator, switches the operator modifier off, exits positions and sends assets to the Aragon Agent.\n\nThe **Emergency Brakes multisig** keeps only the Easy Track pause, and touches no funds. No emergency body restarts what it stopped: only a DAO vote does, in days."
  tech: "Target: initiate any emergency action within six hours. Drills on a fork must prove it before launch. The switch is `disableModule` on the Asset Safe, pinned to the operator modifier (INV-009); the emergency role holds no call that restores authority (INV-027)."
  nodes: [emergency-safe, safety-modifier, operator-modifier, dao, asset-safe]
  edges: [signers-em, em-role, revoke, own]
  flows: [financial-incident, recovery-order, technical-defect, unsafe-motion]
  sources: ["ADR-005#d2", "ADR-005#d4", "ADR-005#d11", "ADR-005#d23", "ADR-005#d24", "ADR-005#d25", "ADR-005#d26",
    "ADR-005#context", "ADR-005#proposed-direction", OD-58, OD-59, INV-002, INV-009, INV-027, "lip:part-6",
    "ADR-005#d30"]

- title: Caps are watched, not enforced
  text: "No contract reverts on a [[cap]] or on the [[liquidity buffer]]. Monitoring watches the buffer all the time and publishes the cap reading to IPFS every two weeks, and the policy provider publishes its own reading of the vault; a breach in either counts. The Zodiac UI refuses an operator transaction that would breach a cap, but only in its own interface. Each month, the committee publishes a report that anyone can reproduce.\n\nIf a breach is not fixed within two working days and is larger at the next reading, monitoring pages the emergency Safe, which switches the operator off. The [[control matrix]] lists each rule's controls on every layer."
  tech: "The cap reading is the report generator's output at the fortnightly snapshot's pinned block, published to IPFS. The alert that pages the emergency Safe links it (OD-32, OD-58). The two readings use the same rule data from this repository (OD-84, OD-86, OD-87)."
  nodes: [monitoring, reporting, asset-safe, emergency-safe, committee]
  edges: [watch, report, page]
  flows: [fortnightly, monthly-report, buffer-low, cap-breach]
  sources: ["ADR-009#d1", "ADR-009#d19", "ADR-009#d24", "ADR-009#d25", "ADR-009#d26", "ADR-009#d27", "ADR-009#d33",
    "ADR-009#d34", "ADR-009#d40", "ADR-009#d41", "ADR-009#d43", "ADR-009#d44", OD-29, OD-32, OD-39, OD-40, OD-58, OD-84, OD-86, OD-87]

- title: Little new code, and where it stands
  text: "Clutch reuses deployed code that already runs: Safe, Zodiac Roles, Easy Track, CoW's order contracts and Lido's monitoring. It adds Easy Track factories, the permission policy with its compiler, the vault's detectors and a report generator.\n\nToday the design is in phase 0. Nothing is deployed, no audit is done and no runbook is written. The **Built or reused** and **Status** tabs show each part."
  tech: "New code: the Easy Track factories, Clutch's TypeScript policy compiler, the detectors and the report generator. CoW's order signer counts as new code too, because it has no known audit (OD-96). Reused as deployed: Safe v1.5.0, the locked Roles mastercopy, Easy Track and CoW's other contracts."
  nodes: [policy, easytrack, reporting, monitoring]
  flows: [policy-change, roadmap, enabling-vote]
  sources: ["ADR-007#d40", OD-96, "ADR-006#d1", "ADR-004#d12", "ADR-004#d13", "doc:ROADMAP.md#roadmap"]
