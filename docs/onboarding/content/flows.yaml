# Flows, step by step. Each step highlights map nodes and edges when the flow plays.
# Label: built (built and tested on a fork), specified, open, existing or planned.
groups:
  - id: operations
    title: Everyday operations
    summary: "What the committee does on a normal day. The screening guard and the policy check every operator transaction before it runs."
  - id: governance
    title: Changing what the operator may do
    summary: "Motions widen the operator's permissions only through fixed templates, with 72 hours for LDO holders to object. Everything else is a DAO vote."
  - id: funding
    title: Funding the vault
    summary: "Money comes from the DAO treasury through Easy Track top-ups. The objection window is the control; the registry limit is the backstop."
  - id: reporting
    title: Reporting and monitoring
    summary: "Caps are detective. Monitoring and reports measure the vault, publish the numbers and start the fix. No contract reverts on a cap."
  - id: emergencies
    title: Emergencies
    summary: "Two fast stops and one slow exit. The emergency Safe pulls assets back; the Emergency Brakes multisig switches the operator off; the DAO can do anything, in days."
  - id: deployment
    title: Building, deploying and changing the system
    summary: "How the policy changes, how the system goes live, and the duties that keep it in step."

flows:
  # --- Everyday operations ----------------------------------------------------------------------
  - id: op-tx
    group: operations
    title: An operator transaction
    label: built
    summary: "How the committee changes a position, for example a USDC deposit into earnUSD. The screening guard and the policy both check the transaction before it runs."
    trigger: "The committee decides to change a position within the mandate."
    time: "Minutes, after [the screening vendor] approves."
    steps:
      - who: "Operator Safe signers, 4 of 7"
        text: "The signers build the transaction in the Zodiac UI or with local tooling. It calls the operator modifier with the operator role."
        nodes: [committee, operator-safe]
        edges: [signers-op]
        tech: "The call is `execTransactionWithRole` on the operator modifier, with the role key `bytes32(\"operator\")`. A batch goes through MultiSendCallOnly v1.5.0."
      - who: "[the screening vendor]"
        text: "The vendor reviews the exact transaction and approves it on chain, once. Without the approval, the guard makes the operator Safe refuse it."
        nodes: [screening, operator-safe]
        edges: [screen]
        check: "The guard fails closed. INV-010 is pending: the harness has no guard yet."
      - who: "Operator modifier"
        text: "The modifier checks the call against the operator's permissions and refuses anything that the policy does not list. An approval spends its spender's budget key."
        nodes: [operator-safe, operator-modifier]
        edges: [op-role]
      - who: "Asset Safe"
        text: "The modifier runs the call as the Asset Safe. The protocol pays any proceeds or claims to the Asset Safe, because every receiver is pinned to it."
        nodes: [operator-modifier, asset-safe, protocols]
        edges: [own-op, positions]
        check: "INV-003: every receiver, owner and beneficiary is the Asset Safe."
      - who: "Monitoring"
        text: "Monitoring records the change: approvals, budget burn and positions."
        nodes: [monitoring, asset-safe]
        edges: [watch]
    escapes:
      - "The vendor refuses: nothing runs. The committee fixes the transaction or asks again."
      - "The policy refuses: the call reverts and nothing changes."
      - "A problem shows after the call: the emergency Safe revokes the operator at once."
    sources: [ADR-005, ADR-010, ADR-009, INV-003, "test:test_D3_operator_lifecycle", "test:test_D3b_earn_deposit_policy_layer"]

  - id: swap-order
    group: operations
    title: A market or limit order
    label: specified
    summary: "How the vault swaps one token for another. The operator sends the token to the orders account and places a CoW order there. The order pays the Asset Safe, because the policy pins the receiver."
    trigger: "The committee wants a different mix of assets, for example less stETH and more USDC, now or at a set price."
    time: "A market order fills in minutes. A limit order can stand for up to 30 days (OD-47)."
    steps:
      - who: "Operator"
        text: "The operator transfers the token from the Asset Safe to the [[orders account]]. The transfer spends that token's orders budget, and the policy pins the recipient."
        nodes: [operator-safe, operator-modifier, asset-safe, orders]
        edges: [op-role, own-op, swaps]
        check: "Specified: the orders account and its permissions are not in the policy yet."
      - who: "Operator Safe"
        text: "On the orders account, the operator Safe signs a market or [[limit order]] through CoW's order signer. The screening guard checks this transaction too."
        nodes: [operator-safe, screening, orders]
        edges: [screen]
        check: "INV-022: the order's receiver is the Asset Safe."
        tech: "A delegatecall to `signOrder(order, validDuration, feeAmountBP)` on the order signer. The policy pins the sell and buy tokens to the operator's lists, the receiver to the Asset Safe, `validDuration` to the maximum order life, and the fee bound. The enabling vote has already approved CoW's vault relayer for each listed token."
      - who: "CoW Protocol"
        text: "CoW's solvers compete to fill the order at its limit or better. The settlement pays the Asset Safe directly."
        nodes: [orders, asset-safe]
        edges: [swaps]
      - who: "Monitoring"
        text: "Monitoring checks the fill against a market price, and alerts on open orders and on tokens left in the orders account."
        nodes: [monitoring, orders]
      - who: "Operator"
        text: "An order that has not filled can be cancelled with `unsignOrder`. Unused tokens go back to the Asset Safe."
        nodes: [orders, asset-safe]
        edges: [swaps]
    escapes:
      - "The vendor refuses the order: nothing runs."
      - "A fill comes in far below the market: monitoring alerts, and the emergency Safe can cancel the open orders and sweep the account."
    sources: [ADR-007, OD-43, OD-47, INV-013, INV-022, INV-024, "doc:docs/research/cow-orders-account-2026-10-06.md#the-cow-order-signer"]

  - id: standing-order
    group: operations
    title: A TWAP or stop-loss order
    label: specified
    summary: "How the vault buys or sells over time, or sells when a price falls. ComposableCoW holds the order, and CoW's watch-tower posts it to the order book."
    trigger: "The committee wants to average into a position over weeks, or to sell stETH if its price falls to a set level."
    time: "Until the last part fills or the order expires."
    steps:
      - who: "Operator"
        text: "The operator funds the orders account from the Asset Safe, under the orders budget."
        nodes: [operator-safe, operator-modifier, asset-safe, orders]
        edges: [op-role, own-op, swaps]
      - who: "Operator Safe"
        text: "The operator Safe creates the order on ComposableCoW: a [[TWAP]] order in equal parts, or a [[stop-loss order]] with a strike. A TWAP order starts at once and ends within 30 days. The screening guard checks it, and is asked to refuse a stop-loss order that expires more than 30 days ahead."
        nodes: [operator-safe, screening, orders]
        edges: [screen]
        check: "INV-022: the receiver is the Asset Safe, and a stop-loss order's oracles are Chainlink feeds that the policy pins."
        tech: "`ComposableCoW.create` with the handler pinned to the deployed TWAP or StopLoss handler. The orders account's fallback handler is CoW's `ExtensibleFallbackHandler`, and ComposableCoW verifies CoW's settlement domain for it (INV-023)."
      - who: "CoW's watch-tower"
        text: "The [[watch-tower]] posts each part of a TWAP order when it is due, or a stop-loss order once its price is met."
        nodes: [orders]
      - who: "CoW Protocol"
        text: "Each part fills at its minimum or better, and pays the Asset Safe directly."
        nodes: [orders, asset-safe]
        edges: [swaps]
      - who: "Monitoring"
        text: "Monitoring checks each fill, and alerts when a part is not posted on time."
        nodes: [monitoring, orders]
    escapes:
      - "The watch-tower stops: the orders wait and no funds move. The committee can remove them with `remove` and place ordinary orders."
      - "The emergency Safe can cancel every open order and sweep the orders account."
    sources: [ADR-007, OD-43, OD-47, INV-022, INV-023, INV-024, "doc:docs/research/cow-orders-account-2026-10-06.md#conditional-orders-twap-and-stop-loss"]

  # --- Governance ---------------------------------------------------------------------------------
  - id: onboard
    group: governance
    title: Onboarding a new protocol by motion
    label: specified
    summary: "How the committee adds a protocol without a full DAO vote. It creates an Easy Track motion through a fixed template, and LDO holders have 72 hours to object. The policy's limits on the governance role are built and tested on a fork; the template factories are not built."
    trigger: "The committee wants a new target, for example Lido Lend after its launch."
    time: "At least 72 hours, then enactment."
    steps:
      - who: "Committee"
        text: "The committee posts a disclosure on the forum. It sets up monitoring for the new target and updates the runbooks."
        nodes: [committee, reporting, monitoring]
      - who: "Operator Safe"
        text: "The operator Safe creates the motion on the template factory, with typed values only: a target, an asset and a budget key. The screening guard checks this transaction."
        nodes: [operator-safe, screening, easytrack]
        edges: [motions, screen]
      - who: "LDO holders"
        text: "The motion waits 72 hours. If holders of 0.5% of LDO object, it fails. This window is the timelock for every structural increase of exposure. The Emergency Brakes multisig can also pause Easy Track."
        nodes: [dao, easytrack, brakes]
        edges: [object, pause]
      - who: "Easy Track"
        text: "At enactment, Easy Track rebuilds the script and requires the hash stored at creation. A changed script fails."
        nodes: [easytrack]
        check: "INV-005, tested on a mock Easy Track."
      - who: "Governance role"
        text: "The script executor writes the new operator permission through the governance role. The modifier checks this write too: the operator key only, no role change, no delegatecall and no administrative target."
        nodes: [easytrack, operator-modifier]
        edges: [gov-role]
        check: "INV-004: the Asset Safe and every module of it are refused as targets (OD-38)."
      - who: "Exit-governance role"
        text: "The same script gives the emergency role the new target's exits on the safety modifier: redeem, withdraw and claim pinned to the Asset Safe, a transfer pinned to the Agent, and an approval set to zero."
        nodes: [easytrack, safety-modifier]
        check: "INV-025: this role writes only under the emergency key, with no delegatecall, allowance or administrative target. Specified, not built (OD-49)."
      - who: "Operator, and the emergency Safe if needed"
        text: "The operator can use the new permission. The emergency Safe can revoke it at once."
        nodes: [operator-safe, operator-modifier, emergency-safe, safety-modifier]
        edges: [op-role, em-role, revoke]
    escapes:
      - "An objection of 0.5% of LDO stops the motion."
      - "The Emergency Brakes multisig pauses Easy Track. Only the DAO can unpause it."
      - "The operator Safe cancels its own motion."
      - "After enactment, the emergency Safe revokes the new permission at once."
    sources: [ADR-006, INV-004, INV-005, INV-025, OD-36, OD-38, OD-45, OD-49, "lip:part-4", "test:test_D1_substituted_script_rejected_at_enactment"]

  - id: budget
    group: governance
    title: A budget motion
    label: specified
    summary: "How budgets follow the mandate. Every two weeks, the committee can retune the operator's budget keys by motion, from a holdings snapshot."
    trigger: "The fortnightly snapshot shows that a budget no longer fits the mandate's caps."
    time: "72 hours."
    steps:
      - who: "Committee"
        text: "The committee reads the holdings at a pinned block and derives each key's new budget, under that key's ceiling."
        nodes: [committee, asset-safe]
      - who: "Operator Safe"
        text: "The operator Safe creates a motion on the budget factory. The guard screens it."
        nodes: [operator-safe, screening, easytrack]
        edges: [motions, screen]
      - who: "Easy Track"
        text: "After 72 hours without an objection, the executor sets the budget through the governance role. The refill period stays at 30 days or more."
        nodes: [easytrack, operator-modifier, dao]
        edges: [gov-role, object]
        check: "INV-012: the 30-day floor is tested; the per-key ceilings wait for the attested figures."
      - who: "Monitoring"
        text: "Monitoring flags a second budget motion on the same key within 14 days."
        nodes: [monitoring]
    sources: [ADR-009, INV-011, INV-012, "lip:part-7", "test:test_D1_budget_motion_cannot_shorten_the_refill_period"]

  - id: dao-change
    group: governance
    title: A change that only the DAO can make
    label: built
    summary: "The owner path. The DAO can do anything to the Asset Safe: replace the policy, change who holds a role, enable a module again, burn first-loss shares or replace the operator Safe. Each such change takes days."
    trigger: "A change outside the motions' limits, or a repair after a defect in the safety modifier."
    time: "Days: the vote, then the Dual Governance delay."
    steps:
      - who: "LDO holders"
        text: "LDO holders vote in Aragon Voting."
        nodes: [dao]
      - who: "Dual Governance"
        text: "Dual Governance holds the result for its delay. Then its admin executor runs the script as the Aragon Agent."
        nodes: [dao]
      - who: "Aragon Agent"
        text: "The Agent approves the Asset Safe transaction by hash, or sends it itself, as the only owner."
        nodes: [dao, asset-safe]
        edges: [own]
      - who: "Asset Safe"
        text: "The Asset Safe runs the change, for example a new policy on both modifiers."
        nodes: [asset-safe, operator-modifier, safety-modifier]
        edges: [own-op, own-sf]
    sources: [ADR-005, INV-001, "test:test_D2_direct_DAO_path", "runbook:Replace the operator Safe", "runbook:Replace the operator modifier"]

  - id: unlock
    group: governance
    title: Unlocking a matured Lido product
    label: specified
    summary: "A new Lido product, Lido Lend first, counts against the protocol cap until it matures. A budget motion with a forum post unlocks it, so LDO holders can object."
    trigger: "The product meets the maturity criteria in the mandate. earnETH and earnUSD are not new products."
    time: "72 hours."
    steps:
      - who: "Committee"
        text: "The committee posts on the forum which maturity criteria the product meets."
        nodes: [committee, reporting]
      - who: "Operator Safe"
        text: "The operator Safe creates a budget motion that raises the product's budget key. The screening guard checks it."
        nodes: [operator-safe, screening, easytrack]
        edges: [motions, screen]
      - who: "LDO holders"
        text: "LDO holders have 72 hours to object. An objection of 0.5% of LDO stops the unlock."
        nodes: [dao, easytrack]
        edges: [object]
      - who: "Easy Track"
        text: "The motion enacts through the governance role. From then on, reports count the product as a Lido product, outside the protocol cap."
        nodes: [easytrack, operator-modifier, reporting]
        edges: [gov-role]
    sources: [ADR-009, ADR-006, OD-41, OD-45, "runbook:Unlock a matured product"]

  - id: rule-change
    group: governance
    title: Relaxing a screening rule
    label: specified
    summary: "What the chain cannot enforce, screening checks before execution. A rule that gets weaker gets change control, so it cannot loosen quietly."
    trigger: "The committee wants to relax a rule in [the screening vendor]'s service."
    steps:
      - who: "Committee and `@lidofinance/defi-tech`"
        text: "A pull request changes the written list of the vendor's rules in the control matrix. Reviewers approve it."
        nodes: [committee, policy]
      - who: "Committee"
        text: "The committee gives notice to the Emergency Brakes multisig and on the forum."
        nodes: [committee, brakes, reporting]
      - who: "[the screening vendor]"
        text: "The vendor applies the change, after its own delay if it has one."
        nodes: [screening]
    sources: [ADR-010, OD-39, OD-45, "doc:docs/specs/control-matrix.md#the-screening-vendors-rules"]

  # --- Funding ------------------------------------------------------------------------------------
  - id: topup
    group: funding
    title: The monthly top-up
    label: specified
    summary: "How money moves from the DAO treasury to the vault. After the monthly report, the operator Safe creates an Easy Track top-up motion."
    trigger: "Month-end, when the vault is below its floor."
    time: "72 hours, on days 1–10 of the month."
    steps:
      - who: "Committee"
        text: "The committee publishes the monthly report, then posts the shortfall on the forum before the top-up."
        nodes: [committee, reporting]
        check: "No top-up starts while the report is late, or while the snapshot has an unpriced asset."
      - who: "Operator Safe"
        text: "The operator Safe creates a top-up motion. The guard screens it."
        nodes: [operator-safe, screening, easytrack]
        edges: [motions, screen]
      - who: "LDO holders"
        text: "LDO holders have 72 hours to object."
        nodes: [dao, easytrack]
        edges: [object]
      - who: "Easy Track and Aragon Finance"
        text: "At enactment, the registry checks the monthly limit again, and Aragon Finance pays the Asset Safe from the treasury."
        nodes: [easytrack, funding, dao, asset-safe]
        edges: [topup-motion, treasury, topup]
        check: "INV-017: only the Asset Safe, only allowed tokens, within the limit. Pending: nothing is built yet."
      - who: "Monitoring"
        text: "Monitoring flags a top-up outside days 1–10, a month's top-ups above the posted shortfall, and any top-up after an objected one."
        nodes: [monitoring]
    escapes:
      - "An objection stops the top-up. The mandate then asks for a Snapshot vote."
      - "The registry refuses a payment above its remaining limit."
    sources: [ADR-008, ADR-009, INV-017, "runbook:Top up the vault", "lip:part-5"]

  - id: seed
    group: funding
    title: Launch funding and the first-loss shares
    label: specified
    summary: "How the vault gets its first assets. After the enabling vote, the Growth Committee moves the DAO's first-loss Earn shares to the first-loss Safe. Then one seed motion funds the rest."
    trigger: "The enabling vote has executed and the Safes exist."
    steps:
      - who: "Growth Committee Safe"
        text: "The Growth Committee Safe transfers the first-loss earnETH and earnUSD shares to the [[first-loss Safe]]. That Safe needs no permission to receive them."
        nodes: [funding, first-loss]
      - who: "Operator Safe"
        text: "The operator Safe creates the seed motion. It is at most one TM Floor Value, less the value of the first-loss shares."
        nodes: [operator-safe, easytrack, funding]
        edges: [motions, topup-motion]
      - who: "Easy Track and Aragon Finance"
        text: "After 72 hours, Aragon Finance pays the Asset Safe through the funding registries."
        nodes: [easytrack, funding, asset-safe, dao]
        edges: [treasury, topup]
      - who: "The DAO"
        text: "From then on, only a DAO vote can burn or redeem the first-loss shares. No role can reach the first-loss Safe, and monitoring alerts on any change of its balance."
        nodes: [dao, first-loss, monitoring]
        edges: [first-loss-shares]
        check: "INV-021: the first-loss Safe has the Agent as its only owner and no module."
    sources: [ADR-008, OD-21, OD-28, OD-42, INV-021, "runbook:Move the legacy Earn shares", "runbook:Burn first-loss Earn shares"]

  # --- Reporting and monitoring -------------------------------------------------------------------
  - id: fortnightly
    group: reporting
    title: The fortnightly snapshot
    label: specified
    summary: "Every two weeks, a reading of the vault at a pinned block drives two things: the budget retune, and the published cap reading."
    trigger: "Every two weeks."
    steps:
      - who: "Monitoring"
        text: "Monitoring runs the report generator at the snapshot's pinned block."
        nodes: [monitoring, reporting, asset-safe]
        edges: [report]
      - who: "Monitoring"
        text: "It publishes the cap ratios to IPFS."
        nodes: [monitoring, reporting]
      - who: "Committee"
        text: "If a cap is breached, the committee rebalances within two working days."
        nodes: [committee, operator-safe]
        edges: [signers-op]
      - who: "Committee"
        text: "Where a budget no longer fits, the committee retunes it by motion."
        nodes: [operator-safe, easytrack]
        edges: [motions]
    sources: [ADR-009, OD-32, "lip:part-9"]

  - id: monthly-report
    group: reporting
    title: The monthly report
    label: specified
    summary: "The committee publishes a report within seven calendar days after month-end. Anyone can run the generator again and check it."
    trigger: "Month-end."
    time: "Within 7 calendar days."
    steps:
      - who: "Report generator"
        text: "The generator reads the chain at a pinned block, with Coingecko prices at the Snapshot Date."
        nodes: [reporting, asset-safe]
        edges: [report]
      - who: "Committee"
        text: "The committee reviews the report and publishes it on IPFS."
        nodes: [committee, reporting]
      - who: "Committee"
        text: "The forum post cites the report's IPFS identifier. It is the report's only anchor."
        nodes: [reporting]
      - who: "Monitoring"
        text: "If the report is late, no top-up starts. Monitoring flags it on day 8, and the committee explains the delay on the forum."
        nodes: [monitoring, funding]
    sources: [ADR-009, OD-14, "lip:part-9"]

  - id: buffer-low
    group: reporting
    title: The liquidity buffer runs low
    label: specified
    summary: "The vault keeps at least one month of baseline spend in stablecoins and sUSDS. A detector watches it all the time, and the committee restores it within the mandate's window."
    trigger: "The buffer falls toward its floor, for example after a large deposit or a missed top-up."
    time: "The mandate's window."
    steps:
      - who: "Monitoring"
        text: "The buffer detector warns at a margin above the floor, and alerts at the floor."
        nodes: [monitoring, asset-safe]
        edges: [watch]
      - who: "[the screening vendor]"
        text: "If the vendor can check it, screening refuses an operator transaction that would take the buffer below its floor."
        nodes: [screening, operator-safe]
        edges: [screen]
        check: "Requested from the vendor, not confirmed."
      - who: "Committee"
        text: "The committee restores the buffer: it exits a position, or sells through a CoW order into a stablecoin."
        nodes: [committee, operator-safe, operator-modifier, asset-safe, protocols, orders]
        edges: [signers-op, op-role, own-op, positions, swaps]
      - who: "Reporting"
        text: "Every report shows the buffer against its floor, and the Zodiac UI is asked to show it too."
        nodes: [reporting, policy]
    sources: [ADR-009, OD-40, OD-44, "runbook:Restore the liquidity buffer", "doc:docs/specs/control-matrix.md#the-matrix"]

  # --- Emergencies --------------------------------------------------------------------------------
  - id: financial-incident
    group: emergencies
    title: "A financial incident: stop and pull back"
    label: built
    summary: "A depeg, a curator failure or a protocol compromise. The emergency Safe acts through the safety modifier at 2 of 7, and no guard screens it. Each step only reduces exposure."
    trigger: "An alert, or a signer sees the risk."
    time: "Initiate within 6 hours: the mandate's ceiling. Drills must prove it."
    steps:
      - who: "Lido incident process"
        text: "The alert pages the signers."
        nodes: [monitoring, committee]
      - who: "Emergency Safe, 2 of 7"
        text: "Revoke the operator's targets or functions. One revoke reaches every operator permission on the operator modifier; the orders operator modifier needs one more, once it exists."
        nodes: [emergency-safe, safety-modifier, operator-modifier]
        edges: [em-role, revoke]
        check: "INV-018: every operator permission is under one key."
      - who: "Emergency Safe"
        text: "Set the operator's approvals to zero."
        nodes: [emergency-safe, safety-modifier, asset-safe, protocols]
        edges: [em-role, own-sf, positions]
      - who: "Emergency Safe"
        text: "Exit positions into the Asset Safe: cancel, claim and redeem on Earn, redeem sUSDS, claim finalized withdrawals."
        nodes: [safety-modifier, asset-safe, protocols]
        edges: [own-sf, positions]
      - who: "Emergency Safe"
        text: "Send assets home to the Aragon Agent. The transfer goes only to this fixed address."
        nodes: [safety-modifier, asset-safe, dao]
        edges: [own-sf, own]
        check: "INV-002: assets leave only for the Agent, or for the orders account once it exists."
      - who: "Committee"
        text: "Post on the forum after the revoke."
        nodes: [committee, reporting]
    escapes:
      - "A queued motion would restore a revoked permission: the Emergency Brakes multisig pauses Easy Track."
      - "No recovery order can fill at a price that the signers accept: send the assets to the Agent instead."
    sources: [ADR-005, ADR-007, INV-002, INV-018, "test:test_D4_emergency_flow", "test:test_emergency_can_durably_stop_operator_reapproval", "runbook:Revoke the operator", "runbook:Zero the approvals", "runbook:Exit positions to the Safe", "runbook:Return assets to the Agent"]

  - id: recovery-order
    group: emergencies
    title: A recovery order
    label: specified
    summary: "When an asset must become a stablecoin in an emergency. The emergency Safe sends it to the orders account and places an order that buys USDC or USDT and pays the Aragon Agent."
    trigger: "An incident where holding the asset is the risk, for example a depeg."
    time: "Initiate within 6 hours. A recovery order lives at most 1 day, and the emergency Safe signs a new one if it does not fill. The order names its own limit, so it can fill in a depeg at a price that the signers accept."
    steps:
      - who: "Emergency Safe"
        text: "Exit the position into the Asset Safe if needed. Native ETH is staked first; wstETH, WETH and sUSDS can be sold as they are."
        nodes: [emergency-safe, safety-modifier, asset-safe, protocols]
        edges: [em-role, own-sf, positions]
      - who: "Emergency Safe"
        text: "Transfer the asset to the orders account. The policy pins the recipient."
        nodes: [safety-modifier, asset-safe, orders]
        edges: [own-sf, swaps]
        check: "Specified: the orders account is not in the policy yet."
      - who: "Emergency Safe"
        text: "Place a [[recovery order]] that buys USDC, or USDT as the second destination, and pays the Aragon Agent. No guard screens it, and nothing on chain bounds its price, so every emergency swap pages at high severity."
        nodes: [emergency-safe, orders]
        check: "INV-014: the emergency role's orders buy only USDC or USDT and pay only the Aragon Agent. CoW's EBBO rule holds the fill to the on-chain market, and monitoring alerts on a limit far below a market price (OD-48)."
      - who: "CoW Protocol"
        text: "CoW settles, and the proceeds go straight to the Aragon Agent. If the order does not fill, the emergency Safe cancels it and sends the tokens to the Agent."
        nodes: [orders, dao]
        check: "USDS and DAI carry USDC risk, so recovery can buy USDT when USDC is the problem."
    sources: [ADR-007, OD-26, OD-43, OD-47, OD-48, INV-014, INV-024, "runbook:Recovery order", "runbook:Cancel orders and sweep the orders account"]

  - id: technical-defect
    group: emergencies
    title: A defect in the permission layer
    label: built
    summary: "If the operator's permissions themselves are wrong, the Emergency Brakes multisig switches the operator modifier off. The safety modifier keeps working."
    trigger: "A defect in the policy, the modifier or a factory, for example a bug-bounty report."
    time: "Initiate within 6 hours."
    steps:
      - who: "Lido incident process"
        text: "The incident process pages the Emergency Brakes multisig."
        nodes: [monitoring, brakes]
        edges: [page]
      - who: "Emergency Brakes multisig, 3 of 5"
        text: "The multisig calls `disableModule` on the Asset Safe through the technical role. The module argument is pinned to the operator modifier. It does the same on the orders account for the orders operator modifier."
        nodes: [brakes, safety-modifier, asset-safe, orders]
        edges: [tech-role, own-sf]
        check: "Built for the Asset Safe. Specified for the orders account."
      - who: "Operator modifier"
        text: "The operator and governance roles stop at once."
        nodes: [operator-modifier, operator-safe, easytrack]
      - who: "Emergency Safe"
        text: "The emergency Safe can still act through the safety modifier."
        nodes: [emergency-safe, safety-modifier]
        edges: [em-role]
      - who: "LDO holders"
        text: "Only the DAO can enable the operator modifier again."
        nodes: [dao, asset-safe]
        edges: [own]
    sources: [ADR-005, INV-009, "test:test_D4_module_disabling_is_technical_only_and_pinned", "runbook:Disable the operator modifier"]

  - id: cap-breach
    group: emergencies
    title: A cap breach that gets worse
    label: specified
    summary: "No contract reverts on a cap. Monitoring publishes the breach, the committee fixes it, and the Emergency Brakes multisig stops the operator if the breach gets worse."
    trigger: "A fortnightly cap reading shows a breach."
    time: "Two working days to fix, then the next fortnightly snapshot."
    steps:
      - who: "Monitoring"
        text: "Monitoring publishes the cap reading to IPFS. The reading shows a breach."
        nodes: [monitoring, reporting]
      - who: "Committee"
        text: "The committee has two working days to rebalance."
        nodes: [committee, operator-safe]
        edges: [signers-op]
      - who: "Monitoring"
        text: "At the next fortnightly snapshot, the breach is still there and larger. Monitoring pages the Emergency Brakes multisig and links the reading."
        nodes: [monitoring, brakes]
        edges: [page]
      - who: "Emergency Brakes multisig"
        text: "The multisig disables the operator modifier. The trigger is fixed, so no financial judgment is needed."
        nodes: [brakes, safety-modifier, asset-safe, operator-modifier]
        edges: [tech-role, own-sf]
    sources: [ADR-009, ADR-005, OD-29, OD-32]

  - id: vendor-outage
    group: emergencies
    title: "[the screening vendor] stops approving"
    label: specified
    summary: "The guard fails closed. The operator stops, and no new motion can start. Recovery does not change."
    trigger: "The vendor's service is down or refuses everything."
    time: "Up to 10 days, the guard's removal timelock."
    steps:
      - who: "Guard"
        text: "Operator transactions and new motions revert, because no approval arrives."
        nodes: [screening, operator-safe]
        edges: [screen]
      - who: "Emergency Safe and Emergency Brakes multisig"
        text: "Both act as before. Nothing screens them."
        nodes: [emergency-safe, brakes, safety-modifier]
        edges: [em-role, tech-role]
      - who: "Operator Safe owners"
        text: "The owners can start the guard's removal. It takes 10 days, and monitoring sees it."
        nodes: [operator-safe, screening, monitoring]
      - who: "LDO holders"
        text: "The DAO can also give the operator role to another Safe by vote."
        nodes: [dao, asset-safe]
        edges: [own]
    sources: [ADR-010, "runbook:Remove the screening guard", "runbook:Replace the operator Safe"]

  - id: unsafe-motion
    group: emergencies
    title: An unsafe motion in the queue
    label: specified
    summary: "Three stops before a motion enacts, and one after."
    trigger: "A motion looks wrong: a bad target, a wrong amount or a missing disclosure."
    time: "Before the 72-hour window ends."
    steps:
      - who: "Monitoring and the forum"
        text: "The motion-lifecycle alert and the forum disclosure show the motion."
        nodes: [monitoring, easytrack, reporting]
      - who: "LDO holders"
        text: "LDO holders object within 72 hours. An objection of 0.5% of LDO stops the motion."
        nodes: [dao, easytrack]
        edges: [object]
      - who: "Emergency Brakes multisig"
        text: "If time is short, the multisig pauses Easy Track. This stops every DAO motion, and only the DAO can unpause it."
        nodes: [brakes, easytrack]
        edges: [pause]
      - who: "Emergency Safe"
        text: "If the motion enacts, the emergency Safe revokes the new permission at once."
        nodes: [emergency-safe, safety-modifier, operator-modifier]
        edges: [em-role, revoke]
    sources: [ADR-006, ADR-005, "test:test_D1_objection_rejection", "runbook:Pause Easy Track"]

  # --- Building, deploying and changing ------------------------------------------------------------
  - id: policy-change
    group: deployment
    title: A policy change, from code to chain
    label: built
    summary: "How a permission changes. The repository is the only place where the policy changes, and a reviewer can run every check again."
    trigger: "A decision that changes a permission."
    steps:
      - who: "An engineer or an agent"
        text: "The author changes the constellation in a pull request."
        nodes: [policy]
      - who: "Compiler and CI"
        text: "The compiler builds the artifact, and the pull request carries both. CI fails when the artifact differs from a fresh compile."
        nodes: [policy]
        tech: "`bun compiler/compile.ts --manifest manifests/fork-25946643.json --check`, in the `policy` CI job."
      - who: "Reviewers"
        text: "Reviewers approve the artifact. The fork tests apply it and check what each role can and cannot do."
        nodes: [policy]
      - who: "`@lidofinance/defi-tech`"
        text: "After the merge, a team member pushes the policy to the Lido Zodiac workspace. The UI shows the difference from the chain."
        nodes: [policy]
        check: "The workspace is planned (OD-35)."
      - who: "The DAO or a motion"
        text: "The change reaches the chain only through the enabling vote, a DAO vote or a bounded motion."
        nodes: [dao, easytrack, operator-modifier, safety-modifier, asset-safe]
        edges: [own, own-op, own-sf, gov-role]
      - who: "Monitoring"
        text: "Later, the round-trip check and the drift detector compare the chain with the artifact."
        nodes: [policy, monitoring, asset-safe]
        edges: [watch]
        check: "INV-016 is pending."
    sources: [ADR-004, OD-33, OD-35, INV-016, "doc:.github/workflows/policy.yml", "doc:docs/specs/specification-policy.md#the-permission-policy"]

  - id: roadmap
    group: deployment
    title: From decisions to deployment
    label: planned
    summary: "The roadmap's phases, in order. A phase starts when the gates of the phase before it close. The Status tab shows where the work is now."
    trigger: "The roadmap."
    steps:
      - who: "Phase 0: decisions"
        text: "The Emergency Brakes multisig verifies ADR 005 to ADR 011, and EM accepts them. [the screening vendor] confirms its terms in writing."
        nodes: [brakes, committee, screening]
      - who: "Phase 1: specification"
        text: "The specifications, the runbook drafts, the detector specification and the Lido Zodiac workspace."
        nodes: [policy, monitoring]
      - who: "Phase 2: build"
        text: "The round-trip check, the orders account and the first-loss Safe, the factories, the funding path, the report generator and the buffer detector."
        nodes: [policy, orders, first-loss, easytrack, funding, reporting, monitoring]
      - who: "Phase 3: assurance"
        text: "An external audit, Lido's review of the guard change and of CoW's order signer, and fork drills that initiate within 6 hours."
        nodes: [policy, screening, orders]
      - who: "Phase 4: governance and deployment"
        text: "The mandate's Snapshot vote, the LIP, the enabling vote and deployment, the share transfer to the first-loss Safe and the seed motion."
        nodes: [dao, asset-safe, first-loss, funding]
      - who: "Phase 5: operation"
        text: "Fortnightly retunes, monthly reports and recurring drills."
        nodes: [committee, reporting, monitoring]
    sources: ["doc:ROADMAP.md#roadmap", "doc:ROADMAP.md#standing-gates"]

  - id: enabling-vote
    group: deployment
    title: The enabling vote
    label: open
    summary: "One DAO vote turns the system on. No document gives the full sequence of deployment and vote yet. These steps collect what the decisions already fix."
    trigger: "The mandate is approved and phase 3 is done."
    steps:
      - who: "Lido"
        text: "Before the vote, fork tests show that CoW's order signer and fallback handler work on Safe v1.5.0 behind a Roles modifier."
        nodes: [orders]
        check: "INV-022 and INV-023 are pending."
      - who: "[the screening vendor]"
        text: "The guard is set on the operator Safe, with bypass mode off. This is checked when the vote starts and watched until it executes."
        nodes: [screening, operator-safe]
        edges: [screen]
      - who: "Lido"
        text: "Safe's releases, advisories and bug-bounty records are checked again shortly before the vote."
        nodes: [asset-safe, operator-safe, emergency-safe]
      - who: "LDO holders"
        text: "The vote applies the committed artifact, grants the roles, sets up the orders account with its relayer approvals, registers the factories and adds USDS to the payment permission."
        nodes: [dao, asset-safe, operator-modifier, safety-modifier, orders, easytrack, funding]
        edges: [own, own-op, own-sf]
      - who: "Growth Committee, then the operator Safe"
        text: "After the vote, the Growth Committee moves the first-loss shares to the first-loss Safe, and the seed motion funds the vault."
        nodes: [funding, first-loss, asset-safe, operator-safe, easytrack]
        edges: [topup, motions]
    sources: [ADR-004, ADR-007, ADR-008, ADR-010, INV-022, INV-023, "doc:ROADMAP.md#roadmap"]

  - id: signer-rotation
    group: deployment
    title: Rotating a signer
    label: specified
    summary: "Three Safes carry the committee's signers. Nothing on chain keeps them in step, so a rotation is a manual duty."
    trigger: "A signer joins or leaves the committee."
    steps:
      - who: "Committee"
        text: "The committee's Safe changes its owner."
        nodes: [committee]
      - who: "Committee"
        text: "The same change goes to the operator Safe and to the emergency Safe."
        nodes: [committee, operator-safe, emergency-safe]
        edges: [signers-op, signers-em]
      - who: "Monitoring"
        text: "Monitoring alerts on each owner change of the new Safes."
        nodes: [monitoring, operator-safe, emergency-safe]
    sources: [ADR-005, "runbook:Rotate a signer on all three Safes"]
