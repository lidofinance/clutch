# Flows, step by step. Each step highlights map nodes and edges when the flow plays.
# Label: built (built and tested on a fork), specified, open, existing or planned.
groups:
  - id: operations
    title: Everyday operations
    summary: "What the committee does on a normal day. The policy checks every operator transaction before it runs, and so does the [[guard]] once it is set."
  - id: governance
    title: Changing what the operator may do
    summary: "A permission changes by a [[motion]] of the [[universal factory]], after the [[objection window]]. After the enabling vote, no administrative action needs an Aragon vote. A screening rule changes by review and a forum notice."
  - id: funding
    title: Funding, insurance and returns
    summary: "Money comes from the DAO treasury in rare tranches, each an Aragon vote. Insurance money moves from the Asset Safe by motion. Money goes back to the treasury only in an emergency or a recovery."
  - id: reporting
    title: Reporting and monitoring
    summary: "Caps are detective. Monitoring and reports measure the vault, publish the numbers and start the fix. No contract reverts on a cap."
  - id: emergencies
    title: Emergencies
    summary: "Two fast stops and one slow restart. The [[Emergency Safe]] pulls assets back, switches the operator off and makes every open motion fail. The Emergency Brakes multisig pauses Easy Track. Neither restarts what it stopped: a motion does."
  - id: deployment
    title: Building, deploying and changing the system
    summary: "How the policy changes, how the system goes live, and the duties that keep it in step."

flows:
  # --- Everyday operations ----------------------------------------------------------------------
  - id: op-tx
    group: operations
    title: An operator transaction
    label: built
    summary: "How the committee changes a position, for example a USDS deposit into sUSDS."
    trigger: "The committee decides to change a position within the mandate."
    time: "Minutes."
    steps:
      - who: "Committee Safe signers, 4 of 7"
        text: "The signers build the transaction in the Zodiac UI or with local tooling. It calls the operator modifier with the operator role."
        nodes: [committee]
        tech: "The call is `execTransactionWithRole` on the operator modifier, with the role key `bytes32(\"operator\")`. A batch goes through Safe's MultiSendCallOnly v1.3.0, the version of the committee's Safe."
      - who: "[the screening vendor]"
        text: "Once the [[guard]] is set, the vendor approves the exact transaction on chain, once. Without the approval, the committee's Safe refuses it."
        nodes: [screening, committee]
        edges: [screen]
        check: "INV-010 is pending: the harness has no guard yet."
      - who: "Operator modifier"
        text: "The modifier refuses anything that the policy does not list. An approval spends its spender's [[budget key]]."
        nodes: [committee, operator-modifier]
        edges: [op-role]
      - who: "Asset Safe"
        text: "The modifier runs the call as the Asset Safe, and the protocol pays any proceeds or claims to it."
        nodes: [operator-modifier, asset-safe, protocols]
        edges: [own-op, positions]
        check: "INV-003: every receiver, owner and beneficiary is the Asset Safe."
      - who: "Monitoring"
        text: "Monitoring records the change: approvals, budget burn and positions."
        nodes: [monitoring, asset-safe]
        edges: [watch]
        check: "The vault's detectors are not built."
    escapes:
      - "The vendor or the policy refuses: nothing runs."
      - "A problem shows after the call: the emergency Safe revokes the operator at once."
    sources: ["ADR-006#d7", "ADR-006#d8", "ADR-006#d14", "ADR-005#proposed-direction", "ADR-010#d1",
      "ADR-010#d4", "ADR-010#d9", "ADR-010#d17", "ADR-010#d20", "ADR-010#d22", "ADR-009#d13",
      "ADR-009#proposed-direction", "INV-003", "INV-010", "test:test_D3_operator_lifecycle",
      "test:test_D3b_earn_deposit_policy_layer", "ADR-005#d31", "OD-54", "OD-83"]

  - id: swap-order
    group: operations
    title: A market or limit order
    label: built
    summary: "How the vault swaps one token for another: a CoW order from the [[orders account]] that pays the Asset Safe."
    trigger: "The committee wants a different mix of assets, for example less stETH and more USDC, now or at a set price."
    time: "A market order fills in minutes. A limit order can stand for up to 90 days."
    steps:
      - who: "Operator"
        text: "The operator transfers the token from the Asset Safe to the orders account, under that token's orders budget."
        nodes: [committee, operator-modifier, asset-safe, orders]
        edges: [op-role, own-op, swaps]
      - who: "Committee Safe"
        text: "On the orders account, the committee's Safe signs a market or [[limit order]] through CoW's order signer. The guard, once set, screens it."
        nodes: [committee, screening, orders]
        edges: [screen]
        check: "INV-022: the order's receiver is the Asset Safe."
        tech: "A delegatecall to `signOrder(order, validDuration, feeAmountBP)` on the order signer. The policy pins the sell and buy tokens to the operator's lists, the receiver to the Asset Safe, plain ERC-20 balances, `validDuration` to the maximum order life, and the signed fee, the fee bound and the app data to zero, so the order carries no hooks and no partner fee. CoW charges its fees within the order's limit."
      - who: "CoW Protocol"
        text: "CoW's solvers fill the order at its limit or better, and the settlement pays the Asset Safe."
        nodes: [orders, asset-safe]
        edges: [swaps]
      - who: "Monitoring"
        text: "Monitoring checks the fill against a market price. At 30 days it asks the committee to confirm or cancel each open order."
        nodes: [monitoring, orders]
      - who: "Operator"
        text: "The operator can cancel an unfilled order with `unsignOrder`. Unused tokens go back to the Asset Safe."
        nodes: [orders, asset-safe]
        edges: [swaps]
    escapes:
      - "The vendor refuses the order: nothing runs."
      - "A fill comes in far below the market: monitoring alerts, and the emergency Safe can cancel the open orders and sweep the account."
    sources: ["ADR-007#d18", "ADR-007#d26", "ADR-007#d29", "ADR-007#proposed-direction", "INV-013",
      "INV-022", "INV-024", "runbook:Re-affirm open orders", "runbook:Cancel orders on a policy change",
      "doc:docs/research/cow-orders-account-2026-10-06.md#the-cow-order-signer", "ADR-007#d41",
      "doc:docs/research/orders-account-fork-tests-2026-11-07.md#the-fork-tests",
      "test:test_orders_signer_order_settles_to_the_asset_safe",
      "test:test_orders_funding_from_the_asset_safe", "ADR-007#d42", "ADR-007#d43",
      "test:test_orders_signer_refusals"]

  - id: standing-order
    group: operations
    title: A TWAP order
    label: built
    summary: "How the vault buys or sells over time: a [[TWAP]] order, which ComposableCoW holds."
    trigger: "The committee wants to average into a position over weeks."
    time: "Until the last part fills or the order expires."
    steps:
      - who: "Operator"
        text: "The operator funds the orders account from the Asset Safe, under the orders budget."
        nodes: [committee, operator-modifier, asset-safe, orders]
        edges: [op-role, own-op, swaps]
      - who: "Committee Safe"
        text: "The committee's Safe creates the order on ComposableCoW. It starts at once and ends within 90 days. The guard, once set, screens it."
        nodes: [committee, screening, orders]
        edges: [screen]
        check: "INV-022: the receiver is the Asset Safe. A part settles through the Safe's EIP-1271 check."
        tech: "`ComposableCoW.createWithContext` with a start of zero and CoW's current-timestamp value factory, so the order starts at its creation, the handler pinned to the deployed TWAP handler, and zero app data. A TWAP order has at most 90 parts at most a day apart, or 12 parts at most 7 days apart (INV-024). The orders account's fallback handler is CoW's `ExtensibleFallbackHandler`, and ComposableCoW verifies CoW's settlement domain for it (INV-023)."
      - who: "CoW's watch-tower"
        text: "The [[watch-tower]] posts each part when it is due."
        nodes: [orders]
        check: "CoW's own service: the fork tests build the part with ComposableCoW instead."
      - who: "CoW Protocol"
        text: "Each part fills at its minimum or better, and pays the Asset Safe."
        nodes: [orders, asset-safe]
        edges: [swaps]
      - who: "Monitoring"
        text: "Monitoring checks each fill, and alerts when a part is not posted on time."
        nodes: [monitoring, orders]
    escapes:
      - "The watch-tower stops: the committee can remove the orders with `remove` and place ordinary orders."
      - "The emergency Safe can cancel every open order and sweep the orders account."
    sources: ["ADR-007#d17", "ADR-007#d18", "ADR-007#d24", "ADR-007#d29", "ADR-007#proposed-direction",
      "INV-022", "INV-023", "INV-024", "runbook:Re-affirm open orders",
      "doc:docs/research/cow-orders-account-2026-10-06.md#conditional-orders-twap-and-stop-loss",
      "ADR-007#d39", "OD-79", "doc:docs/research/orders-account-fork-tests-2026-11-07.md#the-fork-tests",
      "test:test_orders_twap_part_settles_through_the_fallback_handler", "ADR-007#d42"]

  # --- Governance ---------------------------------------------------------------------------------
  - id: onboard
    group: governance
    title: Onboarding a new protocol by motion
    label: specified
    summary: "How the committee adds a protocol without a DAO vote: a motion of the universal factory, which builds the permission from a typed [[shape]]."
    trigger: "The committee wants a new target, for example Lido Lend after its launch."
    time: "At least 72 hours, then enactment."
    steps:
      - who: "Committee"
        text: "The committee posts a disclosure on the forum. It sets up monitoring for the new target and updates the runbooks."
        nodes: [committee, reporting, monitoring]
      - who: "Committee Safe"
        text: "The committee's Safe creates the motion with a shape and its typed values only, such as a target, an asset and a budget. The motion names the [[version]] of each scope that it writes, and the [[motion counter]]. The guard, once set, screens this transaction."
        nodes: [committee, screening, easytrack]
        edges: [motions, screen]
        check: "INV-034: a motion widens a permission only through a shape."
      - who: "LDO holders"
        text: "The motion waits 72 hours. If holders of 0.5% of LDO object, it fails."
        nodes: [dao, easytrack]
        edges: [object]
      - who: "Easy Track"
        text: "At enactment, Easy Track rebuilds the script through the factory and requires the hash stored at creation, so the factory checks the versions and the counter again."
        nodes: [easytrack]
        check: "INV-005, tested on a mock Easy Track. INV-033, tested on a fork with the factory's prototype and the live Easy Track."
      - who: "Governance role"
        text: "The motion's one call reaches the factory, which writes the new operator permission through the governance role. The modifier checks this write too."
        nodes: [easytrack, operator-modifier]
        edges: [gov-role]
        check: "INV-004: the Asset Safe and every module of it are refused as targets (OD-38)."
      - who: "Exit-governance role"
        text: "The same motion gives the emergency role the new target's exits on the safety modifier. In the same call the factory stores the new versions, before it writes."
        nodes: [easytrack, safety-modifier]
        check: "INV-025: this role writes only the emergency role's exits, each tree pinned whole. The role is built. The orders token operation writes a token's exit; the other shapes are not built (OD-49)."
      - who: "Operator, and the emergency Safe if needed"
        text: "The operator can use the new permission. The emergency Safe can revoke it at once."
        nodes: [committee, operator-modifier, emergency-safe, safety-modifier]
        edges: [op-role, em-role, revoke]
    escapes:
      - "Before enactment, an objection, the committee's own cancel, a pause of Easy Track or a raise of the motion counter stops the motion."
      - "After enactment, the emergency Safe revokes the new operator permission at once. Only a DAO vote replaces a write to the safety modifier."
    sources: ["ADR-006#d2", "ADR-005#d31", "ADR-010#d24", "ADR-006#d4", "ADR-006#d8", "ADR-006#d9",
      "ADR-006#d10", "ADR-006#d11", "ADR-006#d13", "ADR-006#context", "ADR-013#d2", "ADR-013#d5",
      "ADR-013#d6", "ADR-013#d7", "ADR-013#d9", "ADR-013#d10", "ADR-013#proposed-direction", "ADR-007#d41",
      "INV-004", "INV-005", "INV-025", "INV-033", "INV-034", "OD-38", "OD-49", "OD-103", "lip:part-4",
      "test:test_D1_substituted_script_rejected_at_enactment", "runbook:Raise the motion counter",
      "test:test_uf_same_scope_conflict_the_first_enactment_wins",
      "test:test_uf_counter_fails_every_open_motion"]

  - id: budget
    group: governance
    title: A budget motion
    label: specified
    summary: "How a [[budget key]] changes. There is no routine retune: the committee files a budget motion only after an event."
    trigger: "An event: a new mandate size, a new spender, a product's unlock, or the setting of the guard. A price move is not an event."
    time: "72 hours."
    steps:
      - who: "Committee"
        text: "The attested computation derives the key's new budget, under that key's [[ceiling]]. The forum post names the event."
        nodes: [committee, asset-safe]
      - who: "Committee Safe"
        text: "The committee's Safe creates a budget motion. One motion can set several keys. The guard, once set, screens it."
        nodes: [committee, screening, easytrack]
        edges: [motions, screen]
      - who: "Easy Track"
        text: "After the objection window, the universal factory sets the budget through the governance role. The refill period stays at 30 days or more."
        nodes: [easytrack, operator-modifier, dao]
        edges: [gov-role, object]
        check: "INV-012: the 30-day floor is tested on the modifier. The factory's prototype also holds each budget within its token's ceiling, at stand-in figures; the real ceilings wait for the attested figures."
      - who: "Monitoring"
        text: "Monitoring flags every budget motion, and checks that its forum post names an event."
        nodes: [monitoring]
    sources: ["ADR-009#d3", "ADR-009#d15", "ADR-009#d31", "ADR-009#d45", "ADR-009#proposed-direction",
      "ADR-009#consequences", "ADR-013#d9", "ADR-013#d13", "INV-011", "INV-012", "INV-036", "OD-105",
      "lip:part-7", "test:test_D1_budget_motion_cannot_shorten_the_refill_period", "OD-54",
      "test:test_uf_budget_stays_within_its_ceiling"]

  - id: ceiling
    group: governance
    title: A ceiling motion
    label: specified
    summary: "How a [[ceiling]] changes: a motion lowers it at any time, or raises it at most twofold, at most once in 15 days."
    trigger: "A budget or an approval needs more room under its ceiling, or the committee wants less."
    time: "72 hours."
    steps:
      - who: "Committee"
        text: "The committee posts the change on the forum, with its reason."
        nodes: [committee, reporting]
      - who: "Committee Safe"
        text: "The committee's Safe creates a ceiling motion. The guard, once set, screens it."
        nodes: [committee, screening, easytrack]
        edges: [motions, screen]
      - who: "LDO holders"
        text: "LDO holders can object in the [[objection window]]."
        nodes: [dao, easytrack]
        edges: [object]
      - who: "Universal factory"
        text: "At creation and again at enactment, the factory refuses a raise above twice the ceiling, and a second raise of that ceiling within 15 days. It keeps the time of each raise."
        nodes: [easytrack]
        check: "INV-036, tested on a fork with the factory's prototype, a new token's first ceilings included (OD-113)."
      - who: "Monitoring"
        text: "Monitoring alerts on every ceiling motion."
        nodes: [monitoring, easytrack]
    escapes:
      - "An objection or a raise of the motion counter stops the motion, and the ceiling stays as it is."
    sources: ["ADR-013#d13", "ADR-013#d10", "ADR-013#context", "ADR-013#proposed-direction", "ADR-009#d14",
      "ADR-011#d8", "INV-036", "OD-113", "ADR-013#d15", "runbook:Change a ceiling",
      "test:test_uf_ceiling_rises_at_most_twofold_once_in_15_days",
      "test:test_uf_a_new_token_is_introduced_with_its_ceilings", "test:test_uf_a_token_is_introduced_once"]

  - id: orders-token
    group: governance
    title: A new token for the orders account
    label: built
    summary: "How a token joins the operator's order lists, on the sell side and the buy side, by one motion."
    trigger: "The committee wants to sell or buy a token that is not on its lists."
    time: "72 hours."
    steps:
      - who: "Committee"
        text: "The committee posts a disclosure on the forum, and sets up monitoring for the token."
        nodes: [committee, reporting, monitoring]
      - who: "Committee Safe"
        text: "The committee's Safe creates the motion, with the shape of the orders account's token lists. The guard, once set, screens it."
        nodes: [committee, screening, easytrack]
        edges: [motions, screen]
      - who: "LDO holders"
        text: "LDO holders can object in the [[objection window]]."
        nodes: [dao, easytrack]
        edges: [object]
      - who: "Easy Track"
        text: "In the motion's one call, the universal factory writes the token into the order lists through the orders modifier's governance role, with its emergency transfer, its recovery orders and the operator's return of it to the Aragon Agent. It approves CoW's vault relayer through the approvals role, and writes the token's exit from the Asset Safe through the exit-governance role (ADR 007, decision 45)."
        nodes: [easytrack, orders]
        check: "INV-040: the governance role grants delegatecall only to the order signer and pins whole the trees that do not depend on the token; the approvals role approves only CoW's vault relayer. The motion runs through the live Easy Track, under EIP-7825's gas cap (OD-118)."
      - who: "Operator"
        text: "The operator can now sell or buy the token in market, limit and TWAP orders that pay the Asset Safe."
        nodes: [committee, asset-safe, orders]
        edges: [swaps]
    escapes:
      - "The emergency Safe can set the token's relayer approval to zero at once. Only a motion raises it again."
    sources: ["ADR-007#d41", "ADR-007#d22", "ADR-007#proposed-direction", "ADR-013#d8",
      "ADR-013#proposed-direction", "ADR-014#proposed-direction", "ADR-006#d4", "INV-008", "INV-040",
      "runbook:Cancel orders and sweep the orders account", "test:test_orders_motion_adds_a_token",
      "test:test_orders_approvals_role_approves_only_the_relayer", "OD-118",
      "test:test_factory_orders_token_motion", "ADR-013#d18"]

  - id: dao-change
    group: governance
    title: A change that only the DAO can make
    label: built
    summary: "The owner path: the DAO can do anything to the vault's Safes. After the enabling vote, an Aragon vote is needed only to fund a tranche, to replace a role holder, or to break glass."
    trigger: "A role holder to replace, such as a new committee Safe in the operator role; a repair of the safety modifier or another owner action; a shape that the universal factory lacks; or an Easy Track unpause."
    time: "About five days: the Aragon Voting vote."
    steps:
      - who: "LDO holders"
        text: "LDO holders vote in Aragon Voting."
        nodes: [dao]
      - who: "Aragon Voting"
        text: "Aragon Voting sends the Asset Safe transaction itself, or approves it by hash, as the only owner. Nothing passes Dual Governance."
        nodes: [dao, asset-safe]
        edges: [own]
      - who: "Asset Safe"
        text: "The Asset Safe runs the change, for example a new policy on both modifiers."
        nodes: [asset-safe, operator-modifier, safety-modifier]
        edges: [own-op, own-sf]
    sources: ["ADR-005#d14", "ADR-005#context", "ADR-005#proposed-direction", "ADR-013#d3", "ADR-013#d4",
      "ADR-013#proposed-direction", "INV-001", "INV-032", "test:test_D2_direct_DAO_path",
      "runbook:Move the operator role to another Safe", "runbook:Replace the operator modifier",
      "ADR-005#d28"]

  - id: unlock
    group: governance
    title: Unlocking a matured Lido product
    label: specified
    summary: "A [[new Lido product]], Lido Lend first, counts against the protocol cap until it matures. A budget motion with a forum post unlocks it."
    trigger: "The product meets the maturity criteria in the mandate."
    time: "72 hours."
    steps:
      - who: "Committee"
        text: "The committee posts on the forum which maturity criteria the product meets."
        nodes: [committee, reporting]
      - who: "Committee Safe"
        text: "The committee's Safe creates a budget motion that raises the product's budget key. The guard, once set, screens it."
        nodes: [committee, screening, easytrack]
        edges: [motions, screen]
      - who: "LDO holders"
        text: "LDO holders can object in the [[objection window]]."
        nodes: [dao, easytrack]
        edges: [object]
      - who: "Easy Track"
        text: "The motion enacts through the governance role. From then on, reports count the product as a Lido product, outside the protocol cap."
        nodes: [easytrack, operator-modifier, reporting]
        edges: [gov-role]
    sources: ["ADR-009#d28", "ADR-006#d11", "ADR-010#d19", "ADR-009#proposed-direction", "ADR-006#d4",
      "ADR-006#context", "runbook:Unlock a matured product"]

  - id: rule-change
    group: governance
    title: Relaxing a screening rule
    label: specified
    summary: "What the chain cannot enforce, screening checks before execution. A rule that gets weaker gets change control, so it cannot loosen quietly."
    trigger: "The committee wants to relax a rule in [the screening vendor]'s service."
    steps:
      - who: "Committee and `@lidofinance/defi-tech`"
        text: "A pull request changes the written list of the vendor's rules in the control matrix. Reviewers approve it."
        nodes: [committee, policy]
      - who: "Committee"
        text: "The committee gives notice on the forum."
        nodes: [committee, reporting]
      - who: "[the screening vendor]"
        text: "The vendor applies the change, after its own delay if it has one."
        nodes: [screening]
    sources: ["ADR-010#d19", "ADR-010#d23", "ADR-010#proposed-direction",
      "doc:docs/specs/control-matrix.md#the-screening-vendors-rules"]

  # --- Funding ------------------------------------------------------------------------------------
  - id: tranche
    group: funding
    title: A tranche vote
    label: specified
    summary: "How money moves from the DAO treasury to the vault: a rare [[tranche vote]], which pays the Asset Safe through Aragon Finance."
    trigger: "The vault needs more funds and has headroom under the mandate size, and the mandate's published eligibility conditions are met."
    time: "About five days: the Aragon Voting vote."
    steps:
      - who: "Committee"
        text: "The committee posts the tranche on the forum: the funded value, the headroom under the mandate size, and the vault's share of the DAO's non-LDO treasury. The post links both readings' latest reports."
        nodes: [committee, reporting]
        check: "The proposer starts no tranche vote while the monthly report is late, while the committee's estimate prices more than the set share of the vault (OD-62), or while Lido's reading and the policy provider's differ by more than the band (OD-84); monitoring alerts on a vote that starts (OD-122)."
      - who: "LDO holders"
        text: "LDO holders vote on the tranche in Aragon Voting. The vote names its tokens."
        nodes: [dao]
      - who: "Aragon Voting and Aragon Finance"
        text: "When the vote executes, Aragon Finance pays the Asset Safe from the Aragon Agent: one payment for each token."
        nodes: [dao, funding, asset-safe]
        edges: [treasury, tranche]
        check: "INV-037: only Aragon Voting moves treasury funds to the vault. Pending: a chain check before the enabling vote."
      - who: "Aragon Voting, for the second tranche"
        text: "The second tranche's vote also lifts the [[launch cap]]. It starts only after the guard is set on the committee's Safe with its bypass mode off, and the check runs until the vote executes."
        nodes: [dao, screening, committee]
        edges: [screen]
      - who: "Reporting"
        text: "Reports count each tranche in US dollars at its value when it is funded."
        nodes: [reporting, asset-safe]
        edges: [report]
    escapes:
      - "LDO holders vote against the tranche: nothing moves."
      - "No motion can pull funds from the treasury, so the vault works with the funds that it has."
    sources: ["ADR-014#d1", "ADR-014#d2", "ADR-014#d3", "ADR-014#context", "ADR-014#proposed-direction",
      "ADR-008#d32", "ADR-008#d33", "ADR-008#d34", "ADR-009#d19", "ADR-009#d21", "ADR-009#d36",
      "ADR-009#d41", "ADR-009#d42", "ADR-010#d22", "OD-62", "OD-84", "INV-037", "runbook:Fund a tranche",
      "lip:part-5", "OD-122"]

  - id: seed
    group: funding
    title: Launch funding and the first-loss shares
    label: specified
    summary: "How the vault gets its first assets: the first tranche, one million dollars, in the enabling vote, and then the DAO's [[first-loss shares]]."
    trigger: "The enabling vote executes."
    steps:
      - who: "Aragon Voting and Aragon Finance"
        text: "The vote's tranche item pays the first tranche to the Asset Safe through Finance. The tokens wait there, under Aragon Voting's control alone, until the Safe batches run."
        nodes: [dao, funding, asset-safe]
        edges: [treasury, tranche]
        check: "The first tranche is the [[launch cap]]."
      - who: "Anyone"
        text: "Anyone sends the Safe batches, which apply the policy and grant the roles."
        nodes: [asset-safe, operator-modifier, safety-modifier, orders, first-loss]
        edges: [own-op, own-sf]
      - who: "Growth Committee Safe"
        text: "The Growth Committee Safe transfers the earnETH and earnUSD shares to the [[first-loss Safe]], which needs no permission to receive them."
        nodes: [funding, first-loss]
      - who: "The committee"
        text: "From then on, on the Earn team's written instruction, a motion burns the shares, or the committee's Safe redeems them to the Asset Safe. Monitoring alerts on any change of the first-loss Safe's balance."
        nodes: [committee, first-loss, monitoring]
        edges: [first-loss-shares]
        check: "INV-021. The rehearsal deploys the first-loss Safe; its modifier's policy is not built."
    sources: ["ADR-014#d2", "ADR-014#d10", "ADR-014#proposed-direction", "ADR-010#d20", "ADR-008#d13",
      "ADR-008#d19", "ADR-008#d21", "ADR-008#d23", "ADR-008#proposed-direction", "ADR-005#d32", "INV-021",
      "runbook:Move the legacy Earn shares", "runbook:Burn first-loss Earn shares", "runbook:Fund a tranche"]

  - id: first-loss-burn
    group: funding
    title: A first-loss burn or exit
    label: specified
    summary: "How the DAO's [[first-loss shares]] absorb a loss, as the March 2026 terms say. The committee executes the terms without a DAO vote: a burn by motion, or an exit through one narrow role."
    trigger: "A loss of at least 1% in earnETH or earnUSD that the curators confirm, or a confirmed material risk."
    time: "A burn: at least 72 hours, the objection window. An exit: minutes to initiate, then the redeem queue."
    steps:
      - who: "Earn team and curators"
        text: "A curator flags the loss, and the vault's curators confirm it. The Earn team instructs the committee in writing: burn up to all of the DAO's shares in that vault, or exit through the vault's normal redemption."
        nodes: [protocols, committee]
        check: "Below 1%, a Snapshot exception comes first, as after the Kelp incident."
      - who: "Committee Safe, 4 of 7"
        text: "For a burn, the committee's Safe creates a burn motion, and the forum post with the instruction goes up with it. For an exit, it requests and claims the redemption through the first-loss role, which pays the Asset Safe. The guard, once set, screens both transactions."
        nodes: [committee, screening, easytrack, first-loss, protocols]
        edges: [screen, motions, first-loss-shares]
        check: "INV-021: only an enacted motion can burn the shares, and no role can transfer or approve them. The first-loss modifier's policy and the burn shape are not built."
      - who: "Easy Track, after 72 hours"
        text: "If LDO holders do not object, anyone enacts the motion. The universal factory calls `burn` on the share token through the first-loss burn role."
        nodes: [easytrack, first-loss, protocols]
        edges: [first-loss-shares]
      - who: "Monitoring"
        text: "Monitoring pages on the motion and on the action, and alerts on the change of the first-loss Safe's balance."
        nodes: [monitoring, easytrack, first-loss]
      - who: "Committee"
        text: "The incident update follows on the forum within seven days. Reports show the first-loss amount less the burn."
        nodes: [committee, reporting]
    escapes:
      - "LDO holders object: the motion fails, and nothing burns. The DAO can still burn by vote, as the Safe's owner."
      - "Depositors see the motion for 72 hours and can time their entries and exits, so the vault should pause deposits and redemptions until the burn, as Lido Earn did after the Kelp incident."
      - "A curator freezes the vault: an exit waits for the vault, and a burn still works."
    sources: ["ADR-008#d14", "ADR-008#d21", "ADR-008#d22", "ADR-008#d23", "ADR-008#context",
      "ADR-008#proposed-direction", "ADR-008#consequences", "ADR-013#d5", "ADR-014#d10",
      "ADR-014#proposed-direction", "INV-021", "runbook:Burn first-loss Earn shares",
      "runbook:Exit the first-loss shares",
      "doc:docs/research/cfo-feedback-2026-10-13.md#the-first-loss-terms", "ADR-009#proposed-direction"]

  - id: insurance
    group: funding
    title: An insurance fund
    label: specified
    summary: "How the vault insures Lido products. Each step is a motion: the creation of a fund, its money from the Asset Safe, a burn and a payout."
    trigger: "The committee decides to insure a product, under the framework that one Snapshot sets."
    time: "72 hours for each motion."
    steps:
      - who: "Committee"
        text: "The committee posts the fund's checklist on the forum."
        nodes: [committee, reporting]
      - who: "Committee Safe"
        text: "The committee's Safe creates the motions: one creates the fund and pins its terms, and one moves its money from the Asset Safe. The guard, once set, screens them."
        nodes: [committee, screening, easytrack]
        edges: [motions, screen]
      - who: "LDO holders"
        text: "LDO holders can object to each motion in its [[objection window]]."
        nodes: [dao, easytrack]
        edges: [object]
      - who: "Easy Track"
        text: "The universal factory moves the tokens from the Asset Safe to the first-loss Safe through the insurance-funding role. For a fund of shares, an insurance role then deposits them into the insured product, with the first-loss Safe as the receiver."
        nodes: [easytrack, operator-modifier, asset-safe, first-loss, protocols]
        edges: [own-op, insure, first-loss-shares]
        check: "INV-039: insurance money reaches the first-loss Safe only by motion, from the Asset Safe. Tested on a fork with the factory's prototype."
      - who: "Committee Safe, then Easy Track"
        text: "After a confirmed loss, a burn motion burns the fund's shares, or a payout motion pays the fund's payout address."
        nodes: [committee, easytrack, first-loss, protocols]
        edges: [motions, first-loss-shares]
        check: "INV-039: a payout goes only to the address that the creating motion pinned, at most the fund's remaining cap, and only by motion."
      - who: "Monitoring"
        text: "Monitoring alerts on every change of the first-loss Safe's balance."
        nodes: [monitoring, first-loss]
    escapes:
      - "An exit from a fund pays the Asset Safe, not the treasury."
    sources: ["ADR-014#d4", "ADR-014#d5", "ADR-014#d6", "ADR-014#d7", "ADR-014#d10",
      "ADR-014#proposed-direction", "ADR-008#d25", "ADR-008#d26", "ADR-008#d29",
      "ADR-005#proposed-direction", "ADR-009#proposed-direction", "INV-039",
      "runbook:Run an insurance motion", "test:test_uf_insurance_money_goes_to_the_first_loss_safe"]

  - id: return-to-agent
    group: funding
    title: Returning funds to the treasury
    label: specified
    summary: "Funds go back to the Aragon Agent only in an emergency or a recovery. The emergency Safe or the committee's Safe sends them, by a transfer pinned to the Agent, with no motion and no vote: a return to the treasury loses nothing, and at worst the vault stops working."
    trigger: "An emergency, or a recovery, such as the excess above the launch cap or the end of the mandate."
    time: "Minutes."
    steps:
      - who: "Committee Safe"
        text: "The committee's Safe sends a vault token to the Aragon Agent through the operator role, from the Asset Safe or from the orders account."
        nodes: [committee, operator-modifier, asset-safe, dao]
        edges: [op-role, own-op, own]
        check: "From the orders account, the return is in the policy. From the Asset Safe, it is not in the policy yet."
      - who: "Emergency Safe"
        text: "In an emergency, the emergency Safe sends tokens to the Agent through the safety modifier, or places [[recovery order|recovery orders]] that pay the Agent."
        nodes: [emergency-safe, safety-modifier, asset-safe, dao]
        edges: [em-role, own-sf, own]
        check: "INV-038: funds reach the Aragon Agent only through these paths. Every redemption, claim and exit of a fund pays the Asset Safe."
      - who: "Monitoring"
        text: "Monitoring alerts on every transfer to the Agent."
        nodes: [monitoring, asset-safe]
        edges: [watch]
    escapes:
      - "A captured committee returns funds early: the vault stops working, and the funds stay safe in the treasury. A DAO vote can move the operator role to another Safe."
    sources: ["ADR-014#d8", "ADR-014#d9", "ADR-014#d10", "ADR-014#proposed-direction",
      "ADR-014#consequences", "ADR-007#proposed-direction", "ADR-013#d4", "INV-002", "INV-038",
      "runbook:Return assets to the Agent", "runbook:Move the operator role to another Safe"]

  # --- Reporting and monitoring -------------------------------------------------------------------
  - id: fortnightly
    group: reporting
    title: The fortnightly snapshot
    label: specified
    summary: "Every two weeks, two readings of the vault drive the published cap readings: Lido's, at a pinned block, and the policy provider's own."
    trigger: "Every two weeks."
    steps:
      - who: "Monitoring"
        text: "Monitoring runs the report generator at the snapshot's pinned block."
        nodes: [monitoring, reporting, asset-safe]
        edges: [report]
      - who: "Monitoring"
        text: "It publishes the cap ratios to IPFS."
        nodes: [monitoring, reporting]
      - who: "Policy provider"
        text: "The Zodiac UI publishes its own reading of the same snapshot to IPFS, and monitoring compares the two."
        nodes: [policy, monitoring, reporting]
      - who: "Committee"
        text: "If a cap is breached in either reading, the committee rebalances within two working days."
        nodes: [committee]
    sources: ["ADR-009#d6", "ADR-009#d24", "ADR-009#d25", "ADR-009#d31", "ADR-009#d33", "ADR-009#d40",
      "ADR-009#d41", "ADR-009#d42", "lip:part-9"]

  - id: monthly-report
    group: reporting
    title: The monthly report
    label: specified
    summary: "The committee publishes a report after each month-end. Anyone can run the generator again and check it."
    trigger: "Month-end."
    time: "Within 7 calendar days."
    steps:
      - who: "Report generator"
        text: "The generator reads the chain at a pinned block, with prices at the Snapshot Date from the [[price waterfall]]. The report lists every open order and shows the [[TMC-6 ratio]]."
        nodes: [reporting, asset-safe]
        edges: [report]
      - who: "Committee"
        text: "The committee reviews the report and publishes it on IPFS."
        nodes: [committee, reporting]
      - who: "Committee"
        text: "The forum post cites the report's IPFS identifier, and the policy provider's report next to it."
        nodes: [reporting]
      - who: "Monitoring"
        text: "Monitoring flags a late report on day 8, and the committee explains the delay on the forum. While the report is late, the proposer starts no tranche vote."
        nodes: [monitoring, funding]
    sources: ["ADR-009#d2", "ADR-009#d19", "ADR-009#d21", "ADR-009#d22", "ADR-009#d35", "ADR-009#d36",
      "ADR-009#d42", "ADR-009#d47", "ADR-007#d29", "ADR-014#proposed-direction", "lip:part-9"]

  # --- Emergencies --------------------------------------------------------------------------------
  - id: financial-incident
    group: emergencies
    title: "A financial incident: stop and pull back"
    label: built
    summary: "A depeg, a curator failure or a protocol compromise. The emergency Safe acts through the safety modifier, and no guard screens it. Each step only reduces exposure."
    trigger: "An alert, or a signer sees the risk."
    time: "Initiate within 6 hours: the mandate's ceiling. Drills must prove it."
    steps:
      - who: "Lido incident process"
        text: "The alert pages the emergency Safe's signers."
        nodes: [monitoring, emergency-safe]
        edges: [page]
      - who: "Emergency Safe, 3 of 5"
        text: "Revoke the operator's targets or functions: one revoke on the operator modifier, and one more on the orders modifier."
        nodes: [emergency-safe, safety-modifier, operator-modifier]
        edges: [em-role, revoke]
        check: "INV-018: every operator permission is under one key."
      - who: "Emergency Safe"
        text: "On the orders account, cancel the open orders and send its tokens to the Agent or the Asset Safe. Setting a relayer approval to zero also stops recovery orders in that token, until a motion raises the approval again."
        nodes: [emergency-safe, orders, dao]
      - who: "Emergency Safe"
        text: "Set the operator's approvals to zero."
        nodes: [emergency-safe, safety-modifier, asset-safe, protocols]
        edges: [em-role, own-sf, positions]
      - who: "Emergency Safe"
        text: "Exit positions into the Asset Safe: cancel, claim and redeem on Earn, and redeem sUSDS."
        nodes: [safety-modifier, asset-safe, protocols]
        edges: [own-sf, positions]
        check: "Tested on a fork for sUSDS and WETH. The Earn exits are in the policy but not yet tested."
      - who: "Emergency Safe"
        text: "Send assets home to the Aragon Agent."
        nodes: [safety-modifier, asset-safe, dao]
        edges: [own-sf, own]
        check: "INV-002: assets leave only for the Agent or for the orders account."
      - who: "Committee"
        text: "Post on the forum after the revoke."
        nodes: [committee, reporting]
    escapes:
      - "A queued motion would restore a revoked permission: the emergency Safe raises the [[motion counter]]."
      - "No recovery order can fill at a price that the signers accept: send the assets to the Agent instead."
    sources: ["ADR-005#d2", "ADR-005#d23", "ADR-006#d7", "ADR-006#d8", "ADR-006#d14", "ADR-005#d24",
      "ADR-005#d26", "ADR-005#context", "ADR-005#proposed-direction", "ADR-007#d19", "ADR-007#d41",
      "ADR-007#proposed-direction", "ADR-013#d10", "INV-002", "INV-018", "INV-033",
      "runbook:Remove a strategy", "test:test_D4_emergency_flow",
      "test:test_emergency_can_durably_stop_operator_reapproval", "runbook:Revoke the operator",
      "runbook:Zero the approvals", "runbook:Exit positions to the Safe",
      "runbook:Return assets to the Agent", "runbook:Raise the motion counter",
      "test:test_orders_emergency_revocation_keeps_recovery", "ADR-011#consequences", "ADR-009#d34"]

  - id: recovery-order
    group: emergencies
    title: A recovery order
    label: built
    summary: "When an asset must become a stablecoin in an emergency. The emergency Safe sends it to the orders account and places an order that buys USDC or USDT and pays the Aragon Agent."
    trigger: "An incident where holding the asset is the risk, for example a depeg."
    time: "Initiate within 6 hours. A recovery order lives at most 1 day. The order names its own limit, so it can fill in a depeg at a price that the signers accept."
    steps:
      - who: "Emergency Safe"
        text: "Exit the position into the Asset Safe if needed. Native ETH is staked first."
        nodes: [emergency-safe, safety-modifier, asset-safe, protocols]
        edges: [em-role, own-sf, positions]
      - who: "Emergency Safe"
        text: "Transfer the asset to the orders account."
        nodes: [safety-modifier, asset-safe, orders]
        edges: [own-sf, swaps]
      - who: "Emergency Safe"
        text: "Place a [[recovery order]]. No guard screens it, and nothing on chain bounds its price, so every emergency swap pages at high severity."
        nodes: [emergency-safe, orders]
        check: "INV-014: the emergency role's orders buy only USDC or USDT and pay only the Aragon Agent. CoW's [[EBBO]] rule holds the fill to the on-chain market, and monitoring alerts on a limit far below a market price (OD-48)."
      - who: "CoW Protocol"
        text: "CoW settles, and the proceeds go straight to the Aragon Agent. If the order does not fill, the emergency Safe signs a new one, or cancels it and sends the tokens to the Agent."
        nodes: [orders, dao]
    sources: ["ADR-007#d5", "ADR-007#d15", "ADR-007#d19", "ADR-007#d25", "ADR-007#d26",
      "ADR-007#proposed-direction", "OD-48", "INV-014", "INV-024", "runbook:Recovery order",
      "runbook:Cancel orders and sweep the orders account",
      "doc:docs/research/orders-account-fork-tests-2026-11-07.md#the-fork-tests",
      "test:test_orders_emergency_cancels_sweeps_and_recovers"]

  - id: technical-defect
    group: emergencies
    title: A defect in the permission layer
    label: built
    summary: "If the operator's permissions themselves are wrong, the emergency Safe uses the [[switch]]. The safety modifier keeps working, and a motion restarts the operator after the fix."
    trigger: "A defect in the policy, the modifier or the factory, for example a bug-bounty report."
    time: "Initiate within 6 hours."
    steps:
      - who: "Lido incident process"
        text: "The incident process pages the emergency Safe."
        nodes: [monitoring, emergency-safe]
        edges: [page]
      - who: "Emergency Safe, 3 of 5"
        text: "The emergency Safe calls `disableModule` on the Asset Safe, with the operator modifier as the pinned argument. On the orders account it revokes the operator's targets and functions instead, and cancels the operator's open orders, so recovery keeps working there. Then it raises the [[motion counter]]."
        nodes: [emergency-safe, safety-modifier, asset-safe, orders, easytrack]
        edges: [em-role, own-sf]
        check: "The counter is tested on a fork with the factory's prototype."
      - who: "Operator modifier"
        text: "The operator, governance and insurance-funding roles stop at once. Every open motion of the factory fails at enactment, because the counter changed."
        nodes: [operator-modifier, committee, easytrack]
        check: "The switch does not stop the exit-governance role on the safety modifier, but the raised counter makes the open motions that write there fail too (OD-49)."
      - who: "Emergency Safe"
        text: "The emergency Safe can still act through the safety modifier."
        nodes: [emergency-safe, safety-modifier]
        edges: [em-role]
      - who: "Committee Safe and Easy Track"
        text: "After the fix, a restart motion enables the operator modifier again. Other motions bring back what the emergency role revoked."
        nodes: [committee, easytrack, safety-modifier, asset-safe, operator-modifier]
        edges: [motions, own-sf, own-op]
        check: "INV-035: the restart role may only enable the operator modifier."
    sources: ["ADR-005#d25", "ADR-005#d26", "ADR-005#context", "ADR-005#proposed-direction", "ADR-013#d10",
      "ADR-013#d12", "ADR-013#d16", "OD-49", "INV-009", "INV-027", "INV-033", "INV-035",
      "test:test_D4_the_switch_is_the_emergency_role_s_and_pinned",
      "test:test_D4_the_switch_freezes_queued_motions_until_a_restart_motion",
      "runbook:Switch the operator off", "runbook:Raise the motion counter", "runbook:Restart after a stop"]

  - id: restart
    group: emergencies
    title: Restarting the operator after a stop
    label: specified
    summary: "After the [[switch]], a motion restarts the operator. No emergency body resumes what it stopped."
    trigger: "The cause of the stop is fixed, and the committee wants to run the vault again."
    time: "At least 72 hours."
    steps:
      - who: "Committee"
        text: "The committee posts the cause and the fix on the forum."
        nodes: [committee, reporting]
      - who: "Committee Safe"
        text: "The committee's Safe cancels the motions that it queued before the stop: they fail on the raised counter and hold motion slots. Then it creates the restart motion. The guard, once set, screens it."
        nodes: [committee, screening, easytrack]
        edges: [motions, screen]
      - who: "LDO holders"
        text: "LDO holders can object in the [[objection window]]."
        nodes: [dao, easytrack]
        edges: [object]
      - who: "Restart role"
        text: "After the window, the universal factory's restart role on the safety modifier enables the operator modifier on the Asset Safe."
        nodes: [easytrack, safety-modifier, asset-safe, operator-modifier]
        edges: [own-sf, own-op]
        check: "INV-035: the restart role may only call `enableModule` with the operator modifier as its argument. Tested on a fork, with the factory's prototype for the motion."
      - who: "Easy Track"
        text: "Other motions bring back what the emergency role revoked, on the Asset Safe and on the orders account, relayer approvals included."
        nodes: [easytrack, operator-modifier, orders]
        edges: [gov-role]
        check: "A restore motion brings back a revoked target with the permissions stored under it. On the orders account, one motion restores the operator's permissions and the relayer approvals (OD-119). Both are tested on a fork."
      - who: "Monitoring"
        text: "Monitoring alerts on every restart motion."
        nodes: [monitoring, emergency-safe]
    escapes:
      - "LDO holders object: the operator stays off."
      - "A new stop raises the counter again, so a restart motion that has not enacted fails."
      - "Easy Track is paused: only Aragon Voting unpauses it, by vote."
    sources: ["ADR-013#d3", "ADR-013#d10", "ADR-013#d12", "ADR-013#proposed-direction",
      "ADR-013#consequences", "ADR-005#d26", "ADR-005#proposed-direction", "INV-027", "INV-035",
      "runbook:Restart after a stop", "runbook:Raise the motion counter",
      "test:test_D4_the_restart_role_enables_only_the_operator_modifier",
      "test:test_uf_restart_motion_after_the_switch", "test:test_uf_restore_brings_back_a_revoked_target",
      "OD-119", "ADR-005#consequences", "ADR-006#context"]

  - id: cap-breach
    group: emergencies
    title: A cap breach that gets worse
    label: specified
    summary: "Monitoring publishes the breach, the committee fixes it, and the emergency Safe stops the operator if the breach gets worse."
    trigger: "A fortnightly cap reading, Lido's or the policy provider's, shows a breach."
    time: "Two working days to fix, then the next fortnightly snapshot."
    steps:
      - who: "Monitoring"
        text: "Monitoring publishes Lido's cap reading to IPFS, and the policy provider publishes its own. A breach in either reading counts."
        nodes: [monitoring, reporting]
      - who: "Committee"
        text: "The committee has two working days to rebalance."
        nodes: [committee]
      - who: "Monitoring"
        text: "At the next fortnightly snapshot, the breach is still there and larger. Monitoring pages the emergency Safe and links the reading."
        nodes: [monitoring, emergency-safe]
        edges: [page]
      - who: "Emergency Safe"
        text: "The emergency Safe switches the operator modifier off, revokes the operator on the orders account, and raises the motion counter. The trigger is fixed, so the duty needs no judgment."
        nodes: [emergency-safe, safety-modifier, asset-safe, operator-modifier, orders]
        edges: [em-role, own-sf]
    sources: ["ADR-009#d1", "ADR-009#d6", "ADR-009#d24", "ADR-009#d25", "ADR-009#d33", "ADR-009#d34",
      "ADR-009#d41", "ADR-005#d25", "ADR-013#d10", "runbook:Switch the operator off"]

  - id: vendor-outage
    group: emergencies
    title: "[the screening vendor] stops approving"
    label: specified
    summary: "The guard [[fail closed|fails closed]]. The operator stops, no new motion can start, and the committee's other duties on its Safe stop too. Recovery does not change."
    trigger: "Once the guard is set, the vendor's service is down or refuses everything."
    time: "Up to 10 days, the guard's removal timelock."
    steps:
      - who: "Guard"
        text: "Every transaction of the committee's Safe reverts, because no approval arrives."
        nodes: [screening, committee]
        edges: [screen]
      - who: "Monitoring"
        text: "Monitoring alerts when a transaction of the committee's Safe waits for the approval longer than the set time."
        nodes: [monitoring, committee]
      - who: "Emergency Safe"
        text: "It acts as before. No guard screens it."
        nodes: [emergency-safe, safety-modifier]
        edges: [em-role]
      - who: "Committee Safe owners"
        text: "The owners can start the guard's removal. It takes 10 days, and monitoring sees it."
        nodes: [committee, screening, monitoring]
      - who: "LDO holders"
        text: "The DAO can also give the operator role to another Safe by vote, with a new universal factory that has that Safe as its trusted caller."
        nodes: [dao, asset-safe]
        edges: [own]
    sources: ["ADR-010#d4", "ADR-010#d10", "ADR-010#d22", "ADR-010#d26", "ADR-010#proposed-direction",
      "ADR-013#d4", "ADR-013#proposed-direction", "runbook:Remove the screening guard",
      "runbook:Move the operator role to another Safe"]

  - id: unsafe-motion
    group: emergencies
    title: An unsafe motion in the queue
    label: specified
    summary: "Four stops before a motion enacts, and one after."
    trigger: "A motion looks wrong: a bad target, a wrong amount or a missing disclosure."
    time: "Before the 72-hour window ends."
    steps:
      - who: "Monitoring and the forum"
        text: "The motion-lifecycle alert and the forum disclosure show the motion."
        nodes: [monitoring, easytrack, reporting]
      - who: "LDO holders"
        text: "LDO holders object within 72 hours. An objection of 0.5% of LDO stops the motion."
        nodes: [dao, easytrack]
        edges: [object]
      - who: "Emergency Brakes multisig"
        text: "If time is short, the multisig pauses Easy Track. This stops every DAO motion, and only the DAO can unpause it."
        nodes: [easytrack]
      - who: "Emergency Safe"
        text: "The emergency Safe raises the [[motion counter]]. Every open motion of the factory then fails at enactment. For a vault motion, the emergency Safe can also switch the operator off."
        nodes: [emergency-safe, easytrack, safety-modifier, operator-modifier]
        edges: [em-role, revoke]
        check: "INV-033 is tested on a fork, with the factory's prototype and the live Easy Track."
      - who: "Committee Safe"
        text: "The committee's Safe can cancel its own motion before it enacts."
        nodes: [committee, easytrack]
        edges: [motions]
      - who: "Emergency Safe"
        text: "If the motion enacts, the emergency Safe revokes the new operator permission at once. An exit written to the safety modifier cannot be revoked that way; a DAO vote replaces it."
        nodes: [emergency-safe, safety-modifier, operator-modifier]
        edges: [em-role, revoke]
    sources: ["ADR-006#d4", "ADR-006#d13", "ADR-006#context", "ADR-005#d23", "ADR-006#d7", "ADR-006#d8",
      "ADR-006#d14", "ADR-005#d25", "ADR-005#d26", "ADR-005#context", "ADR-013#d10",
      "ADR-013#proposed-direction", "INV-033", "test:test_D1_objection_rejection",
      "test:test_D4_the_switch_freezes_queued_motions_until_a_restart_motion", "runbook:Pause Easy Track",
      "runbook:Raise the motion counter", "test:test_uf_counter_fails_every_open_motion"]

  # --- Building, deploying and changing ------------------------------------------------------------
  - id: policy-change
    group: deployment
    title: A policy change, from code to chain
    label: built
    summary: "How a permission changes. The repository is the only place where the policy changes, and a reviewer can run every check again."
    trigger: "A decision that changes a permission."
    steps:
      - who: "An engineer or an agent"
        text: "The author changes the constellation in a pull request."
        nodes: [policy]
      - who: "Compiler and CI"
        text: "The compiler builds the artifact, and the pull request carries both. CI fails when the artifact differs from a fresh compile."
        nodes: [policy]
        tech: "`bun compiler/compile.ts --manifest manifests/fork-25946643.json --check`, in the `policy` CI job."
      - who: "Reviewers"
        text: "Reviewers approve the artifact. The fork tests apply it and check what each role can and cannot do."
        nodes: [policy]
      - who: "`@lidofinance/defi-tech`"
        text: "After the merge, a team member pushes the policy to the Lido Zodiac workspace. The UI shows the difference from the chain."
        nodes: [policy]
        check: "The workspace is planned (OD-35)."
      - who: "The DAO or a motion"
        text: "The change reaches the chain only through the enabling vote, a DAO vote or a motion of the universal factory. Clutch's own `motion` command builds each motion from the merged commit."
        nodes: [dao, easytrack, operator-modifier, safety-modifier, asset-safe]
        edges: [own, own-op, own-sf, gov-role]
      - who: "Monitoring"
        text: "Later, the [[round-trip check]] and the [[drift detector]] compare the chain with the artifact."
        nodes: [policy, monitoring, asset-safe]
        edges: [watch]
        check: "INV-016 is pending."
    sources: ["ADR-004#d7", "ADR-004#d13", "ADR-004#d10", "ADR-004#d11", "ADR-004#d12", "ADR-004#d14",
      "ADR-004#d16", "ADR-013#proposed-direction", "OD-33", "OD-35", "INV-016",
      "doc:.github/workflows/policy.yml", "doc:docs/specs/specification-policy.md#the-permission-policy"]

  - id: roadmap
    group: deployment
    title: From decisions to deployment
    label: planned
    summary: "The roadmap's phases, in order. A phase starts when the gates of the phase before it close. The Status tab shows where the work is now."
    trigger: "The roadmap."
    steps:
      - who: "Phase 0: decisions"
        text: "EM accepts the ADRs."
        nodes: [committee, screening]
      - who: "Phase 1: specification"
        text: "The specifications, the control matrix, the screening rule list and the runbook drafts."
        nodes: [policy, monitoring, screening, orders]
      - who: "Phase 2: build"
        text: "The round-trip check, the first-loss Safe's roles, the universal factory, the `motion` command and reporting."
        nodes: [policy, orders, first-loss, easytrack, reporting, monitoring]
      - who: "Phase 3: assurance"
        text: "An external audit, Lido's review of the guard change, and fork drills that initiate within 6 hours."
        nodes: [policy, screening, orders]
      - who: "Phase 4: governance and deployment"
        text: "The mandate's Snapshot vote, the LIP, deployment without the guard, and the enabling vote."
        nodes: [dao, asset-safe, first-loss, funding]
      - who: "Phase 5: operation"
        text: "Monthly reports, fortnightly cap readings, budget motions after events, drills, and later tranches by vote."
        nodes: [committee, reporting, monitoring]
    sources: ["ADR-007#d40", "doc:ROADMAP.md#roadmap", "doc:ROADMAP.md#standing-gates", "OD-54", "OD-106"]

  - id: enabling-vote
    group: deployment
    title: The enabling vote
    label: specified
    summary: "One DAO vote, the [[enabling vote]], turns the system on and pays the first tranche."
    trigger: "The mandate is approved and phase 3 is done."
    steps:
      - who: "Lido"
        text: "Before the vote, fork tests show that CoW's order signer and fallback handler work on Safe v1.5.0 behind a Roles modifier."
        nodes: [orders]
        check: "INV-022 and INV-023 passed on a fork on 2026-11-07. The tests run again at a recent block before the vote."
      - who: "Committee"
        text: "The vote does not wait for the guard: the vault launches under the [[launch cap]]."
        nodes: [screening, committee]
        edges: [screen]
      - who: "Lido"
        text: "Safe's releases, advisories and bug-bounty records are checked again shortly before the vote."
        nodes: [asset-safe, committee, emergency-safe]
      - who: "LDO holders"
        text: "The vote registers the universal factory and pays the first tranche. Aragon Voting runs these items itself, without Dual Governance. For the vault's Safes, it approves the hash of each Safe batch. The factory's versions of the launch policy come from the compiled artifact."
        nodes: [dao, asset-safe, operator-modifier, safety-modifier, orders, first-loss, easytrack, funding]
        edges: [own, own-op, own-sf, treasury, tranche]
      - who: "Anyone"
        text: "After the vote executes, anyone sends each Safe batch with Voting's approval of its hash. The batches of one Safe run in nonce order."
        nodes: [asset-safe, orders, first-loss]
        check: "One command computes each batch's hash again from the published batch, so a reviewer can match it to the vote. The command is owed."
      - who: "Growth Committee, then the committee's Safe"
        text: "After the batches run, the Growth Committee moves the first-loss shares to the first-loss Safe. The committee's Safe creates motions only after the batches ran."
        nodes: [funding, first-loss, committee, easytrack]
        edges: [motions]
    sources: ["ADR-004#d14", "ADR-007#proposed-direction", "ADR-007#confirmation", "ADR-008#d13",
      "ADR-008#d19", "ADR-008#d21", "ADR-008#proposed-direction", "ADR-010#d16", "ADR-010#d20",
      "ADR-010#d22", "ADR-013#d6", "ADR-013#proposed-direction", "ADR-014#d1", "ADR-014#d2",
      "ADR-014#proposed-direction", "INV-022", "INV-023", "INV-032", "doc:ROADMAP.md#roadmap",
      "doc:docs/specs/enabling-vote.md#the-vote", "doc:docs/specs/enabling-vote.md#before-the-vote",
      "doc:docs/research/easy-track-first-2026-11-05.md#easy-track", "ADR-005#d28", "ADR-005#d32",
      "doc:docs/research/enabling-vote-rehearsal-2026-10-15.md#the-vote-that-fits"]

  - id: signer-rotation
    group: deployment
    title: Rotating a signer
    label: specified
    summary: "Two of the committee's signers sit on the [[Emergency Safe]]. Nothing on chain keeps the two Safes in step, so a rotation is a manual duty. A change of the committee's members needs no Snapshot: an alert and a runbook cover it."
    trigger: "A signer joins or leaves the committee, or a seat holder leaves the Emergency Brakes multisig."
    steps:
      - who: "Committee"
        text: "The committee's Safe changes its owner."
        nodes: [committee]
      - who: "Committee"
        text: "A signer who leaves the committee or the Emergency Brakes multisig also leaves the emergency seat, and that body appoints the successor. Only a DAO Snapshot changes the fifth seat."
        nodes: [committee, emergency-safe]
        edges: [signers-em]
      - who: "Monitoring"
        text: "Monitoring alerts on every change of the owners or the threshold of the committee's Safe, and on each owner change of the emergency Safe, as critical there."
        nodes: [monitoring, committee, emergency-safe]
        check: "INV-026: the emergency Safe keeps its seat split. Pending: the Safe is not deployed."
    sources: ["ADR-005#d24", "ADR-005#d33", "ADR-005#proposed-direction", "INV-026",
      "runbook:Rotate a signer"]
