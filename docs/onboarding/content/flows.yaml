# Flows, step by step. Each step highlights map nodes and edges when the flow plays.
# Label: built (built and tested on a fork), specified, open, existing or planned.
groups:
  - id: operations
    title: Everyday operations
    summary: "What the committee does on a normal day. The policy checks every operator transaction before it runs, and so does the screening guard once the launch cap lifts (OD-54)."
  - id: governance
    title: Changing what the operator may do
    summary: "Motions widen the operator's permissions only through fixed templates, with 72 hours for LDO holders to object. Everything else is a DAO vote."
  - id: funding
    title: Funding the vault
    summary: "Money comes from the DAO treasury through Easy Track top-ups. The objection window is the control; the registry limit is the backstop."
  - id: reporting
    title: Reporting and monitoring
    summary: "Caps are detective. Monitoring and reports measure the vault, publish the numbers and start the fix. No contract reverts on a cap."
  - id: emergencies
    title: Emergencies
    summary: "Two fast stops and one slow restart. The emergency Safe pulls assets back and can switch the operator off; the Emergency Brakes multisig can pause Easy Track; only the DAO restarts, in days."
  - id: deployment
    title: Building, deploying and changing the system
    summary: "How the policy changes, how the system goes live, and the duties that keep it in step."

flows:
  # --- Everyday operations ----------------------------------------------------------------------
  - id: op-tx
    group: operations
    title: An operator transaction
    label: built
    summary: "How the committee changes a position, for example a USDS deposit into sUSDS. The screening guard and the policy both check the transaction before it runs."
    trigger: "The committee decides to change a position within the mandate."
    time: "Minutes, after [the screening vendor] approves."
    steps:
      - who: "Committee Safe signers, 4 of 7"
        text: "The signers build the transaction in the Zodiac UI or with local tooling. It calls the operator modifier with the operator role."
        nodes: [committee]
        tech: "The call is `execTransactionWithRole` on the operator modifier, with the role key `bytes32(\"operator\")`. A batch goes through Safe's MultiSendCallOnly v1.3.0, the version of the committee's Safe."
      - who: "[the screening vendor]"
        text: "The vendor reviews the exact transaction and approves it on chain, once. Without the approval, the guard makes the committee's Safe refuse it."
        nodes: [screening, committee]
        edges: [screen]
        check: "The guard fails closed. Until the launch cap lifts, no guard is set on the committee's Safe and this step does not happen (OD-54, OD-83). INV-010 is pending: the harness has no guard yet."
      - who: "Operator modifier"
        text: "The modifier checks the call against the operator's permissions and refuses anything that the policy does not list. An approval spends its spender's budget key."
        nodes: [committee, operator-modifier]
        edges: [op-role]
      - who: "Asset Safe"
        text: "The modifier runs the call as the Asset Safe. The protocol pays any proceeds or claims to the Asset Safe, because every receiver is pinned to it."
        nodes: [operator-modifier, asset-safe, protocols]
        edges: [own-op, positions]
        check: "INV-003: every receiver, owner and beneficiary is the Asset Safe."
      - who: "Monitoring"
        text: "Monitoring records the change: approvals, budget burn and positions."
        nodes: [monitoring, asset-safe]
        edges: [watch]
        check: "Specified: the vault's detectors are not built."
    escapes:
      - "The vendor refuses: nothing runs. The committee fixes the transaction or asks again."
      - "The policy refuses: the call reverts and nothing changes."
      - "A problem shows after the call: the emergency Safe revokes the operator at once."
    sources: ["ADR-005#d9", "ADR-005#d11", "ADR-005#proposed-direction", "ADR-010#d1", "ADR-010#d4", "ADR-010#d9",
      "ADR-010#d17", "ADR-010#d20", "ADR-010#d22", "ADR-009#d13", "ADR-009#proposed-direction", INV-003, INV-010,
      "test:test_D3_operator_lifecycle", "test:test_D3b_earn_deposit_policy_layer", "ADR-005#d31", OD-80, OD-54, OD-83]

  - id: swap-order
    group: operations
    title: A market or limit order
    label: specified
    summary: "How the vault swaps one token for another. The operator sends the token to the orders account and places a CoW order there. The order pays the Asset Safe, because the policy pins the receiver."
    trigger: "The committee wants a different mix of assets, for example less stETH and more USDC, now or at a set price."
    time: "A market order fills in minutes. A limit order can stand for up to 90 days (OD-61)."
    steps:
      - who: "Operator"
        text: "The operator transfers the token from the Asset Safe to the [[orders account]]. The transfer spends that token's orders budget, and the policy pins the recipient."
        nodes: [committee, operator-modifier, asset-safe, orders]
        edges: [op-role, own-op, swaps]
        check: "Specified: the orders account and its permissions are not in the policy yet."
      - who: "Committee Safe"
        text: "On the orders account, the committee's Safe signs a market or [[limit order]] through CoW's order signer. The screening guard checks this transaction too."
        nodes: [committee, screening, orders]
        edges: [screen]
        check: "INV-022: the order's receiver is the Asset Safe."
        tech: "A delegatecall to `signOrder(order, validDuration, feeAmountBP)` on the order signer. The policy pins the sell and buy tokens to the operator's lists, the receiver to the Asset Safe, `validDuration` to the maximum order life, and the fee bound. The enabling vote has already approved CoW's vault relayer for each listed token."
      - who: "CoW Protocol"
        text: "CoW's solvers compete to fill the order at its limit or better. The settlement pays the Asset Safe directly."
        nodes: [orders, asset-safe]
        edges: [swaps]
      - who: "Monitoring"
        text: "Monitoring checks the fill against a market price, and alerts on tokens left in the orders account. At 30 days it asks the committee to confirm or cancel each open order, and each monthly report lists every open order."
        nodes: [monitoring, orders]
      - who: "Operator"
        text: "An order that has not filled can be cancelled with `unsignOrder`. Unused tokens go back to the Asset Safe."
        nodes: [orders, asset-safe]
        edges: [swaps]
    escapes:
      - "The vendor refuses the order: nothing runs."
      - "A fill comes in far below the market: monitoring alerts, and the emergency Safe can cancel the open orders and sweep the account."
    sources: ["ADR-007#d18", "ADR-007#d23", "ADR-007#d26", "ADR-007#d29", "ADR-007#proposed-direction", OD-43, OD-61,
      INV-013, INV-022, INV-024, "runbook:Re-affirm open orders", "runbook:Cancel orders on a policy change",
      "doc:docs/research/cow-orders-account-2026-10-06.md#the-cow-order-signer"]

  - id: standing-order
    group: operations
    title: A TWAP order
    label: specified
    summary: "How the vault buys or sells over time. ComposableCoW holds the order, and CoW's watch-tower posts it to the order book."
    trigger: "The committee wants to average into a position over weeks."
    time: "Until the last part fills or the order expires."
    steps:
      - who: "Operator"
        text: "The operator funds the orders account from the Asset Safe, under the orders budget."
        nodes: [committee, operator-modifier, asset-safe, orders]
        edges: [op-role, own-op, swaps]
      - who: "Committee Safe"
        text: "The committee's Safe creates a [[TWAP]] order on ComposableCoW, in equal parts. It starts at once and ends within 90 days. The screening guard checks it."
        nodes: [committee, screening, orders]
        edges: [screen]
        check: "INV-022: the receiver is the Asset Safe. The launch has no stop-loss orders (OD-79)."
        tech: "`ComposableCoW.createWithContext` with a start of zero and CoW's current-timestamp value factory, so the order starts at its creation, and the handler pinned to the deployed TWAP handler. A TWAP order has at most 90 parts at most a day apart, or 12 parts at most 7 days apart (INV-024). The orders account's fallback handler is CoW's `ExtensibleFallbackHandler`, and ComposableCoW verifies CoW's settlement domain for it (INV-023)."
      - who: "CoW's watch-tower"
        text: "The [[watch-tower]] posts each part of a TWAP order when it is due."
        nodes: [orders]
      - who: "CoW Protocol"
        text: "Each part fills at its minimum or better, and pays the Asset Safe directly."
        nodes: [orders, asset-safe]
        edges: [swaps]
      - who: "Monitoring"
        text: "Monitoring checks each fill, and alerts when a part is not posted on time."
        nodes: [monitoring, orders]
    escapes:
      - "The watch-tower stops: the orders wait and no funds move. The committee can remove them with `remove` and place ordinary orders."
      - "The emergency Safe can cancel every open order and sweep the orders account."
    sources: ["ADR-007#d17", "ADR-007#d18", "ADR-007#d24", "ADR-007#d29", "ADR-007#proposed-direction", OD-43, OD-61,
      INV-022, INV-023, INV-024, "runbook:Re-affirm open orders",
      "doc:docs/research/cow-orders-account-2026-10-06.md#conditional-orders-twap-and-stop-loss", "ADR-007#d39", OD-79]

  # --- Governance ---------------------------------------------------------------------------------
  - id: onboard
    group: governance
    title: Onboarding a new protocol by motion
    label: specified
    summary: "How the committee adds a protocol without a full DAO vote. It creates an Easy Track motion through a fixed template, and LDO holders have 72 hours to object. The policy's limits on the governance role are built and tested on a fork; the template factories are not built."
    trigger: "The committee wants a new target, for example Lido Lend after its launch."
    time: "At least 72 hours, then enactment."
    steps:
      - who: "Committee"
        text: "The committee posts a disclosure on the forum. It sets up monitoring for the new target and updates the runbooks."
        nodes: [committee, reporting, monitoring]
      - who: "Committee Safe"
        text: "The committee's Safe creates the motion on the template factory, with typed values only: a target, an asset and a budget key. The screening guard checks this transaction."
        nodes: [committee, screening, easytrack]
        edges: [motions, screen]
        check: "The budget key must already be in the policy: a new spender takes one of the spare keys that the enabling vote holds (OD-69). A token new to the orders account needs a DAO vote (OD-46, OD-78)."
      - who: "LDO holders"
        text: "The motion waits 72 hours. If holders of 0.5% of LDO object, it fails. This window is the timelock for every structural increase of exposure. The Emergency Brakes multisig can also pause Easy Track."
        nodes: [dao, easytrack]
        edges: [object]
      - who: "Easy Track"
        text: "At enactment, Easy Track rebuilds the script and requires the hash stored at creation. A changed script fails."
        nodes: [easytrack]
        check: "INV-005, tested on a mock Easy Track."
      - who: "Governance role"
        text: "The script executor writes the new operator permission through the governance role. The modifier checks this write too: the operator key only, no role change, no delegatecall and no administrative target."
        nodes: [easytrack, operator-modifier]
        edges: [gov-role]
        check: "INV-004: the Asset Safe and every module of it are refused as targets (OD-38)."
      - who: "Exit-governance role"
        text: "The same script gives the emergency role the new target's exits on the safety modifier: redeem, withdraw, claim and cancel pinned to the Asset Safe, a transfer pinned to the Agent, and an approval set to zero."
        nodes: [easytrack, safety-modifier]
        check: "INV-025: this role writes only under the emergency key, with no delegatecall, allowance or administrative target. Specified, not built (OD-49)."
      - who: "Operator, and the emergency Safe if needed"
        text: "The operator can use the new permission. The emergency Safe can revoke it at once."
        nodes: [committee, operator-modifier, emergency-safe, safety-modifier]
        edges: [op-role, em-role, revoke]
    escapes:
      - "An objection of 0.5% of LDO stops the motion."
      - "The Emergency Brakes multisig pauses Easy Track. Only the DAO can unpause it."
      - "The emergency Safe's switch freezes the motion, because its write goes through the operator modifier. The DAO's restart vote cancels the motion first (OD-59)."
      - "The committee's Safe cancels its own motion."
      - "After enactment, the emergency Safe revokes the new operator permission at once. A write to the safety modifier cannot be revoked that way: only an objection, the Easy Track pause or a DAO vote stops it (OD-49)."
    sources: ["ADR-006#d2", "ADR-006#d3", "ADR-006#d4", "ADR-006#d5", "ADR-006#d7", "ADR-006#d8", "ADR-006#d9",
      "ADR-006#d10", "ADR-006#d11", "ADR-006#d13", "ADR-006#context", "ADR-006#proposed-direction", "ADR-005#d26",
      INV-004, INV-005, INV-025, OD-36, OD-38, OD-45, OD-49, OD-59, "lip:part-4",
      "test:test_D1_substituted_script_rejected_at_enactment", OD-69, OD-78, "ADR-007#d38", OD-46]

  - id: budget
    group: governance
    title: A budget motion
    label: specified
    summary: "How a budget key changes. There is no routine retune: the committee files a budget motion only after an event (OD-56)."
    trigger: "An event: a new mandate size, a new spender, a product's unlock, or the lift of the launch cap. A price move is not an event."
    time: "72 hours."
    steps:
      - who: "Committee"
        text: "The attested computation derives the key's new budget, under that key's ceiling. The forum post names the event."
        nodes: [committee, asset-safe]
        check: "A motion sets only a key that the policy already holds, so a new spender takes a spare key (OD-69). A new mandate size also needs a DAO vote for the funding limits and the fixed approval ceilings, by design (OD-71, OD-89)."
      - who: "Committee Safe"
        text: "The committee's Safe creates a motion on the budget factory. The guard screens it, once the guard is set (OD-54)."
        nodes: [committee, screening, easytrack]
        edges: [motions, screen]
      - who: "Easy Track"
        text: "After 72 hours without an objection, the executor sets the budget through the governance role. The refill period stays at 30 days or more."
        nodes: [easytrack, operator-modifier, dao]
        edges: [gov-role, object]
        check: "INV-012: the 30-day floor is tested; the per-key ceilings wait for the attested figures."
      - who: "Monitoring"
        text: "Monitoring flags every budget motion, and checks that its forum post names an event."
        nodes: [monitoring]
    sources: ["ADR-009#d3", "ADR-009#d15", "ADR-009#d31", "ADR-009#proposed-direction", "ADR-009#consequences", INV-011,
      INV-012, OD-56, OD-69, OD-71, "lip:part-7", "test:test_D1_budget_motion_cannot_shorten_the_refill_period", OD-54, OD-89]

  - id: dao-change
    group: governance
    title: A change that only the DAO can make
    label: built
    summary: "The owner path. The DAO can do anything to the Asset Safe: replace the policy, change who holds a role, enable a module again or move the operator role to another Safe. It is also the only path that restarts after an emergency stop (OD-59). Each such change takes days."
    trigger: "A change outside the motions' limits, a repair after a defect in the safety modifier, or a restart after the switch."
    time: "About five days: the Aragon Voting vote."
    steps:
      - who: "LDO holders"
        text: "LDO holders vote in Aragon Voting."
        nodes: [dao]
      - who: "Aragon Voting"
        text: "Aragon Voting sends the Asset Safe transaction itself, or approves it by hash, as the only owner. Nothing passes Dual Governance (OD-73)."
        nodes: [dao, asset-safe]
        edges: [own]
      - who: "Asset Safe"
        text: "The Asset Safe runs the change, for example a new policy on both modifiers."
        nodes: [asset-safe, operator-modifier, safety-modifier]
        edges: [own-op, own-sf]
    sources: ["ADR-005#d14", "ADR-005#d26", "ADR-005#context", "ADR-005#proposed-direction", OD-59, INV-001,
      "test:test_D2_direct_DAO_path", "runbook:Move the operator role to another Safe", "runbook:Replace the operator modifier",
      "runbook:Restart after a stop", OD-73, "ADR-005#d28", "ADR-005#d30"]

  - id: unlock
    group: governance
    title: Unlocking a matured Lido product
    label: specified
    summary: "A new Lido product, Lido Lend first, counts against the protocol cap until it matures. A budget motion with a forum post unlocks it, so LDO holders can object."
    trigger: "The product meets the maturity criteria in the mandate. earnETH and earnUSD are not new products."
    time: "72 hours."
    steps:
      - who: "Committee"
        text: "The committee posts on the forum which maturity criteria the product meets."
        nodes: [committee, reporting]
      - who: "Committee Safe"
        text: "The committee's Safe creates a budget motion that raises the product's budget key. The screening guard checks it."
        nodes: [committee, screening, easytrack]
        edges: [motions, screen]
      - who: "LDO holders"
        text: "LDO holders have 72 hours to object. An objection of 0.5% of LDO stops the unlock."
        nodes: [dao, easytrack]
        edges: [object]
      - who: "Easy Track"
        text: "The motion enacts through the governance role. From then on, reports count the product as a Lido product, outside the protocol cap."
        nodes: [easytrack, operator-modifier, reporting]
        edges: [gov-role]
    sources: ["ADR-009#d28", "ADR-009#d30", "ADR-009#proposed-direction", "ADR-006#d4", "ADR-006#d11", "ADR-006#context",
      OD-41, OD-45, "runbook:Unlock a matured product"]

  - id: rule-change
    group: governance
    title: Relaxing a screening rule
    label: specified
    summary: "What the chain cannot enforce, screening checks before execution. A rule that gets weaker gets change control, so it cannot loosen quietly."
    trigger: "The committee wants to relax a rule in [the screening vendor]'s service."
    steps:
      - who: "Committee and `@lidofinance/defi-tech`"
        text: "A pull request changes the written list of the vendor's rules in the control matrix. Reviewers approve it."
        nodes: [committee, policy]
      - who: "Committee"
        text: "The committee gives notice on the forum (OD-64)."
        nodes: [committee, reporting]
      - who: "[the screening vendor]"
        text: "The vendor applies the change, after its own delay if it has one."
        nodes: [screening]
    sources: ["ADR-010#d19", "ADR-010#d23", "ADR-010#proposed-direction", OD-39, OD-45, OD-64,
      "doc:docs/specs/control-matrix.md#the-screening-vendors-rules"]

  # --- Funding ------------------------------------------------------------------------------------
  - id: topup
    group: funding
    title: A top-up
    label: specified
    summary: "How money moves from the DAO treasury to the vault after the seed. The committee's Safe creates an Easy Track top-up motion, within the mandate size and the treasury share."
    trigger: "The mandate's published eligibility conditions for a replenishment are met, and the vault has headroom under the mandate size (OD-89)."
    time: "72 hours."
    steps:
      - who: "Committee"
        text: "The committee posts the top-up on the forum: the funded value, the headroom under the mandate size, and the vault's share of the DAO's non-LDO treasury. The post links both readings' latest reports (OD-85)."
        nodes: [committee, reporting]
        check: "No top-up starts while the report is late, while the committee's estimate prices more than the set share of the vault (OD-62), or while Lido's reading and the policy provider's differ by more than the band (OD-84). Until the launch cap lifts, the committee asks for a top-up only while the vault stays at or below the cap, and the post states the room left under it (OD-54)."
      - who: "Committee Safe"
        text: "The committee's Safe creates a top-up motion. The guard screens it, once the guard is set (OD-54)."
        nodes: [committee, screening, easytrack]
        edges: [motions, screen]
      - who: "LDO holders"
        text: "LDO holders have 72 hours to object."
        nodes: [dao, easytrack]
        edges: [object]
      - who: "Easy Track and Aragon Finance"
        text: "At enactment, the registry checks its limit for the month again, and Aragon Finance pays the Asset Safe from the treasury."
        nodes: [easytrack, funding, dao, asset-safe]
        edges: [topup-motion, treasury, topup]
        check: "INV-017: only the Asset Safe, only allowed tokens, within the limit. Pending: nothing is built yet."
      - who: "Monitoring"
        text: "Monitoring flags a top-up above the posted headroom, a top-up that would take the vault above the mandate size or the treasury share, and any top-up after an objected one. Until the launch cap lifts, it also alerts on a top-up motion that would take the vault above the cap."
        nodes: [monitoring]
    escapes:
      - "An objection stops the top-up. The mandate then asks for a Snapshot vote."
      - "The registry refuses a payment above its remaining limit."
    sources: ["ADR-008#d3", "ADR-008#d4", "ADR-008#d5", "ADR-008#d6", "ADR-008#d20", "ADR-008#d32", "ADR-008#d33", "ADR-008#d34", "ADR-008#proposed-direction",
      "ADR-009#d19", "ADR-009#d21", "ADR-009#d36", "ADR-009#d41", "ADR-009#d42", OD-54, OD-62, OD-84, OD-85, OD-89, INV-017, "runbook:Top up the vault",
      "runbook:Re-set a funding limit", "lip:part-5"]

  - id: seed
    group: funding
    title: Launch funding and the first-loss shares
    label: specified
    summary: "How the vault gets its first assets. After the enabling vote, the Growth Committee moves the DAO's first-loss Earn shares to the first-loss Safe. Then one seed motion funds the rest."
    trigger: "The enabling vote has executed, its Safe batches have run, and the Safes exist (OD-92)."
    steps:
      - who: "Growth Committee Safe"
        text: "The Growth Committee Safe transfers the first-loss earnETH and earnUSD shares to the [[first-loss Safe]]. That Safe needs no permission to receive them."
        nodes: [funding, first-loss]
      - who: "Committee Safe"
        text: "The committee's Safe creates the seed motion. It is at most the mandate size, less the value of the first-loss shares (OD-89). Until the launch cap lifts, it is also at most the cap (OD-54)."
        nodes: [committee, easytrack, funding]
        edges: [motions, topup-motion]
      - who: "Easy Track and Aragon Finance"
        text: "After 72 hours, Aragon Finance pays the Asset Safe through the funding registries."
        nodes: [easytrack, funding, asset-safe, dao]
        edges: [treasury, topup]
      - who: "The committee"
        text: "From then on, on the Earn team's written instruction, a burn motion burns the shares, and the first-loss role of the committee's Safe redeems them to the Agent. No other role reaches the first-loss Safe, and monitoring alerts on any change of its balance."
        nodes: [committee, first-loss, monitoring]
        edges: [first-loss-shares]
        check: "INV-021: the first-loss Safe has Aragon Voting as its only owner, and one modifier with two narrow roles. Specified, not built."
    sources: ["ADR-008#d4", "ADR-008#d13", "ADR-008#d19", "ADR-008#d20", "ADR-008#d21", "ADR-008#d23",
      "ADR-008#proposed-direction", OD-21, OD-42, OD-54, OD-60, OD-67, INV-021, "runbook:Move the legacy Earn shares", "runbook:Burn first-loss Earn shares", OD-89, OD-92]

  - id: first-loss-burn
    group: funding
    title: A first-loss burn or exit
    label: specified
    summary: "How the DAO's first-loss Earn shares absorb a loss, as the March 2026 terms say. The committee executes the terms without a DAO vote: a burn is an Easy Track motion, with its objection window, and an exit goes through one narrow role (OD-60, OD-67)."
    trigger: "A loss of at least 1% in earnETH or earnUSD that the curators confirm, or a confirmed material risk."
    time: "A burn: at least 72 hours, the objection window. An exit: minutes to initiate, then the redeem queue. Both start after the Earn team's written instruction."
    steps:
      - who: "Earn team and curators"
        text: "A curator flags the loss, and the vault's curators confirm it. The Earn team instructs the committee in writing: burn up to all of the DAO's shares in that vault, or exit through the vault's normal redemption."
        nodes: [protocols, committee]
        check: "Below 1%, a Snapshot exception comes first, as after the Kelp incident."
      - who: "Committee Safe, 4 of 7"
        text: "For a burn, the committee's Safe creates a motion on the first-loss burn factory, and the forum post with the instruction goes up with it. For an exit, it requests and claims the redemption through the first-loss role, and the proceeds go to the Aragon Agent. Once the launch cap lifts, the screening guard checks both transactions."
        nodes: [committee, screening, easytrack, first-loss, protocols]
        edges: [screen, motions, first-loss-shares]
        check: "INV-021: only an enacted motion can burn the shares, and neither role can transfer or approve them. Specified, not built."
      - who: "Easy Track, after 72 hours"
        text: "If LDO holders do not object, anyone enacts the motion. The Easy Track script executor calls `burn` on the share token through the first-loss burn role."
        nodes: [easytrack, first-loss, protocols]
        edges: [first-loss-shares]
      - who: "Monitoring"
        text: "Monitoring pages on the motion and on the action, and alerts on the change of the first-loss Safe's balance."
        nodes: [monitoring, easytrack, first-loss]
      - who: "Committee"
        text: "The incident update follows on the forum within seven days. Reports show the first-loss amount less the burn."
        nodes: [committee, reporting]
    escapes:
      - "LDO holders object: the motion fails, and nothing burns. The DAO can still burn by vote, as the Safe's owner."
      - "Depositors see the motion for 72 hours and can time their entries and exits, so the vault should pause deposits and redemptions until the burn, as Lido Earn did after the Kelp incident."
      - "A curator freezes the vault: an exit waits for the vault, and a burn still works."
      - "The DAO changes or ends the authorisation: a vote changes or removes the roles and the burn factory."
    sources: ["ADR-008#d14", "ADR-008#d21", "ADR-008#d22", "ADR-008#d23", "ADR-008#context", "ADR-008#proposed-direction",
      "ADR-008#consequences", "ADR-005#d27", OD-60, OD-67, INV-021, "runbook:Burn first-loss Earn shares",
      "runbook:Exit the first-loss shares",
      "doc:docs/research/cfo-feedback-2026-10-13.md#the-first-loss-terms"]

  # --- Reporting and monitoring -------------------------------------------------------------------
  - id: fortnightly
    group: reporting
    title: The fortnightly snapshot
    label: specified
    summary: "Every two weeks, two readings of the vault drive the published cap readings: Lido's, at a pinned block, and the policy provider's own. Budgets no longer follow them (OD-56)."
    trigger: "Every two weeks."
    steps:
      - who: "Monitoring"
        text: "Monitoring runs the report generator at the snapshot's pinned block."
        nodes: [monitoring, reporting, asset-safe]
        edges: [report]
      - who: "Monitoring"
        text: "It publishes the cap ratios to IPFS."
        nodes: [monitoring, reporting]
      - who: "Policy provider"
        text: "The Zodiac UI publishes its own reading of the same snapshot to IPFS, and monitoring compares the two (OD-84, OD-85)."
        nodes: [policy, monitoring, reporting]
      - who: "Committee"
        text: "If a cap is breached in either reading, the committee rebalances within two working days."
        nodes: [committee]
    sources: ["ADR-009#d6", "ADR-009#d24", "ADR-009#d25", "ADR-009#d31", "ADR-009#d33", "ADR-009#d40", "ADR-009#d41", "ADR-009#d42",
      OD-32, OD-56, OD-84, OD-85, "lip:part-9"]

  - id: monthly-report
    group: reporting
    title: The monthly report
    label: specified
    summary: "The committee publishes a report within seven calendar days after month-end. Anyone can run the generator again and check it."
    trigger: "Month-end."
    time: "Within 7 calendar days."
    steps:
      - who: "Report generator"
        text: "The generator reads the chain at a pinned block, with prices at the Snapshot Date from the five-level waterfall, Coingecko first. Each price carries its level and its source, and the report lists every open order."
        nodes: [reporting, asset-safe]
        edges: [report]
      - who: "Committee"
        text: "The committee reviews the report and publishes it on IPFS."
        nodes: [committee, reporting]
      - who: "Committee"
        text: "The forum post cites the report's IPFS identifier, and the policy provider's report next to it. The post is the reports' only anchor (OD-85)."
        nodes: [reporting]
      - who: "Monitoring"
        text: "If the report is late, no top-up starts. Monitoring flags it on day 8, and the committee explains the delay on the forum."
        nodes: [monitoring, funding]
    sources: ["ADR-009#d2", "ADR-009#d19", "ADR-009#d21", "ADR-009#d22", "ADR-009#d35", "ADR-009#d36", "ADR-009#d42", "ADR-007#d29",
      OD-14, OD-61, OD-62, OD-85, "lip:part-9"]

  - id: buffer-low
    group: reporting
    title: The liquidity buffer runs low
    label: specified
    summary: "The vault keeps at least one month of baseline spend in stablecoins and sUSDS. A detector watches it all the time, and the committee restores it within the mandate's window."
    trigger: "The buffer falls toward its floor, for example after a large deposit or a missed top-up."
    time: "The mandate's window."
    steps:
      - who: "Monitoring"
        text: "The buffer detector warns at a margin above the floor, and alerts at the floor."
        nodes: [monitoring, asset-safe]
        edges: [watch]
      - who: "[the screening vendor]"
        text: "If the vendor can check it, screening refuses an operator transaction that would take the buffer below its floor."
        nodes: [screening, committee]
        edges: [screen]
        check: "Requested from the vendor, not confirmed."
      - who: "Zodiac UI"
        text: "The UI's signing flow refuses an operator transaction that would take the buffer below its floor, in its own interface only (OD-86)."
        nodes: [policy, committee]
      - who: "Committee"
        text: "The committee restores the buffer: it exits a position, or sells through a CoW order into a stablecoin."
        nodes: [committee, operator-modifier, asset-safe, protocols, orders]
        edges: [op-role, own-op, positions, swaps]
      - who: "Reporting"
        text: "Every report of both readings shows the buffer against its floor (OD-84)."
        nodes: [reporting, policy]
    sources: ["ADR-009#d27", "ADR-009#d29", "ADR-009#d40", "ADR-009#d43", "ADR-009#proposed-direction", OD-40, OD-44, OD-84, OD-86,
      "runbook:Restore the liquidity buffer", "doc:docs/specs/control-matrix.md#the-matrix"]

  # --- Emergencies --------------------------------------------------------------------------------
  - id: financial-incident
    group: emergencies
    title: "A financial incident: stop and pull back"
    label: built
    summary: "A depeg, a curator failure or a protocol compromise. The emergency Safe acts through the safety modifier at 3 of 5, and no guard screens it. Each step only reduces exposure."
    trigger: "An alert, or a signer sees the risk."
    time: "Initiate within 6 hours: the mandate's ceiling. Drills must prove it."
    steps:
      - who: "Lido incident process"
        text: "The alert pages the emergency Safe's signers."
        nodes: [monitoring, emergency-safe]
        edges: [page]
      - who: "Emergency Safe, 3 of 5"
        text: "Revoke the operator's targets or functions. One revoke reaches every operator permission on the operator modifier; the orders modifier needs one more, once it exists."
        nodes: [emergency-safe, safety-modifier, operator-modifier]
        edges: [em-role, revoke]
        check: "INV-018: every operator permission is under one key."
      - who: "Emergency Safe"
        text: "On the orders account, cancel the open orders and send its tokens to the Agent or the Asset Safe. Setting a relayer approval to zero also stops recovery orders in that token until a DAO vote."
        nodes: [emergency-safe, orders, dao]
        check: "Specified: the orders account does not exist yet."
      - who: "Emergency Safe"
        text: "Set the operator's approvals to zero."
        nodes: [emergency-safe, safety-modifier, asset-safe, protocols]
        edges: [em-role, own-sf, positions]
      - who: "Emergency Safe"
        text: "Exit positions into the Asset Safe: cancel, claim and redeem on Earn, and redeem sUSDS."
        nodes: [safety-modifier, asset-safe, protocols]
        edges: [own-sf, positions]
        check: "Tested on a fork for sUSDS and WETH. The Earn exits are in the policy but not yet tested."
      - who: "Emergency Safe"
        text: "Send assets home to the Aragon Agent. The transfer goes only to this fixed address."
        nodes: [safety-modifier, asset-safe, dao]
        edges: [own-sf, own]
        check: "INV-002: assets leave only for the Agent, or for the orders account once it exists."
      - who: "Committee"
        text: "Post on the forum after the revoke."
        nodes: [committee, reporting]
    escapes:
      - "A queued motion would restore a revoked permission: the emergency Safe's switch freezes it, or the Emergency Brakes multisig pauses Easy Track. Only the DAO restarts, and its vote cancels the motion first (OD-59)."
      - "No recovery order can fill at a price that the signers accept: send the assets to the Agent instead."
    sources: ["ADR-005#d2", "ADR-005#d4", "ADR-005#d11", "ADR-005#d24", "ADR-005#d26", "ADR-005#context",
      "ADR-005#proposed-direction", "ADR-007#d19", "ADR-007#proposed-direction", OD-58, OD-59, INV-002, INV-018,
      "runbook:Remove a strategy", "test:test_D4_emergency_flow",
      "test:test_emergency_can_durably_stop_operator_reapproval", "runbook:Revoke the operator",
      "runbook:Zero the approvals", "runbook:Exit positions to the Safe", "runbook:Return assets to the Agent",
      "ADR-005#d30"]

  - id: recovery-order
    group: emergencies
    title: A recovery order
    label: specified
    summary: "When an asset must become a stablecoin in an emergency. The emergency Safe sends it to the orders account and places an order that buys USDC or USDT and pays the Aragon Agent."
    trigger: "An incident where holding the asset is the risk, for example a depeg."
    time: "Initiate within 6 hours. A recovery order lives at most 1 day, and the emergency Safe signs a new one if it does not fill. The order names its own limit, so it can fill in a depeg at a price that the signers accept."
    steps:
      - who: "Emergency Safe"
        text: "Exit the position into the Asset Safe if needed. Native ETH is staked first; wstETH, WETH and sUSDS can be sold as they are."
        nodes: [emergency-safe, safety-modifier, asset-safe, protocols]
        edges: [em-role, own-sf, positions]
      - who: "Emergency Safe"
        text: "Transfer the asset to the orders account. The policy pins the recipient."
        nodes: [safety-modifier, asset-safe, orders]
        edges: [own-sf, swaps]
        check: "Specified: the orders account is not in the policy yet."
      - who: "Emergency Safe"
        text: "Place a [[recovery order]] that buys USDC, or USDT as the second destination, and pays the Aragon Agent. No guard screens it, and nothing on chain bounds its price, so every emergency swap pages at high severity."
        nodes: [emergency-safe, orders]
        check: "INV-014: the emergency role's orders buy only USDC or USDT and pay only the Aragon Agent. CoW's EBBO rule holds the fill to the on-chain market, and monitoring alerts on a limit far below a market price (OD-48)."
      - who: "CoW Protocol"
        text: "CoW settles, and the proceeds go straight to the Aragon Agent. If the order does not fill, the emergency Safe signs a new one, or cancels it and sends the tokens to the Agent."
        nodes: [orders, dao]
        check: "USDS and DAI carry USDC risk, so recovery can buy USDT when USDC is the problem."
    sources: ["ADR-007#d5", "ADR-007#d15", "ADR-007#d19", "ADR-007#d25", "ADR-007#d26", "ADR-007#proposed-direction",
      OD-26, OD-43, OD-47, OD-48, INV-014, INV-024, "runbook:Recovery order",
      "runbook:Cancel orders and sweep the orders account"]

  - id: technical-defect
    group: emergencies
    title: A defect in the permission layer
    label: built
    summary: "If the operator's permissions themselves are wrong, the emergency Safe switches the operator modifier off. The safety modifier keeps working, and only the DAO restarts."
    trigger: "A defect in the policy, the modifier or a factory, for example a bug-bounty report."
    time: "Initiate within 6 hours."
    steps:
      - who: "Lido incident process"
        text: "The incident process pages the emergency Safe."
        nodes: [monitoring, emergency-safe]
        edges: [page]
      - who: "Emergency Safe, 3 of 5"
        text: "The emergency Safe calls `disableModule` on the Asset Safe through the emergency role. The module argument is pinned to the operator modifier. On the orders account it revokes the operator's targets and functions instead, and cancels the operator's open orders, so recovery keeps working there (OD-58)."
        nodes: [emergency-safe, safety-modifier, asset-safe, orders]
        edges: [em-role, own-sf]
        check: "Built for the Asset Safe. Specified for the orders account."
      - who: "Operator modifier"
        text: "The operator and governance roles stop at once, and so does every queued motion that writes through them."
        nodes: [operator-modifier, committee, easytrack]
        check: "The switch does not stop the exit-governance role on the safety modifier. A motion that writes there stops only by an objection, the Easy Track pause or a DAO vote (OD-49)."
      - who: "Emergency Safe"
        text: "The emergency Safe can still act through the safety modifier."
        nodes: [emergency-safe, safety-modifier]
        edges: [em-role]
      - who: "LDO holders"
        text: "Only the DAO can enable the operator modifier again. Its vote first cancels the queued motions, because a motion does not expire, and also grants again the operator's permissions on the orders account (OD-59)."
        nodes: [dao, asset-safe, orders]
        edges: [own]
    sources: ["ADR-005#d25", "ADR-005#d26", "ADR-005#context", "ADR-005#proposed-direction", OD-58, OD-59, INV-009,
      INV-027, "test:test_D4_the_switch_is_the_emergency_role_s_and_pinned",
      "test:test_D4_the_switch_freezes_queued_motions_until_the_dao_restarts", "runbook:Switch the operator off",
      "runbook:Restart after a stop", "ADR-005#d30", OD-49]

  - id: cap-breach
    group: emergencies
    title: A cap breach that gets worse
    label: specified
    summary: "No contract reverts on a cap. Monitoring publishes the breach, the committee fixes it, and the emergency Safe stops the operator if the breach gets worse."
    trigger: "A fortnightly cap reading, Lido's or the policy provider's, shows a breach."
    time: "Two working days to fix, then the next fortnightly snapshot."
    steps:
      - who: "Monitoring"
        text: "Monitoring publishes Lido's cap reading to IPFS, and the policy provider publishes its own. A breach in either reading counts (OD-84)."
        nodes: [monitoring, reporting]
      - who: "Committee"
        text: "The committee has two working days to rebalance."
        nodes: [committee]
      - who: "Monitoring"
        text: "At the next fortnightly snapshot, the breach is still there and larger. Monitoring pages the emergency Safe and links the reading."
        nodes: [monitoring, emergency-safe]
        edges: [page]
      - who: "Emergency Safe"
        text: "The emergency Safe switches the Asset Safe's operator modifier off. Once the orders account exists, it also revokes the operator there (OD-58). The trigger is fixed, so the duty needs no judgment."
        nodes: [emergency-safe, safety-modifier, asset-safe, operator-modifier, orders]
        edges: [em-role, own-sf]
    sources: ["ADR-009#d1", "ADR-009#d6", "ADR-009#d24", "ADR-009#d25", "ADR-009#d33", "ADR-009#d34", "ADR-009#d41", "ADR-005#d25",
      OD-29, OD-32, OD-58, OD-84, "runbook:Switch the operator off"]

  - id: vendor-outage
    group: emergencies
    title: "[the screening vendor] stops approving"
    label: specified
    summary: "The guard fails closed. The operator stops, no new motion can start, and the committee's other duties on its Safe stop too (OD-83). Recovery does not change."
    trigger: "Once the guard is set, the vendor's service is down or refuses everything (OD-54)."
    time: "Up to 10 days, the guard's removal timelock."
    steps:
      - who: "Guard"
        text: "Every transaction of the committee's Safe reverts, because no approval arrives: operator transactions, new motions and the committee's other duties."
        nodes: [screening, committee]
        edges: [screen]
      - who: "Monitoring"
        text: "Monitoring alerts when a transaction of the committee's Safe waits for the approval longer than the set time (OD-88)."
        nodes: [monitoring, committee]
      - who: "Emergency Safe"
        text: "It acts as before. No guard screens it."
        nodes: [emergency-safe, safety-modifier]
        edges: [em-role]
      - who: "Committee Safe owners"
        text: "The owners can start the guard's removal. It takes 10 days, and monitoring sees it."
        nodes: [committee, screening, monitoring]
      - who: "LDO holders"
        text: "The DAO can also give the operator role to another Safe by vote."
        nodes: [dao, asset-safe]
        edges: [own]
    sources: ["ADR-010#d4", "ADR-010#d10", "ADR-010#d22", "ADR-010#d26", "ADR-010#proposed-direction", OD-54,
      "runbook:Remove the screening guard", "runbook:Move the operator role to another Safe", OD-83, OD-88]

  - id: unsafe-motion
    group: emergencies
    title: An unsafe motion in the queue
    label: specified
    summary: "Four stops before a motion enacts, and one after."
    trigger: "A motion looks wrong: a bad target, a wrong amount or a missing disclosure."
    time: "Before the 72-hour window ends."
    steps:
      - who: "Monitoring and the forum"
        text: "The motion-lifecycle alert and the forum disclosure show the motion."
        nodes: [monitoring, easytrack, reporting]
      - who: "LDO holders"
        text: "LDO holders object within 72 hours. An objection of 0.5% of LDO stops the motion."
        nodes: [dao, easytrack]
        edges: [object]
      - who: "Emergency Brakes multisig"
        text: "If time is short, the multisig pauses Easy Track. This stops every DAO motion, and only the DAO can unpause it."
        nodes: [easytrack]
      - who: "Emergency Safe"
        text: "For a vault motion, the emergency Safe can also switch the operator off. The motion's write goes through the operator modifier, so it cannot enact. Only the DAO restarts, and its vote cancels the motion first (OD-59)."
        nodes: [emergency-safe, safety-modifier, operator-modifier]
        edges: [em-role, revoke]
      - who: "Committee Safe"
        text: "The committee's Safe can cancel its own motion before it enacts."
        nodes: [committee, easytrack]
        edges: [motions]
      - who: "Emergency Safe"
        text: "If the motion enacts, the emergency Safe revokes the new operator permission at once. An exit written to the safety modifier cannot be revoked that way; a DAO vote replaces it (OD-49)."
        nodes: [emergency-safe, safety-modifier, operator-modifier]
        edges: [em-role, revoke]
    sources: ["ADR-006#d4", "ADR-006#d7", "ADR-006#d13", "ADR-006#context", "ADR-006#proposed-direction", "ADR-005#d4",
      "ADR-005#d11", "ADR-005#d25", "ADR-005#d26", "ADR-005#context", OD-49, OD-59, "test:test_D1_objection_rejection",
      "test:test_D4_the_switch_freezes_queued_motions_until_the_dao_restarts", "runbook:Pause Easy Track"]

  # --- Building, deploying and changing ------------------------------------------------------------
  - id: policy-change
    group: deployment
    title: A policy change, from code to chain
    label: built
    summary: "How a permission changes. The repository is the only place where the policy changes, and a reviewer can run every check again."
    trigger: "A decision that changes a permission."
    steps:
      - who: "An engineer or an agent"
        text: "The author changes the constellation in a pull request."
        nodes: [policy]
      - who: "Compiler and CI"
        text: "The compiler builds the artifact, and the pull request carries both. CI fails when the artifact differs from a fresh compile."
        nodes: [policy]
        tech: "`bun compiler/compile.ts --manifest manifests/fork-25946643.json --check`, in the `policy` CI job."
      - who: "Reviewers"
        text: "Reviewers approve the artifact. The fork tests apply it and check what each role can and cannot do."
        nodes: [policy]
      - who: "`@lidofinance/defi-tech`"
        text: "After the merge, a team member pushes the policy to the Lido Zodiac workspace. The UI shows the difference from the chain."
        nodes: [policy]
        check: "The workspace is planned (OD-35)."
      - who: "The DAO or a motion"
        text: "The change reaches the chain only through the enabling vote, a DAO vote or a bounded motion."
        nodes: [dao, easytrack, operator-modifier, safety-modifier, asset-safe]
        edges: [own, own-op, own-sf, gov-role]
      - who: "Monitoring"
        text: "Later, the round-trip check and the drift detector compare the chain with the artifact."
        nodes: [policy, monitoring, asset-safe]
        edges: [watch]
        check: "INV-016 is pending."
    sources: ["ADR-004#d7", "ADR-004#d9", "ADR-004#d10", "ADR-004#d11", "ADR-004#d12", "ADR-004#d13", "ADR-004#d14",
      "ADR-004#d16", OD-33, OD-35, INV-016, "doc:.github/workflows/policy.yml",
      "doc:docs/specs/specification-policy.md#the-permission-policy"]

  - id: roadmap
    group: deployment
    title: From decisions to deployment
    label: planned
    summary: "The roadmap's phases, in order. A phase starts when the gates of the phase before it close. The Status tab shows where the work is now."
    trigger: "The roadmap."
    steps:
      - who: "Phase 0: decisions"
        text: "EM accepts the setup and design ADRs. [the screening vendor]'s written terms are due before the launch cap lifts (OD-54)."
        nodes: [committee, screening]
      - who: "Phase 1: specification"
        text: "The specifications and the detector specification, the control matrix and the screening rule list with the vendor's questions, the Zodiac UI requirement list, the orders account's fork tests, the runbook drafts and the Lido Zodiac workspace."
        nodes: [policy, monitoring, screening, orders]
      - who: "Phase 2: build"
        text: "The round-trip check, the orders account and its permissions, the first-loss Safe with its two roles, the Easy Track factories with their emergency exits, the funding path, the report generator, the buffer detector, the mandate's rule data, the comparison of the two readings, and the invariant-to-test check."
        nodes: [policy, orders, first-loss, easytrack, funding, reporting, monitoring]
      - who: "Phase 3: assurance"
        text: "An external audit, Lido's review of the guard change and of CoW's order signer, and fork drills that initiate within 6 hours."
        nodes: [policy, screening, orders]
      - who: "Phase 4: governance and deployment"
        text: "The mandate's Snapshot vote, a Snapshot that appoints the emergency Safe's fifth signer, the LIP, the enabling vote and deployment without the guard under a cap of one million dollars, the share transfer to the first-loss Safe and the seed motion."
        nodes: [dao, asset-safe, first-loss, funding]
      - who: "Phase 5: operation"
        text: "Monthly reports, the fortnightly cap reading, budget motions after events and recurring drills. Once the guard is set with its bypass mode off, the committee's forum post lifts the launch cap."
        nodes: [committee, reporting, monitoring]
    sources: ["doc:ROADMAP.md#roadmap", "doc:ROADMAP.md#standing-gates", OD-54]

  - id: enabling-vote
    group: deployment
    title: The enabling vote
    label: specified
    summary: "One DAO vote turns the system on. The enabling-vote page lists what it holds, what comes before it and what follows without a vote."
    trigger: "The mandate is approved and phase 3 is done."
    steps:
      - who: "Lido"
        text: "Before the vote, fork tests show that CoW's order signer and fallback handler work on Safe v1.5.0 behind a Roles modifier."
        nodes: [orders]
        check: "INV-022 and INV-023 are pending."
      - who: "Committee"
        text: "The vote does not wait for the guard. The vault launches under a cap of one million dollars, which the committee keeps by procedure until the guard is set with its bypass mode off and its forum post lifts the cap (OD-54, OD-55)."
        nodes: [screening, committee]
        edges: [screen]
      - who: "Lido"
        text: "Safe's releases, advisories and bug-bounty records are checked again shortly before the vote."
        nodes: [asset-safe, committee, emergency-safe]
      - who: "LDO holders"
        text: "The vote registers the factories and adds USDS to the payment permission and to the shared stablecoin token list (OD-93). Aragon Voting runs these items itself, without Dual Governance (OD-73). For the vault's Safes, it approves the hash of each Safe batch: the batches apply the policy compiled for mainnet from the reviewed constellation, grant the roles, the exit-governance role and the two first-loss roles included, and set up the orders account with its order lists and relayer approvals (OD-92)."
        nodes: [dao, asset-safe, operator-modifier, safety-modifier, orders, first-loss, easytrack, funding]
        edges: [own, own-op, own-sf]
      - who: "Anyone"
        text: "After the vote executes, anyone sends each Safe batch with Voting's approval of its hash. The batches of one Safe run in nonce order (OD-92)."
        nodes: [asset-safe, orders, first-loss]
        check: "One command computes each batch's hash again from the published batch, so a reviewer can match it to the vote. The command is owed."
      - who: "Growth Committee, then the committee's Safe"
        text: "After the batches run, the Growth Committee moves the first-loss shares to the first-loss Safe, and the seed motion funds the vault."
        nodes: [funding, first-loss, asset-safe, committee, easytrack]
        edges: [topup, motions]
    sources: ["ADR-004#d14", "ADR-007#proposed-direction", "ADR-007#confirmation", "ADR-008#d9", "ADR-008#d13",
      "ADR-008#d19", "ADR-008#d21", "ADR-008#proposed-direction", "ADR-010#d16", "ADR-010#d20", "ADR-010#d21",
      "ADR-010#d22", "ADR-008#d10", INV-022, INV-023, OD-54, "doc:ROADMAP.md#roadmap",
      "doc:docs/specs/enabling-vote.md#the-vote",
      "doc:docs/research/single-vote-review-2026-10-14.md#how-one-vote-carries-two-kinds-of-item", OD-73, "ADR-005#d28",
      OD-78, OD-79, OD-55, OD-92, OD-93, "ADR-005#d32", "ADR-008#d35", "ADR-008#d36",
      "doc:docs/research/enabling-vote-rehearsal-2026-10-15.md#the-vote-that-fits"]

  - id: signer-rotation
    group: deployment
    title: Rotating a signer
    label: specified
    summary: "The committee's Safe carries the committee's seven signers, and two of them sit on the emergency Safe. Nothing on chain keeps them in step, so a rotation is a manual duty."
    trigger: "A signer joins or leaves the committee, or a seat holder leaves the Emergency Brakes multisig."
    steps:
      - who: "Committee"
        text: "The committee's Safe changes its owner."
        nodes: [committee]
      - who: "Committee"
        text: "A signer who leaves the committee also leaves an emergency seat, and the committee appoints the successor there. The Emergency Brakes multisig does the same for its two seats, and only a DAO Snapshot changes the fifth (OD-58)."
        nodes: [committee, emergency-safe]
        edges: [signers-em]
      - who: "Monitoring"
        text: "Monitoring alerts on each owner change of the committee's Safe and the emergency Safe, as critical on the emergency Safe."
        nodes: [monitoring, committee, emergency-safe]
        check: "INV-026: exactly two owners of the emergency Safe are owners of the committee's Safe, two are owners of the Emergency Brakes Safe, and one is an owner of neither. Pending: the Safe is not deployed."
    sources: ["ADR-005#d24", "ADR-005#proposed-direction", OD-58, INV-026, "runbook:Rotate a signer"]
