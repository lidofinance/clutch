date: '2026-10-06'
kind: Decision
text: Recorded EM's choices for OD-46. A DAO vote adds a token to the orders account's lists, with its relayer approval, emergency transfer and recovery orders; no template adds one, because the order signer's permission is a delegatecall (OD-36). The swap-instance template leaves the catalogue, and five templates remain. The operator's lists start with stETH, wstETH, WETH, USDC, USDT, USDS and LDO, so WETH trades in CoW orders instead of only through staking and the withdrawal queue. Updated ADR 006, ADR 007, ADR 011, the LIP, the parameters, the verification requests and the guide.
