date: '2026-10-02'
kind: Decision
text: Recorded EM's choices for OD-08. An approval to a protocol spender spends the budget of the key it serves, and deposits no longer spend it, because a spender can pull an approval without any deposit call. The stETH approval to the wstETH contract keeps a fixed ceiling of one TM Floor Value in stETH. The refill-period floor is 30 days. Updated ADR 009, the LIP, INV-008, INV-012, the parameters and the kit README's divergence list. Added OD-22 on DAI, which no operator permission moves.
