date: '2026-10-06'
kind: Update
text: 'Added the Mandate and Constellation tabs to the [onboarding guide](/onboarding/guide.md) at EM''s request. The Mandate tab shows ten parts of the draft, each with what the draft says, how Clutch keeps it on each layer, and Clutch''s changes with their reasons: the eleven that the mandate text owes (ADR 009), five design choices and one proposal. It shows no figure from the draft, and the build refuses a currency sign or a percentage in its content. The Constellation tab draws the two modifiers and four roles from the committed artifact, the three parts that are specified but not built, and the fourteen changes from the policy provider''s constellation with their reasons; on a phone, each change stacks. The detail switch worked, but Technical added only 13 notes, in a few tabs. It now also shows every address, a note in every tour scene and mandate part, and each role''s targets, and a caption says what it adds. The browser tests check the switch in every tab and in the panel, and the new tabs against the content and the artifact; eight deliberate faults each fail a test. EM''s console error did not reproduce. The page loads nothing, and its only URL references are the map''s same-document arrow markers; Playwright''s Chromium logged no such message, headless or headed. Chrome prints that message when it refuses a same-origin load from a `file:` page, such as an external SVG sprite, so the load most likely comes from outside the page, for example from a browser extension. Also moved the "can object" arrow label, which covered the DAO''s box in a headed browser.'
