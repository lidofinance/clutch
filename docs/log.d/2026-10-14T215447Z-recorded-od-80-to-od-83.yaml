date: '2026-10-14'
kind: Decision
text: 'Recorded OD-80 to OD-82. The committee''s own Safe, at 4 of 7 on Safe v1.3.0, holds the operator role and the first-loss role and is the trusted caller of every factory, so Clutch deploys no operator Safe (OD-80). The diagrams carry no node for the Emergency Brakes multisig, and the guide states two facts about it: it can pause Easy Track, and two of the emergency Safe''s signers come from it (OD-81). The closed decisions moved into a data file, and the validator now generates the register''s closed index with each OD''s state, the ADR index and each proposed ADR''s open decisions, and it fails on a stale block, on unknown references and on a replacement of a later OD; the guide''s build refuses a source that names a replaced OD (OD-82). Opened OD-83: where the screening guard goes when the launch cap lifts.'
