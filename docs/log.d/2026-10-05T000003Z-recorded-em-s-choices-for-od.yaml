date: '2026-10-05'
kind: Decision
text: 'Recorded EM''s choices for OD-11. A DAO vote adds USDS to the shared payment permission, and the stablecoin registry uses the shared token list with USDS added, so the funding assets are USDC, USDT, DAI, USDS, sUSDS and stETH. ETH is not a funding asset. Recorded the DAO-wide effect of the rewrite and the mandate-text change that funding in sUSDS needs. Re-read the payment permission and the Agent''s USDS and sUSDS at block 26125804. Updated ADR 008, ADR 009, ADR 011, the LIP and the registers. Recorded EM''s choice for OD-24: at most 2,000,000 USDS per payment. Removed ADR 008''s stale open question on OD-07, which was decided on 2026-10-02.'
