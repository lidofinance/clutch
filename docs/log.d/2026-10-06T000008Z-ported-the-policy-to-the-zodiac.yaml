date: '2026-10-06'
kind: Update
text: 'Ported the policy to the Zodiac constellation (ADR 004, decision 15). `policy/constellation/` holds the two modifiers and the four roles with explicit signatures; Clutch''s TypeScript compiler writes the committed fork artifact (105 calls); the Solidity builders are deleted. The fork suites share one fixture that checks the manifest''s addresses and applies the artifact; 41 tests pass, and eight policy mutations each fail their test. Added a test that the emergency role cannot give a non-zero approval. The mainnet dry run is now deploy, compile, apply, rehearsed on a local fork; its deploy and teardown scripts no longer use Foundry''s default sender, whose key is public. Opened OD-36: a governance motion can grant the operator delegatecall, which a fork probe used to rewrite the Asset Safe''s storage.'
