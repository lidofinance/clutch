date: '2026-10-05'
kind: Decision
text: Recorded EM's choices for OD-20. The committee's Safe, as manager of the shared Stonks price router, adds the USDC, USDT, DAI and USDS feeds before the enabling vote, and re-syncs a feed after Chainlink replaces it; Lido deploys one USD-anchored converter through the existing factory; the vote starts only if every vault token is configured and in sync. Only stETH, LDO, USDC, USDT, USDS and DAI are swapped, because Chainlink's registry has no wstETH, WETH or sUSDS entry. wstETH is unwrapped and sUSDS redeemed before a sale, and WETH goes through stETH by staking and the withdrawal queue. Added the pricing research note, INV-020 and a re-sync runbook entry. Updated ADR 005, ADR 007, ADR 009, ADR 011, the registers, the LIP, the roadmap, the 2026-10-02 Stonks note, the ADR and research indexes, and the kit README's divergence list.
