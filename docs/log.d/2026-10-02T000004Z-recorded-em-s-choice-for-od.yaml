text: 'Recorded EM''s choice for OD-04: Lido Lend counts against the protocol cap for its first three months, then is uncapped as a Lido product. Updated ADR 009, ADR 011, the open decisions (OD-04 closed; OD-12 gains the start-date reading), the parameters and the LIP draft. The attested computation now switches the Lido Lend key on that date.'
