date: '2026-10-14'
kind: Update
text: 'Reviewed whether Clutch launches with one Aragon vote and then runs on Easy Track alone. Launch: yes, by design; a new spec page lists what the enabling vote holds, Voting items and Agent items. After launch: five gaps, opened as OD-68 to OD-72. Fixed the restart, which missed the orders account, and stale text in ADR 005, ADR 011, INV-023, the roadmap, the parameters register and the guide.'
