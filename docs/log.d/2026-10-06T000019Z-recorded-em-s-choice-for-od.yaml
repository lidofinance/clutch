date: '2026-10-06'
kind: Decision
text: 'Recorded EM''s choice for OD-48. Recovery orders have no on-chain price floor: CoW''s solver competition and EBBO rule hold a fill to the on-chain market, every emergency swap pages at high severity, and monitoring alerts on a recovery order whose limit sits far below a market price. The GoodAfterTime floor stays a research item, because it needs an order poster of Lido''s own and Milkman''s Chainlink checker ignores stale feeds. Added CoW''s rules and the Milkman checker to the research note, and corrected "at any price" in the LIP, ADR 007 and the guide.'
