date: '2026-10-06'
kind: Decision
text: Recorded EM's choice for OD-31. On a human's explicit written instruction, an agent may record that human's own acceptance and verification, marked with `recorded_by` and a `ref` to the decision-log heading that quotes the instruction; never for a body. Updated `AGENTS.md` at EM's request, ADR 002 and ADR 003, and the validator, which checks the new fields and marks such entries `(recorded)` in the status register. Added `recorded_by` and `ref` to the four entries of 2026-10-05 in ADR 001 to ADR 004.
