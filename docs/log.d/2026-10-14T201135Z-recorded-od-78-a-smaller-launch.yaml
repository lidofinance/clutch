text: 'Recorded OD-78, a smaller launch. Insurance funds, the token template with the orders modifier''s governance and approvals roles, and the restore template leave the launch. A new token for the orders account and every restart after a stop stay DAO votes. INV-028, INV-030 and INV-031 are retired; the launch registers ten factories, or eleven with a claim template.'
