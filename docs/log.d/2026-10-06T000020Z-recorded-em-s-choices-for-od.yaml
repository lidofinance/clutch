date: '2026-10-06'
kind: Decision
text: Recorded EM's choices for OD-49, against the agent's recommendation. A motion that onboards a protocol also adds its emergency exit, through a new exit-governance role on the safety modifier held by the Easy Track script executor. The role writes only under the `emergency` key, without delegatecall, allowances or administrative targets (INV-025), and each template emits only exit shapes for it. Lido Lend is a separate Morpho-Blue-compatible deployment, so its address and its emergency exit enter with its onboarding motion. Updated ADR 005, ADR 006, ADR 007, ADR 011, the LIP, the control matrix, the parameters, the verification requests and the guide. No decision is open now except OD-23, which EM deferred.
