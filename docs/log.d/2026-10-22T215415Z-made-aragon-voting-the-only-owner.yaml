date: '2026-10-22'
kind: Update
text: Made Aragon Voting the only owner of the Asset Safe in the kit's harness, at EM's request (OD-73). A Voting stand-in now approves every owner action by approveHash, and the mock Agent stays the recovery destination. The fork Asset Safe and its two modifiers moved, so the fork manifest and the artifact follow, with the same 97 calls. 59 fork tests pass, and the dry run was rehearsed again on anvil at block 26249900. The LIP's test table, INV-001 and ADR 005 now cite commit 03efa77.
