date: '2026-10-06'
kind: Decision
text: Recorded EM's choices for OD-39 to OD-45, after the committee's meeting of 2026-10-06. Every mandate rule gets a control on each layer that can carry it, in the new [control matrix](/specs/control-matrix.md) (OD-39). The vault keeps a liquidity buffer of at least one month of baseline spend; a detector watches it, and reports and the Zodiac UI show it (OD-40). A new Lido product, Lido Lend first, stays in the protocol cap until it matures and a motion unlocks it; earnETH and earnUSD are not new; this replaces the three-month rule of OD-04 and OD-12 (OD-41). A dedicated first-loss Safe with no modules holds the first-loss Earn shares (OD-42). An orders account replaces the Stonks 2.0 instances for both roles, with CoW market, limit, TWAP and stop-loss orders and no router at launch; ADR 007 is renamed to match (OD-43). The Zodiac UI gets a written list of requirements, with Lido's readings as the canonical figures (OD-44). Motions are the timelock for structural increases of exposure, and a relaxation of a screening rule gets change control (OD-45). Updated ADR 005 to ADR 011, the invariants (INV-020 retired, INV-021 to INV-023 added), the parameters, the runbooks, the LIP, the roadmap, the verification requests and the onboarding guide. The Emergency Brakes multisig verifies the changed text.
