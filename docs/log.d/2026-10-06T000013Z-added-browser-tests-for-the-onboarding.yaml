date: '2026-10-06'
kind: Update
text: 'Added browser tests for the onboarding guide at EM''s request. `scripts/test_onboarding_page.py` drives the committed page in headless Chromium with Playwright: 21 groups and 136 checks, which take what to expect from the content, cover every control, and add a layout check of the map and an axe-core accessibility scan. A new docs CI job runs them. Eighteen deliberate faults in the page''s script and style each fail a test. Fixed what the tests found: link text below the contrast floor, technical notes and dead controls without JavaScript, a page that scrolled sideways on a phone, tooltips missing in the panel and covering it after a tap, focus lost when the player closed, a skip link that did not move focus, collapsed sections in print, skipped heading levels, and two arrow labels that overlapped. The map now also reads as a list of its boxes and arrows.'
