date: '2026-10-06'
kind: Decision
text: Recorded EM's choices for OD-47. The operator's market and limit orders live at most 30 days, through the order signer's `validDuration`. A TWAP order starts at its creation and ends within 30 days, with at most 30 daily or 4 weekly parts. A screening rule is requested that refuses a stop-loss expiry more than 30 days ahead, and monitoring alerts on any open order older than 30 days. A recovery order lives at most 1 day. Added INV-024, and updated ADR 007, ADR 010, the control matrix, the LIP, the parameters, the runbooks, the verification requests and the guide.
