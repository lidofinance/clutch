date: '2026-11-05'
kind: Decision
text: 'Recorded EM decisions of 2026-11-01 and 2026-11-05, OD-100 to OD-112: one universal Easy Track factory with versions, no Aragon vote after launch except funding tranches and break-glass actions, funding by tranche votes with the first inside the enabling vote, insurance for earnETH, earnUSD and Lido Lend at launch, and only emergency and recovery paying the Aragon Agent (ADR 013, ADR 014).'
