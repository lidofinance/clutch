text: 'Swept every document for inconsistencies with the decided design. Fixed stale text in ADR 005 to ADR 011, the LIP draft, the invariants, the control matrix, the enabling-vote spec, the registers, the roadmap, the README, CONTRIBUTING and the guide: the guard screens only from the lift of the launch cap, routine removals are motions (OD-70), Aragon Voting is the owner (OD-73), LDO is out (OD-91), the owed mandate text is sorted in the LIP (OD-90), and the rehearsal ran the owner and first-loss checks (OD-92). Cut repeated text, about 1,250 words from the LIP. Archived the three superseded research notes as deprecated. OD-28 now shows as replaced in part, and OD-27 carries the withdrawal-queue note. Repinned 195 reviewed guide items.'
