text: Recorded EM's answers to OD-12. The vision reading, the acceptor reading and the start of Lido Lend's capped months at its mainnet launch are confirmed. The Lido-side party to the vendor agreement is the party that already holds the vendor's arrangement for the guarded Lido multisigs, and the repository does not name it. Updated ADR 002, ADR 009, ADR 010, the product brief, the parameters and the LIP.
