date: '2026-10-05'
kind: Decision
text: Recorded EM's choices for OD-17 after the due diligence on Safe v1.5.0. The Asset Safe, the operator Safe and the emergency Safe use v1.5.0, and EM reported that the screening vendor confirmed its v1.5.0 support, which removes the operator Safe's v1.4.1 fallback. The Agent authorizes Asset Safe transactions only by `approveHash` or by sending them, and the Asset Safe has no fallback handler. Safe's releases and advisories are checked again before the enabling vote. The vendor is asked to refuse delegatecalls except to MultiSendCallOnly, and monitoring alerts on a singleton change. Added the due-diligence research note and its two scripts in `scripts/research/`. Updated ADR 005, ADR 009, ADR 010, the registers, INV-001, the LIP, the roadmap, the 2026-10-02 research note, the ADR and research indexes, and three stale kit comments. Added INV-019. The invariants page now names ADR 004 as a source, because INV-016 comes from it.
