date: '2026-10-06'
kind: Decision
text: Recorded EM's choice for OD-38, option B. The governance role refuses the Asset Safe and every module of the Asset Safe as an administered target. The manifest lists the modules, and the dry-run deploy script writes them. The compiler refuses a policy or a manifest that breaks the rule. Updated ADR 005 and ADR 006 (decision 10), INV-004, the LIP, the verification requests, the harness README and the onboarding guide. Added a fork test that replays the probe, a fork test that refuses every module that the Asset Safe enables on chain, a fixture check that the manifest lists exactly those modules, and six compiler tests. 44 fork tests and 11 compiler tests pass. With the old guard, the compiler refuses to compile; with its check also removed, both new fork tests fail. A dry run on a local fork deployed, compiled and applied 105 calls, and refused the safety modifier as a target.
