date: '2026-10-13'
kind: Decision
text: Recorded EM's answers to the committee's feedback of 2026-10-12 (OD-58 to OD-63). The Emergency Brakes multisig touches no funds and keeps only the Easy Track pause. The emergency Safe becomes three of five, with two committee members, two Emergency Brakes members and a fifth signer who is a member of neither body, and its role holds the switch; the technical role goes. No emergency body restarts what it stopped. The committee's Safe holds a narrow first-loss role. Every operator order lives at most 90 days. A five-level price waterfall replaces unpriced assets, and the Zodiac UI is also asked to show Lido's alerts. The Emergency Brakes multisig no longer verifies records.
