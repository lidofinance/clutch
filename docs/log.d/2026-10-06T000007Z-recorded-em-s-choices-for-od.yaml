text: Recorded EM's choices for OD-34 and OD-35. Files derived from the provider's constellation keep LGPL-3.0-only, with an SPDX line once changed, and the licence check of ADR 001 covers `policy/`; `AGENTS.md` changed at EM's request. The repository-owner team owns the Lido Zodiac workspace and its API key; a member pushes from the merged `main`, and CI holds no key. Amended ADR 001 and ADR 004; EM verifies both again.
