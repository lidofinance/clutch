date: '2026-10-07'
kind: Update
text: 'Added the RFP tab to the [onboarding guide](/onboarding/guide.md) at EM''s request, and a [research note](/research/request-for-solution-2026-10-07.md) that records what the request for solution asked of the policy provider, without its allocation figures. The tab maps 34 asks in eight parts to the decided design: 24 as asked, 8 changed with their reasons, and 2 not answered yet, the alert times and a liability line for the net asset value. It also shows the four properties that the request asked any other design to keep, and 8 additions that it did not ask for. The build fails when an ask is not in the note word for word, when a change has no reason, or when a figure appears. Browser tests check the counts, the parts, the asks and the reasons; nine deliberate faults each fail a test. On a phone, the tabs now keep one row that scrolls sideways.'
