date: '2026-10-06'
kind: Decision
text: 'Opened OD-46 to OD-49 after an independent review of this change. A motion cannot add a token to the orders account''s lists, because the order signer''s permission is a delegatecall (OD-36), so the order-token template is withdrawn and a DAO vote adds a token until EM decides OD-46. OD-47 asks for the maximum order life, and OD-48 for an on-chain price floor on recovery orders, which no guard screens. OD-49 records an older gap: a protocol that a motion onboards has no emergency exit until a DAO vote adds one. The proposed direction now has the enabling vote set the orders account''s relayer approvals, so recovery orders can settle. Extended INV-004, INV-008, INV-009, INV-021 and INV-023 to the new accounts, gave the control matrix an owner column, and marked LIP parts 2 and 6 as implemented in part.'
