date: '2026-10-05'
kind: Decision
text: Recorded EM's choices for OD-25 to OD-30, the acceptance round and the emergency exit. ADR 001's licence check now covers `scripts/`, and ADR 003 decision 6 covers production parameters, not the kit's dry-run values; EM accepts ADR 001 to ADR 004 after this merges. Recovery also sells USDC, USDS and DAI into USDT, so it has ten instances. The stETH approval to Lido's withdrawal queue has a fixed ceiling, as the wstETH approval does, and the kit drops its budget key. The no-redeem rule for the first-loss Earn shares binds the emergency role too. A worsening cap breach lets the Emergency Brakes multisig disable the operator modifier on a fixed trigger. The emergency Safe stays a subset of the committee, and the LIP states that the fast exit is not independent of it. The mandate text now owes eight changes. Added the [recovery note](/research/recovery-and-withdrawal-queue-2026-10-05.md); updated ADR 001, 003, 005, 007, 008, 009 and 011, the LIP, INV-008, the registers and the runbooks list.
