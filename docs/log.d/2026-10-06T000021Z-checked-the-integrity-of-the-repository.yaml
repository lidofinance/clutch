date: '2026-10-06'
kind: Update
text: 'Checked the integrity of the repository at EM''s request. Every CI job ran on a clean checkout: the docs bundle, the status register, both test scripts, the guide''s fresh-build check, the browser tests and the policy artifact; the fork suite and a deploy-and-apply rehearsal on a local anvil fork passed too. A cross-reference check found no broken decision, open-decision, invariant or link reference. An independent audit of the onboarding guide against the current design found gaps, now fixed: the exit-governance role on the map and its cards; the counts of roles and modifiers; the first-loss burn in the DAO flow; the TWAP creation call; the orders account in the incident, cap-breach and technical-defect flows; the operator Safe''s own cancel in the unsafe-motion flow; the roadmap phases; a legend entry for governance arrows; new cards for the vault''s tokens and order lists (OD-46) and for Lido Lend (OD-49); and the owed list. README and the docs index now list the control matrix, and the harness divergences name the exit-governance role.'
