kind: Decision
text: Recorded EM's choices for OD-92 to OD-94. The enabling vote approves the hash of each Safe batch, and anyone executes the batches after it; the registry factories deploy the registries with Voting as admin, and a check before the vote proves every role; the vote keeps the four USDS items, against the agent's recommendation; monitoring warns when few Easy Track motion slots are free, and the budget factory can set several keys in one motion.
