date: '2026-10-06'
kind: Update
text: 'Added the [onboarding guide](/onboarding/guide.md) (OD-37). One self-contained interactive page, `docs/onboarding/clutch-onboarding.html`, that `scripts/build_onboarding.py` builds from content files and from the repository''s own facts. It has a system map of 16 groups, 54 actor cards, a ten-scene tour, 20 flows that play on the map, 25 ranked assumptions, 30 reuse rows, 51 glossary terms and an eight-question self-check. The map has 16 groups and 54 cards, not the 12 and 47 of the interview: the protocols, the swap contracts and the policy pipeline got their own groups, and contracts that act differently got their own cards. Flows say "Built and tested on a fork" where the LIP says Implemented, because nothing is deployed. The build fails on an unresolved reference, a glossary link without a term, an address that the repository does not record, or a fork-test stand-in address, and CI fails on a stale page. Added the Guide page type to the validator, the guide rule to the specification policy, a test of the build''s checks, and the CI steps that EM asked for.'
