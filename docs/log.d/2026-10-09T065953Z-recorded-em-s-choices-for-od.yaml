text: 'Recorded EM''s choices for OD-54 to OD-56: a launch without the screening guard under a one-million-dollar cap that the committee keeps by procedure and a forum post lifts once the guard is live (ADR 010, ADR 008), and budgets without a routine retune (ADR 009). OD-57 stays open with a clearer question.'
