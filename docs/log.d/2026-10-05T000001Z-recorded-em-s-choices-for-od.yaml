date: '2026-10-05'
kind: Decision
text: Recorded EM's choices for OD-09. The two removal templates are dropped, and every removal is the emergency Safe's immediate revoke, posted on the forum afterwards. The design uses no DAO-scoped role keys, so the role-toggle factory and the governance role's `assignRoles` permission leave it, and the revoke reaches every operator permission. Recorded that Easy Track never allows a window below 48 hours. Updated ADR 005, ADR 006, ADR 010, the LIP, the runbooks and the kit README. Retired INV-007 and added INV-018.
