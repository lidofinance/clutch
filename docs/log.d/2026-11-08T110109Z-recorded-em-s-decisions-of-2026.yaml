text: 'Recorded EM''s decisions of 2026-11-08: EM accepted INV-040''s amendment and the pinned trees of the orders modifier''s governance role (ADR 007, decision 44), and decided to build the exit-governance role now, so that the motion that adds a token to the order lists also writes the token''s exit on the Asset Safe, a transfer to the Agent or the orders account (ADR 007, decision 45).'
