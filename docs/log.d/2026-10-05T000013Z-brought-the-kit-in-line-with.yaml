date: '2026-10-05'
kind: Update
text: Brought the kit in line with the decisions. The policy drops Aave, sDAI, order pre-signing and the CoW relayer approvals (ADR 007, ADR 011); adds the DAI–USDS converter (OD-22), staking, WETH and the Lido withdrawal queue (OD-20); spends each approval on its spender's budget key, with fixed ceilings for the wstETH contract and the converter (OD-08); and floors a budget motion's refill period at 30 days. The toggle factory, the mock module guard and their tests are removed (OD-09, OD-01). New fork drills cover the converter, staking, the withdrawal-queue round trip, the WETH route, the Asset Safe's shape, the operator's single key and the launch scope; negative drills now require the modifier's own error. Updated the invariants, the harness README, the LIP test table and every ADR line about the kit. Dated a kit claim in the DAI note. Fixed the wording of INV-002, the ADR 005 lead-in, three ADR 008 options, the ADR 008 index line and ADR 009's count of mandate changes. Added the licence header to the Python scripts.
